          REVOKE ALL ON ALL TABLES IN SCHEMA reporting
            FROM PUBLIC, winwidget_reporting_runtime, winwidget_reporting_backup;
          REVOKE ALL ON ALL SEQUENCES IN SCHEMA reporting
            FROM PUBLIC, winwidget_reporting_runtime, winwidget_reporting_backup;
          REVOKE ALL ON ALL FUNCTIONS IN SCHEMA reporting
            FROM PUBLIC, winwidget_reporting_runtime, winwidget_reporting_backup;
          GRANT SELECT, INSERT, UPDATE, DELETE
