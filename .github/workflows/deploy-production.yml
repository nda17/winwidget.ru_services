        run: |
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Run Notification Delivery database lifecycle on VPS
        env:
          APP_ROOT: /opt/winwidget
          EXPECTED_PROD_REVISION: ${{ github.sha }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "APP_ROOT='$APP_ROOT' EXPECTED_PROD_REVISION='$EXPECTED_PROD_REVISION' bash -s" <<'EOF'
          set -euo pipefail
          cd "$APP_ROOT/winwidget.ru_server"

          guard_campaigns_checkout_before_pull() {
            local expected_revision="$1"
            local lifecycle_script="scripts/campaigns-database-lifecycle.sh"
            local staged_marker="$APP_ROOT/deploy/backend/.campaigns-first-cutover-staged-v1"
            local cutover_marker="$APP_ROOT/deploy/backend/.campaigns-database-cutover-v1"
            local tracked_blob actual_blob

            [[ "$expected_revision" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Expected production revision is invalid." >&2
              return 1
            }
            tracked_blob="$(
              git rev-parse --verify "HEAD:$lifecycle_script" 2>/dev/null ||
                true
            )"
            if [[ -e "$lifecycle_script" || -L "$lifecycle_script" ]]; then
              [[ -f "$lifecycle_script" && ! -L "$lifecycle_script" ]] || {
                echo "Campaigns lifecycle guard script is unsafe." >&2
                return 1
              }
              actual_blob="$(git hash-object "$lifecycle_script")"
              [[ -n "$tracked_blob" && "$actual_blob" == "$tracked_blob" ]] || {
                echo "Campaigns lifecycle guard script differs from the checked-out revision." >&2
                return 1
              }
              APP_ROOT="$APP_ROOT" \
                bash "$lifecycle_script" \
                  --guard-checkout-revision "$expected_revision"
              return
            fi
            if [[ -n "$tracked_blob" ]]; then
              echo "Tracked Campaigns lifecycle guard script is missing." >&2
              return 1
            fi
            if [[ -e "$staged_marker" || -L "$staged_marker" ||
              -e "$cutover_marker" || -L "$cutover_marker" ]]; then
              echo "Campaigns marker exists but its checkout guard is unavailable." >&2
              return 1
            fi
          }
          checkout_verified_prod_revision() {
            local expected_revision="$1"
            local fetched_revision

            guard_campaigns_checkout_before_pull "$expected_revision"
            git fetch origin prod
            fetched_revision="$(git rev-parse FETCH_HEAD)"
            [[ "$fetched_revision" == "$expected_revision" ]] || {
              echo "Origin prod changed after workflow start; checkout was not modified." >&2
              return 1
            }
            git checkout prod
            git merge --ff-only "$fetched_revision"
            [[ "$(git rev-parse HEAD)" == "$expected_revision" ]] || {
              echo "Verified prod checkout revision mismatch." >&2
              return 1
            }
          }
          checkout_verified_prod_revision "$EXPECTED_PROD_REVISION"

          compose=(
            docker compose
            --project-name winwidget
            --env-file "$APP_ROOT/deploy/backend/.env.production"
            --file deploy/docker-compose.prod.yml
          )
          cutover_marker="$APP_ROOT/deploy/backend/.notification-delivery-database-cutover-v1"
          ENV_FILE="$APP_ROOT/deploy/backend/.env.production"
          get_env_value() {
            local key="$1"

            awk -F= -v key="$key" '
              /^[[:space:]]*(#|$)/ { next }
              {
                name = $1
                sub(/^[[:space:]]*/, "", name)
                sub(/[[:space:]]*$/, "", name)
                value = $0
                sub(/^[^=]*=/, "", value)
                sub(/\r$/, "", value)
                sub(/^[[:space:]]*/, "", value)
                sub(/[[:space:]]*$/, "", value)
                if (name == key) {
                  print value
                  found += 1
                }
              }
              END { exit(found == 1 ? 0 : 1) }
            ' "$ENV_FILE"
          }
          # shellcheck source=scripts/notification-delivery-database-lifecycle.sh
          source scripts/notification-delivery-database-lifecycle.sh
          cutover_phase=""
          marker_worker_image_id=""
          marker_worker_revision=""
          if [[ -e "$cutover_marker" || -L "$cutover_marker" ]]; then
            if ! validate_notification_database_cutover_marker; then
              echo "Notification Delivery database cutover marker is invalid." >&2
              exit 1
            fi
            cutover_phase="$(notification_database_marker_value phase)"
            marker_worker_image_id="$(
              notification_database_marker_value worker_image_id
            )"
            marker_worker_revision="$(
              notification_database_marker_value revision
            )"
          fi

          require_marker_worker_image() {
            if [[ ! "$marker_worker_image_id" =~ ^sha256:[0-9a-f]{64}$ ||
              ! "$marker_worker_revision" =~ ^[0-9a-f]{40}$ ||
              "$(
                docker image inspect \
                  --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
                  "$marker_worker_image_id" 2>/dev/null || true
              )" != "$marker_worker_revision" ]]; then
              echo "The immutable worker image required for cutover recovery is unavailable." >&2
              exit 1
            fi
          }

          require_expand_service_revision() {
            local service="$1"
            local allow_marker_revision="${2:-false}"
            local allow_worker_recovery="${3:-false}"
            local marker_revision_allowed=false
            local container_ids container_count container_id revision health

            if [[ "$allow_marker_revision" == "true" &&
              -n "$marker_worker_revision" ]]; then
              marker_revision_allowed=true
            fi
            if [[ "$allow_worker_recovery" == "true" && -n "$cutover_phase" ]]; then
              container_ids="$("${compose[@]}" ps -a -q "$service")"
            else
              container_ids="$("${compose[@]}" ps --status running -q "$service")"
            fi
            container_count="$(
              printf '%s\n' "$container_ids" |
                sed '/^$/d' |
                wc -l |
              tr -d ' '
            )"
            if [[ "$service" == "notification-delivery-worker" &&
              "$cutover_phase" =~ ^(preparing|restoring|prepared)$ ]]; then
              if [[ "$container_count" != "0" && "$container_count" != "1" ]]; then
                echo "Pre-forward recovery allows at most one Notification Delivery worker container." >&2
                exit 1
              fi
              require_marker_worker_image
              approved_worker_revision="$marker_worker_revision"
              return
            fi
            if [[ "$container_count" == "0" &&
              "$allow_worker_recovery" == "true" &&
              -n "$marker_worker_revision" ]]; then
              require_marker_worker_image
              approved_worker_revision="$marker_worker_revision"
              return
            fi
            if [[ "$container_count" != "1" ]]; then
              echo "Expand release requires exactly one approved $service container." >&2
              exit 1
            fi
            container_id="$(printf '%s\n' "$container_ids" | sed -n '1p')"
            revision="$(
              docker inspect \
                --format '{{range .Config.Env}}{{println .}}{{end}}' \
                "$container_id" |
                sed -n 's/^APP_REVISION=//p'
            )"
            if [[ "$revision" != "$EXPECTED_PROD_REVISION" &&
              (
                "$marker_revision_allowed" != "true" ||
                "$revision" != "$marker_worker_revision"
              ) ]]; then
              echo "$service is not running the verified prod expand revision." >&2
              exit 1
            fi
            health="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' \
                "$container_id"
            )"
            if [[ "$health" != "healthy" &&
              "$allow_worker_recovery" != "true" ]]; then
              echo "$service must be healthy before database cutover." >&2
              exit 1
            fi
            if [[ "$service" == "notification-delivery-worker" ]]; then
              approved_worker_revision="$revision"
            fi
          }

          approved_worker_revision=""
          require_expand_service_revision api true
          if [[ "$cutover_phase" != "complete" ]]; then
            require_expand_service_revision maintenance-worker true
          fi
          require_expand_service_revision notification-delivery-worker true true
          [[ "$approved_worker_revision" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Approved Notification Delivery worker revision is missing." >&2
            exit 1
          }

          finalize_cutover=false
          if [[ "$cutover_phase" == "forward_only" || "$cutover_phase" == "complete" ]]; then
            finalize_cutover=true
          fi

          APP_ROOT="$APP_ROOT" \
            EXPECTED_REVISION="$EXPECTED_PROD_REVISION" \
            EXPECTED_WORKER_REVISION="$approved_worker_revision" \
            NOTIFICATION_DELIVERY_DATABASE_FINALIZE="$finalize_cutover" \
            bash scripts/cutover-notification-delivery-database-production.sh
          EOF

  campaigns-database:
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_target == 'campaigns-database' &&
      github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production

    steps:
      - name: Configure SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Add VPS host to known_hosts
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
        run: |
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Run resumable Campaigns database lifecycle action
        env:
          APP_ROOT: /opt/winwidget
          DATABASE_ACTION: ${{ inputs.campaigns_database_action }}
          DEPLOY_REVISION: ${{ github.sha }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          case "$DATABASE_ACTION" in
            prepare|rollback|finalize) ;;
            restart)
              ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "$SSH_PORT" \
                "$SSH_USER@$SSH_HOST" \
                "APP_ROOT='$APP_ROOT' EXPECTED_NEXT_REVISION='$DEPLOY_REVISION' bash -s" <<'RESTART_EOF'
              set -euo pipefail
              umask 077
              cd "$APP_ROOT/winwidget.ru_server"
              lifecycle_script="scripts/campaigns-database-lifecycle.sh"
              lock_script="scripts/production-deploy-lock.sh"
              restart_script="scripts/restart-campaigns-database-cutover-production.sh"
              temporary_script="$APP_ROOT/deploy/backend/.campaigns-restart.$$"
              trap 'rm -f -- "$temporary_script"' EXIT
              [[ "$(id -u)" == "0" &&
                "$EXPECTED_NEXT_REVISION" =~ ^[0-9a-f]{40}$ ]] || {
                echo "Campaigns restart bootstrap identity is invalid." >&2
                exit 1
              }
              for tracked_file in "$lifecycle_script" "$lock_script"; do
                [[ -f "$tracked_file" && ! -L "$tracked_file" ]] || {
                  echo "Campaigns restart bootstrap file is unsafe: $tracked_file" >&2
                  exit 1
                }
                tracked_blob="$(git rev-parse --verify "HEAD:$tracked_file")"
                [[ "$(git hash-object "$tracked_file")" == "$tracked_blob" ]] || {
                  echo "Campaigns restart bootstrap file differs from HEAD: $tracked_file" >&2
                  exit 1
                }
              done
              # shellcheck source=/dev/null
              source "$lock_script"
              acquire_production_deploy_lock "Campaigns database restart bootstrap"
              git fetch origin prod
              fetched_revision="$(git rev-parse FETCH_HEAD)"
              [[ "$fetched_revision" == "$EXPECTED_NEXT_REVISION" ]] || {
                echo "Origin prod changed after restart workflow began." >&2
                exit 1
              }
              current_revision="$(git rev-parse HEAD)"
              git merge-base --is-ancestor "$current_revision" "$EXPECTED_NEXT_REVISION" || {
                echo "Campaigns next revision is not a fast-forward of the active production checkout." >&2
                exit 1
              }
              restart_blob="$(
                git rev-parse --verify "$EXPECTED_NEXT_REVISION:$restart_script"
              )"
              git show "$EXPECTED_NEXT_REVISION:$restart_script" \
                > "$temporary_script"
              chown 0:0 "$temporary_script"
              chmod 700 "$temporary_script"
              [[ "$(git hash-object "$temporary_script")" == "$restart_blob" ]] || {
                echo "Campaigns restart script blob verification failed." >&2
                exit 1
              }
              APP_ROOT="$APP_ROOT" \
                EXPECTED_NEXT_REVISION="$EXPECTED_NEXT_REVISION" \
                bash "$temporary_script"
          RESTART_EOF
              exit 0
              ;;
            *)
              echo "Unsupported Campaigns database action: $DATABASE_ACTION" >&2
              exit 1
              ;;
          esac
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "APP_ROOT='$APP_ROOT' EXPECTED_REVISION='$DEPLOY_REVISION' DATABASE_ACTION='$DATABASE_ACTION' bash -s" <<'EOF'
          set -euo pipefail
          cd "$APP_ROOT/winwidget.ru_server"
          guard_campaigns_checkout_before_pull() {
            local expected_revision="$1"
            local lifecycle_script="scripts/campaigns-database-lifecycle.sh"
            local staged_marker="$APP_ROOT/deploy/backend/.campaigns-first-cutover-staged-v1"
            local cutover_marker="$APP_ROOT/deploy/backend/.campaigns-database-cutover-v1"
            local tracked_blob actual_blob

            [[ "$expected_revision" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Expected production revision is invalid." >&2
              return 1
            }
            tracked_blob="$(
              git rev-parse --verify "HEAD:$lifecycle_script" 2>/dev/null ||
                true
            )"
            if [[ -e "$lifecycle_script" || -L "$lifecycle_script" ]]; then
              [[ -f "$lifecycle_script" && ! -L "$lifecycle_script" ]] || {
                echo "Campaigns lifecycle guard script is unsafe." >&2
                return 1
              }
              actual_blob="$(git hash-object "$lifecycle_script")"
              [[ -n "$tracked_blob" && "$actual_blob" == "$tracked_blob" ]] || {
                echo "Campaigns lifecycle guard script differs from the checked-out revision." >&2
                return 1
              }
              APP_ROOT="$APP_ROOT" \
                bash "$lifecycle_script" \
                  --guard-checkout-revision "$expected_revision"
              return
            fi
            if [[ -n "$tracked_blob" ]]; then
              echo "Tracked Campaigns lifecycle guard script is missing." >&2
              return 1
            fi
            if [[ -e "$staged_marker" || -L "$staged_marker" ||
              -e "$cutover_marker" || -L "$cutover_marker" ]]; then
              echo "Campaigns marker exists but its checkout guard is unavailable." >&2
              return 1
            fi
          }
          checkout_verified_prod_revision() {
            local expected_revision="$1"
            local lifecycle_script="scripts/campaigns-database-lifecycle.sh"
            local fetched_revision

            guard_campaigns_checkout_before_pull "$expected_revision"
            APP_ROOT="$APP_ROOT" \
              bash "$lifecycle_script" \
                --require-staged-revision "$expected_revision"
            git fetch origin prod
            fetched_revision="$(git rev-parse FETCH_HEAD)"
            [[ "$fetched_revision" == "$expected_revision" ]] || {
              echo "Origin prod changed after workflow start; checkout was not modified." >&2
              return 1
            }
            git checkout prod
            git merge --ff-only "$fetched_revision"
            [[ "$(git rev-parse HEAD)" == "$expected_revision" ]] || {
              echo "Verified prod checkout revision mismatch." >&2
              return 1
            }
          }
          checkout_verified_prod_revision "$EXPECTED_REVISION"
          APP_ROOT="$APP_ROOT" \
            EXPECTED_REVISION="$EXPECTED_REVISION" \
            bash scripts/cutover-campaigns-database-production.sh \
              "$DATABASE_ACTION"
          EOF
