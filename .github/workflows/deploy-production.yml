      - name: Finalize and verify Campaigns database roles
        env:
          MONOLITH_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          POSTGRES_CONTAINER_ID: ${{ env.CAMPAIGNS_CI_POSTGRES_CONTAINER }}
        run: |
          test "$POSTGRES_CONTAINER_ID" != "$MONOLITH_POSTGRES_CONTAINER_ID"
          docker exec -i "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 \
              --username winwidget_campaigns_admin \
              --dbname winwidget_campaigns_ci <<'SQL'
          GRANT SELECT, INSERT, UPDATE, DELETE
            ON ALL TABLES IN SCHEMA campaigns
            TO winwidget_campaigns_runtime;
          GRANT USAGE, SELECT, UPDATE
            ON ALL SEQUENCES IN SCHEMA campaigns
            TO winwidget_campaigns_runtime;
          GRANT SELECT
            ON ALL TABLES IN SCHEMA campaigns
            TO winwidget_campaigns_backup;
          GRANT SELECT
            ON ALL SEQUENCES IN SCHEMA campaigns
            TO winwidget_campaigns_backup;
          REVOKE ALL ON TABLE campaigns._prisma_migrations
            FROM winwidget_campaigns_runtime;
          REVOKE CREATE ON DATABASE winwidget_campaigns_ci
            FROM winwidget_campaigns_migration;
          REVOKE CREATE ON DATABASE winwidget_campaigns_ci
            FROM winwidget_campaigns_runtime;
          REVOKE CREATE ON DATABASE winwidget_campaigns_ci
            FROM winwidget_campaigns_backup;

          DO $$
          DECLARE
            table_name text;
          BEGIN
            FOR table_name IN
              SELECT tablename
              FROM pg_tables
              WHERE schemaname = 'campaigns'
                AND tablename <> '_prisma_migrations'
            LOOP
              IF NOT has_table_privilege(
                'winwidget_campaigns_runtime',
                format('campaigns.%I', table_name),
                'SELECT,INSERT,UPDATE,DELETE'
              ) THEN
                RAISE EXCEPTION 'runtime ACL missing for %', table_name;
              END IF;
              IF NOT has_table_privilege(
                'winwidget_campaigns_backup',
                format('campaigns.%I', table_name),
                'SELECT'
              ) THEN
                RAISE EXCEPTION 'backup ACL missing for %', table_name;
              END IF;
            END LOOP;
            IF has_table_privilege(
              'winwidget_campaigns_runtime',
              'campaigns._prisma_migrations',
              'SELECT'
            ) THEN
              RAISE EXCEPTION '_prisma_migrations leaked to runtime';
            END IF;
          END $$;
          SQL

          docker exec \
            -e PGPASSWORD=campaigns_runtime_ci \
            "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 \
              --host 127.0.0.1 \
              --username winwidget_campaigns_runtime \
              --dbname winwidget_campaigns_ci \
              --command 'SELECT count(*) FROM campaigns.campaigns;' > /dev/null
          if docker exec \
            -e PGPASSWORD=campaigns_runtime_ci \
            "$POSTGRES_CONTAINER_ID" \
