      - name: Notification Delivery commercial integration smoke
        env:
          NOTIFICATION_DELIVERY_INTEGRATION_ALLOW_PURGE: 'true'
          NOTIFICATION_DELIVERY_TEST_IMAGE: ${{ env.NOTIFICATION_DELIVERY_IMAGE }}
        run: |
