              --single-transaction \
              --no-owner \
              --no-privileges \
              --username winwidget_campaigns_admin \
              --dbname winwidget_campaigns_restore_ci \
              /tmp/campaigns-ci.dump
          test "$(
            docker exec "$POSTGRES_CONTAINER_ID" \
              psql --tuples-only --no-align \
