          CAMPAIGNS_TEST_MIGRATION_DATABASE_URL: ${{ env.CAMPAIGNS_CI_MIGRATION_DATABASE_URL }}
          CAMPAIGNS_TEST_RABBITMQ_URL: amqp://campaigns_ci:campaigns_ci_password_at_least_32_characters@127.0.0.1:5672/winwidget
        run: |
          pnpm --dir apps/campaigns run test:integration
          docker exec "${{ job.services.rabbitmq.id }}" \
            rabbitmqctl --silent list_exchanges --vhost winwidget name type |
            awk '
              $1 == "winwidget.campaigns.retry" && $2 == "direct" {
                found += 1
              }
              END { exit(found == 1 ? 0 : 1) }
