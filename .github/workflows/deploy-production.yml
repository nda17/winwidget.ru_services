              'winwidget_billing_backup', 'billing._prisma_migrations', 'SELECT'
            ) THEN
              RAISE EXCEPTION 'Billing backup role cannot dump migration history';
            END IF;
          END $$;
          SQL

          docker exec \
            -e PGPASSWORD=billing_runtime_ci \
            "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 --host 127.0.0.1 \
