      - name: Create restricted Campaigns RabbitMQ user
        env:
          RABBITMQ_CONTAINER_ID: ${{ job.services.rabbitmq.id }}
        run: |
          docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl add_user \
              campaigns_ci campaigns_ci_password_at_least_32_characters
          docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl set_permissions \
              --vhost winwidget \
              campaigns_ci \
              '^winwidget\.campaigns(\..*)?$' \
              '^(winwidget\.(events|dead-letter)|winwidget\.campaigns(\..*)?)$' \
              '^(winwidget\.(events|dead-letter)|winwidget\.campaigns(\..*)?)$'
          docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl clear_topic_permissions \
              --vhost winwidget \
              campaigns_ci
          docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl set_topic_permissions \
              --vhost winwidget \
              campaigns_ci \
              winwidget.events \
              '^(admin\.audit\.event\.v1|campaign\.snapshot\.requested\.v1|notification\.campaign\.(email|telegram)\.requested\.v2|notification\.delivery\.outcome\.v2)$' \
              '^(campaign\.snapshot\.requested\.v1|notification\.delivery\.outcome\.v2)$'
          docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl set_topic_permissions \
              --vhost winwidget \
              campaigns_ci \
              winwidget.dead-letter \
              '^campaigns\.(snapshot|outcome)\.dead-letter$' \
              '^campaigns\.(snapshot|outcome)\.dead-letter$'
          docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl set_user_tags campaigns_ci
