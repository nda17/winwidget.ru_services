          if docker exec \
            -e PGPASSWORD=campaigns_backup_ci \
            "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 \
              --host 127.0.0.1 \
              --username winwidget_campaigns_backup \
              --dbname winwidget_campaigns_ci \
              --command \
                "INSERT INTO campaigns.campaigns (id, actor_id, idempotency_key, subject, message, audience, requested_channel, updated_at) VALUES (gen_random_uuid(), 'ci', gen_random_uuid(), 'blocked', 'blocked backup insert', 'ALL', 'EMAIL', CURRENT_TIMESTAMP);" \
              > /dev/null 2>&1; then
            echo "Campaigns backup role can mutate campaign data." >&2
            exit 1
