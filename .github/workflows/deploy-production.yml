      - name: Generate ephemeral CI JWT keyset
        run: |
          cp .env.example "$RUNNER_TEMP/winwidget-jwt-ci.env"
          node scripts/generate-jwt-keyset.mjs \
            --backend-env "$RUNNER_TEMP/winwidget-jwt-ci.env" \
            --issuer https://api.winwidget.test/auth \
            --audience https://api.winwidget.test \
            --kid-prefix winwidget-ci \
            --keep-previous 0
          JWT_ENV_FILE="$RUNNER_TEMP/winwidget-jwt-ci.env" node <<'NODE'
          const { appendFileSync, readFileSync } = require('node:fs');
          const requiredKeys = new Set([
            'JWT_ACCESS_PRIVATE_KEY_BASE64',
            'JWT_ACCESS_JWKS_BASE64',
            'JWT_ACCESS_ACTIVE_KID',
            'JWT_ISSUER',
            'JWT_AUDIENCE',
            'JWT_ACCESS_TTL_SECONDS',
            'JWT_CLOCK_TOLERANCE_SECONDS',
          ]);
          const values = new Map();
          for (const line of readFileSync(process.env.JWT_ENV_FILE, 'utf8').split(/\r?\n/)) {
            const match = line.match(/^([A-Za-z_][A-Za-z0-9_]*)=(.*)$/);
            if (match && requiredKeys.has(match[1])) values.set(match[1], match[2]);
          }
          for (const key of requiredKeys) {
            const value = values.get(key);
            if (!value) throw new Error(`Missing generated ${key}`);
            appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          appendFileSync(
            process.env.GITHUB_ENV,
            'JWT_JWKS_URL=http://127.0.0.1:4200/api/v1/auth/.well-known/jwks.json\n',
          );
          NODE

      - name: Generate Prisma Client
