          )"
          expected_topic_permissions="$(
            printf '%s\n' \
              'winwidget|winwidget.dead-letter|^campaigns\.(snapshot|outcome)\.dead-letter$|^campaigns\.(snapshot|outcome)\.dead-letter$' \
              'winwidget|winwidget.events|^(admin\.audit\.event\.v1|campaign\.snapshot\.requested\.v1|notification\.campaign\.(email|telegram)\.requested\.v2|notification\.delivery\.outcome\.v2)$|^(campaign\.snapshot\.requested\.v1|notification\.delivery\.outcome\.v2)$' |
