          pnpm --dir apps/campaigns run build
          pnpm --dir apps/reporting run build
          pnpm --dir apps/widgets run build
          pnpm --dir apps/billing run build
          pnpm --dir apps/identity run typecheck
          pnpm --dir apps/identity test
          pnpm --dir apps/identity run build

      - name: Create restricted Billing RabbitMQ users
        env:
          RABBITMQ_CONTAINER_ID: ${{ job.services.rabbitmq.id }}
        run: |
          worker_password=billing_worker_ci_password_at_least_32_chars
          publisher_password=billing_publisher_ci_password_at_least_32_chars
          if ! docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl add_user winwidget-billing-worker "$worker_password" \
            > /dev/null 2>&1; then
            docker exec "$RABBITMQ_CONTAINER_ID" \
              rabbitmqctl change_password \
                winwidget-billing-worker "$worker_password" > /dev/null
          fi
          if ! docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl add_user winwidget-billing-publisher "$publisher_password" \
            > /dev/null 2>&1; then
            docker exec "$RABBITMQ_CONTAINER_ID" \
              rabbitmqctl change_password \
                winwidget-billing-publisher "$publisher_password" > /dev/null
          fi
          docker exec "$RABBITMQ_CONTAINER_ID" rabbitmqctl set_permissions \
            -p winwidget winwidget-billing-worker \
            '^winwidget\.(billing\.(retry|dead-letter)|billing\.(identity|notification-routing|settings-source|trial|referral|offer|lifecycle-repair)\.v1(\.retry\.[123]|\.dead-letter)?|billing\.notification-delivery-outcome(\.retry\.[123]|\.dead-letter)?|payment\.auto-renewal(\.retry\.[123]|\.dead-letter)?)$' \
            '^winwidget\.(billing\.(retry|dead-letter)|billing\.(identity|notification-routing|settings-source|trial|referral|offer|lifecycle-repair)\.v1(\.retry\.[123]|\.dead-letter)?|billing\.notification-delivery-outcome(\.retry\.[123]|\.dead-letter)?|payment\.auto-renewal(\.retry\.[123]|\.dead-letter)?)$' \
            '^winwidget\.(events|billing\.(retry|dead-letter)|billing\.(identity|notification-routing|settings-source|trial|referral|offer|lifecycle-repair)\.v1(\.retry\.[123]|\.dead-letter)?|billing\.notification-delivery-outcome(\.retry\.[123]|\.dead-letter)?|payment\.auto-renewal(\.retry\.[123]|\.dead-letter)?)$' \
            > /dev/null
          docker exec "$RABBITMQ_CONTAINER_ID" rabbitmqctl set_permissions \
            -p winwidget winwidget-billing-publisher \
            '^$' '^winwidget\.(events|billing\.(retry|dead-letter))$' '^$' > /dev/null
          node <<'NODE'
          const amqp = require('amqplib');
          void (async () => {
            const connection = await amqp.connect(process.env.RABBITMQ_URL);
            const channel = await connection.createChannel();
            await channel.assertExchange('winwidget.events', 'topic', {
              durable: true,
            });
            await channel.close();
            await connection.close();
          })();
          NODE
          docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl set_topic_permissions -p winwidget \
              winwidget-billing-worker winwidget.events '^$' \
              '^(billing\.identity\.changed\.v1|billing\.notification-routing\.changed\.v1|billing\.settings\.source\.changed\.v1|billing\.trial\.requested\.v1|billing\.referral\.requested\.v1|billing\.offer\.changed\.v1|billing\.lifecycle-repair\.requested\.v1|payment\.auto-renewal\.charge\.requested\.v1|notification\.delivery\.outcome\.v1)$' \
            > /dev/null
          docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl set_topic_permissions -p winwidget \
              winwidget-billing-publisher winwidget.events \
              '^(payment\.succeeded\.v1|payment\.notification\.telegram\.requested\.v1|payment\.auto-renewal\.charge\.requested\.v1|notification\.subscription-expiry\.(email|telegram)\.requested\.v1|billing\.(payment|subscription)(\.details)?\.changed\.v1|billing\.(affiliate|settings)\.changed\.v1|admin\.audit\.billing\.v1)$' \
              '^$' > /dev/null

      - name: Billing PostgreSQL 18 monetary and RabbitMQ crash-boundary integration
        env:
          BILLING_TEST_DATABASE_URL: ${{ env.BILLING_DATABASE_URL }}
          BILLING_TEST_RABBITMQ_ADMIN_URL: ${{ env.RABBITMQ_URL }}
          BILLING_TEST_RABBITMQ_WORKER_URL: ${{ env.RABBITMQ_BILLING_WORKER_URL }}
          BILLING_TEST_RABBITMQ_PUBLISHER_URL: ${{ env.RABBITMQ_BILLING_PUBLISHER_URL }}
          BILLING_RUNTIME_INTEGRATION_ALLOW_MUTATION: 'true'
          BILLING_RUNTIME_INTEGRATION_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/test-billing-runtime-boundaries.mjs --integration

      - name: Verify Notification Delivery wire contract boundary
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const monolith = require("./dist/src/messaging/messaging.constants.js");
          const coreDeliveryOutcome = require(
            "./dist/src/messaging/notification-delivery-event.js",
          );
          const delivery = require(
            "./apps/notification-delivery/dist/src/messaging/messaging.constants.js",
          );
          const reporting = require(
            "./apps/reporting/dist/src/messaging/reporting-messaging.constants.js",
          );
          const widgets = require(
            "./apps/widgets/dist/src/messaging/widgets-messaging.constants.js",
          );
          const billing = require(
            "./apps/billing/dist/src/messaging/billing-messaging.constants.js",
          );

          const expectedKinds = [
            "email",
            "telegram",
            "payment-email",
            "payment-telegram",
            "limit-email",
            "limit-telegram",
            "campaign-email",
            "campaign-telegram",
            "daily-summary-delivery-telegram",
            "subscription-expiry-email",
            "subscription-expiry-telegram",
          ];
          const actualKinds = [...delivery.NOTIFICATION_DELIVERY_KINDS];
          const coreDeliveryKinds = [...monolith.NOTIFICATION_DELIVERY_KINDS];
          const monolithIntegrationKinds = [
            ...monolith.MONOLITH_INTEGRATION_KINDS,
          ];
          const archivedCoreFailureKinds = [
            ...monolith.CORE_ARCHIVED_FAILURE_HISTORY_KINDS,
          ];
          const widgetsProviderKinds = [
            ...monolith.WIDGETS_PROVIDER_INTEGRATION_KINDS,
          ];
          const widgetsServiceProviderKinds = [
            ...widgets.WIDGETS_PROVIDER_KINDS,
          ];
          const billingOwnedFederatedKinds = [
            "notification-delivery-outcome",
            "auto-renewal",
          ];
          const reportingDeliveryKinds = [
            ...reporting.REPORTING_NOTIFICATION_DELIVERY_KINDS,
          ];
          const expectedWidgetsProviderKinds = [
            "webhook",
            "bitrix24",
            "amo-crm",
          ];
          const steadyMonolithKinds = [
            "campaign-admin-audit",
            "reporting-admin-audit",
            "widgets-admin-audit",
            "billing-admin-audit",
            "identity-admin-audit",
            "billing-payment-projection",
            "billing-subscription-projection",
            "billing-affiliate-projection",
            "billing-settings-projection",
          ];
          const legacyPaths = [
            "src/messaging/daily-summary-event.ts",
            "src/reports",
            "src/statistics",
          ];
          const legacyBillingSourcePaths = [
            "src/payment",
            "src/subscription",
            "src/affiliate",
            "src/tariff-prices",
          ];
          const legacyBillingSchemaTokens = [
            "Payment",
            "PaymentReceipt",
            "Subscription",
            "SubscriptionHistory",
            "SubscriptionExpiryReminder",
            "AutoRenewal",
            "AutoRenewalConsentEvent",
            "TariffPrice",
            "AffiliateReferral",
          ];
          if (legacyBillingSourcePaths.some(path => fs.existsSync(path))) {
            throw new Error("Legacy Billing Core source directories reappeared");
          }
          const corePrismaSchema = fs.readFileSync(
            "prisma/schema.prisma",
            "utf8",
          );
          for (const model of legacyBillingSchemaTokens) {
            if (
              new RegExp(`^model\\s+${model}\\s+\\{`, "m").test(
                corePrismaSchema,
              )
            ) {
              throw new Error(
                `Legacy Billing Core Prisma model reappeared: ${model}`,
              );
            }
          }
          for (const enumName of [
            "PaymentKind",
            "AutoRenewalStatus",
            "AutoRenewalConsentEventType",
            "SubscriptionExpiryReminderStatus",
            "SubscriptionHistoryAction",
            "SubscriptionBonusAudience",
          ]) {
            if (
              new RegExp(`^enum\\s+${enumName}\\s+\\{`, "m").test(
                corePrismaSchema,
              )
            ) {
              throw new Error(
                `Legacy Billing Core Prisma enum reappeared: ${enumName}`,
              );
            }
          }
          const siteSettingsBlock = corePrismaSchema.match(
            /^model SiteSettings \{[\s\S]*?^\}/m,
          )?.[0];
          if (!siteSettingsBlock) {
            throw new Error("SiteSettings Prisma model is missing");
          }
          for (const field of [
            "paymentEnabled",
            "autoRenewalSignupEnabled",
            "autoRenewalChargesEnabled",
            "autoRenewalChargesEnabledAt",
            "affiliateProgramEnabled",
            "affiliateCashbackPercent",
          ]) {
            if (new RegExp(`^\\s*${field}\\s+`, "m").test(siteSettingsBlock)) {
              throw new Error(
                `Legacy Billing SiteSettings field reappeared: ${field}`,
              );
            }
          }
          const assertBillingLegacyGuardRejects = (schema, label) => {
            if (
              !legacyBillingSchemaTokens.some(model =>
                new RegExp(`^model\\s+${model}\\s+\\{`, "m").test(schema),
              ) &&
              !new RegExp(
                "^model SiteSettings \\{[\\s\\S]*?^\\s*paymentEnabled\\s+",
                "m",
              ).test(schema)
            ) {
              throw new Error(`Billing legacy guard did not reject ${label}`);
            }
          };
          assertBillingLegacyGuardRejects(
            `${corePrismaSchema}\nmodel Payment {\n  id String @id\n}\n`,
            "a restored source model",
          );
          assertBillingLegacyGuardRejects(
            corePrismaSchema.replace(
              "model SiteSettings {",
              "model SiteSettings {\n  paymentEnabled Boolean",
            ),
            "a restored SiteSettings field",
          );
          const legacyPathsPresent = legacyPaths.every(path =>
            fs.existsSync(path),
          );
          const legacyPathsAbsent = legacyPaths.every(
            path => !fs.existsSync(path),
          );
          if (!legacyPathsPresent && !legacyPathsAbsent) {
            throw new Error(
              "Reporting cleanup is partial: legacy source paths must be all present or all absent",
            );
          }
          const expectedMonolithKinds = legacyPathsPresent
            ? ["daily-summary-telegram", ...steadyMonolithKinds]
            : steadyMonolithKinds;
          const expectedCoreDeliveryKinds = legacyPathsPresent
            ? expectedKinds
            : expectedKinds.filter(
                kind => kind !== "daily-summary-delivery-telegram",
              );
          if (legacyPathsAbsent) {
            const forbiddenTokens = [
              "report.daily-summary.requested.v1",
              "notification.daily-summary.telegram.requested.v1",
              "reporting.notification.delivery.outcome.v1",
              "reporting.settings.changed.v1",
              "daily-summary-telegram",
              "daily-summary-delivery-telegram",
              "daily-summary-job",
              "winwidget.report.daily-summary.telegram",
              "DAILY_SUMMARY_EVENT_TYPE",
              "REPORTING_SETTINGS_EVENT_TYPE",
              "DAILY_TELEGRAM_SUMMARY",
              "DailySummaryRequestedEventPayload",
              "DailySummaryReportService",
              "DailySummaryDeliveryService",
              "applyDailySummaryDeliveryOutcome",
              "persistDailySummaryDeadLetter",
              "getDailySummaryJobId",
              "enqueueDailySummary",
              "StatisticsModule",
              "StatisticsController",
              "StatisticsService",
              "/statistics",
              "@Controller('/statistics')",
              "@/statistics",
              "@/reports",
              "reportsThreadId",
              "dailySummaryEnabled",
              "dailySummaryTime",
              "dailySummaryLastSent",
            ];
            const readSourceTree = directory =>
              fs
                .readdirSync(directory, { withFileTypes: true })
                .flatMap(entry => {
                  const path = `${directory}/${entry.name}`;
                  if (entry.isDirectory()) return readSourceTree(path);
                  return entry.isFile() && entry.name.endsWith(".ts")
                    ? [fs.readFileSync(path, "utf8")]
                    : [];
                })
                .join("\n");
            const sourceText = [
              readSourceTree("src"),
              fs.readFileSync("prisma/schema.prisma", "utf8"),
            ].join("\n");
            const reintroducedToken = forbiddenTokens.find(token =>
              sourceText.includes(token),
            );
            if (reintroducedToken) {
              throw new Error(
                `Reporting post-cleanup source contains legacy token: ${reintroducedToken}`,
              );
            }
            const reportingSourceText = readSourceTree("apps/reporting/src");
            if (reportingSourceText.includes("reporting.settings.changed.v1")) {
              throw new Error(
                "Reporting post-cleanup service still contains the transitional settings event",
              );
            }
          }
          if (
            JSON.stringify(actualKinds) !== JSON.stringify(expectedKinds) ||
            JSON.stringify(coreDeliveryKinds) !==
              JSON.stringify(expectedCoreDeliveryKinds) ||
            JSON.stringify(reportingDeliveryKinds) !==
              JSON.stringify(["daily-summary-delivery-telegram"]) ||
            Object.keys(delivery.MESSAGING_ROUTING_KEYS).sort().join(",") !==
              [...expectedKinds].sort().join(",") ||
            Object.keys(delivery.MESSAGING_QUEUE_NAMES).sort().join(",") !==
              [...expectedKinds].sort().join(",")
          ) {
            throw new Error(
              "Notification Delivery kind ownership drifted from the producer contract",
            );
          }
          if (
            reporting.REPORTING_NOTIFICATION_DELIVERY_ROUTING_KEYS[
              "daily-summary-delivery-telegram"
            ] !==
              delivery.MESSAGING_ROUTING_KEYS[
                "daily-summary-delivery-telegram"
              ] ||
            (legacyPathsAbsent &&
              (coreDeliveryKinds.some(kind =>
                reportingDeliveryKinds.includes(kind),
              ) ||
                [...new Set([
                  ...coreDeliveryKinds,
                  ...reportingDeliveryKinds,
                ])]
                  .sort()
                  .join(",") !== [...actualKinds].sort().join(",")))
          ) {
            throw new Error(
              "Core and Reporting producer ownership does not form the exact Notification Delivery consumer catalog",
            );
          }
          if (
            delivery.NOTIFICATION_DELIVERY_OUTCOME_EVENT_TYPE !==
              "notification.delivery.outcome.v1" ||
            monolith.MESSAGING_ROUTING_KEYS[
              "notification-delivery-outcome"
            ] !== delivery.NOTIFICATION_DELIVERY_OUTCOME_EVENT_TYPE ||
            monolith.MESSAGING_QUEUE_NAMES[
              "notification-delivery-outcome"
            ] !== "winwidget.notification.delivery-outcome" ||
            JSON.stringify(
              coreDeliveryOutcome.OUTCOME_NOTIFICATION_DELIVERY_KINDS,
            ) !==
              JSON.stringify([
                "subscription-expiry-email",
                "subscription-expiry-telegram",
              ])
          ) {
            throw new Error(
              "Core subscription-expiry delivery outcome route drifted",
            );
          }
          if (
            delivery.REPORTING_NOTIFICATION_DELIVERY_OUTCOME_EVENT_TYPE !==
              "reporting.notification.delivery.outcome.v1" ||
            reporting.DELIVERY_OUTCOME_EVENT_TYPE !==
              delivery.REPORTING_NOTIFICATION_DELIVERY_OUTCOME_EVENT_TYPE ||
            reporting.REPORTING_ROUTING_KEYS.deliveryOutcome !==
              delivery.REPORTING_NOTIFICATION_DELIVERY_OUTCOME_EVENT_TYPE ||
            JSON.stringify(
              reporting.REPORTING_ACCEPTED_ROUTING_KEYS.deliveryOutcome,
            ) !==
              JSON.stringify([
                delivery.REPORTING_NOTIFICATION_DELIVERY_OUTCOME_EVENT_TYPE,
              ]) ||
            reporting.REPORTING_QUEUE_NAMES.deliveryOutcome !==
              "winwidget.reporting.delivery-outcome"
          ) {
            throw new Error(
              "Reporting delivery outcome must use its dedicated route and queue",
            );
          }
          const expectedProjectionRoutingKey = legacyPathsPresent
            ? "reporting.settings.changed.v1"
            : "reporting.core-operational-routing.changed.v1";
          const expectedAcceptedProjectionRoutingKeys = legacyPathsPresent
            ? [
                "reporting.settings.changed.v1",
                "reporting.core-operational-routing.changed.v1",
              ]
            : ["reporting.core-operational-routing.changed.v1"];
          if (
            monolith.MESSAGING_ROUTING_KEYS["reporting-settings"] !==
              expectedProjectionRoutingKey ||
            reporting.REPORTING_ROUTING_KEYS.reportingSettings !==
              expectedProjectionRoutingKey ||
            JSON.stringify(
              reporting.REPORTING_ACCEPTED_ROUTING_KEYS.reportingSettings,
            ) !== JSON.stringify(expectedAcceptedProjectionRoutingKeys)
          ) {
            throw new Error(
              "Reporting settings projection route does not match the cleanup phase",
            );
          }
          const integrationOwnershipKinds = [
            ...coreDeliveryKinds,
            ...widgetsProviderKinds,
            ...monolithIntegrationKinds,
            ...billingOwnedFederatedKinds,
          ];
          if (
            JSON.stringify(monolithIntegrationKinds) !==
              JSON.stringify(expectedMonolithKinds) ||
            JSON.stringify(widgetsProviderKinds) !==
              JSON.stringify(expectedWidgetsProviderKinds) ||
            JSON.stringify(widgetsServiceProviderKinds) !==
              JSON.stringify(expectedWidgetsProviderKinds) ||
            actualKinds.some(kind =>
              [
                ...monolithIntegrationKinds,
                ...widgetsProviderKinds,
                ...billingOwnedFederatedKinds,
              ].includes(kind),
            ) ||
            new Set(integrationOwnershipKinds).size !==
              integrationOwnershipKinds.length ||
            [...integrationOwnershipKinds].sort().join(",") !==
              [...monolith.INTEGRATION_KINDS].sort().join(",")
          ) {
            throw new Error(
              "Core, Notification Delivery, Widgets, and Billing kind ownership must be an exact disjoint union",
            );
          }
          if (
            JSON.stringify(archivedCoreFailureKinds) !==
              JSON.stringify(["notification-delivery-outcome"]) ||
            archivedCoreFailureKinds.some(kind =>
              [
                ...monolith.CORE_OWNED_MESSAGING_KINDS,
                ...monolith.CORE_RABBITMQ_TOPOLOGY_KINDS,
              ].includes(kind),
            )
          ) {
            throw new Error(
              "Archived Core failure history must remain exact and disjoint from runtime ownership",
            );
          }
          if (
            JSON.stringify(
              billing.BILLING_CONSUMER_KINDS.filter(kind =>
                ["auto-renewal-charge", "notification-outcome"].includes(
                  kind,
                ),
              ),
            ) !==
              JSON.stringify([
                "auto-renewal-charge",
                "notification-outcome",
              ]) ||
            billing.BILLING_ROUTING_KEYS["notification-outcome"] !==
              monolith.MESSAGING_ROUTING_KEYS[
                "notification-delivery-outcome"
              ] ||
            billing.BILLING_QUEUE_NAMES["notification-outcome"] !==
              monolith.BILLING_NOTIFICATION_OUTCOME_QUEUE_NAME ||
            billing.BILLING_ROUTING_KEYS["auto-renewal-charge"] !==
              monolith.MESSAGING_ROUTING_KEYS["auto-renewal"] ||
            billing.BILLING_QUEUE_NAMES["auto-renewal-charge"] !==
              monolith.MESSAGING_QUEUE_NAMES["auto-renewal"]
          ) {
            throw new Error(
              "Billing federated routing and queue ownership drifted",
            );
          }
          for (const [label, actual, expected] of [
            [
              "prepared payment routing key",
              delivery.MESSAGING_ROUTING_KEYS["payment-telegram"],
              "payment.notification.telegram.requested.v1",
            ],
            [
              "prepared payment queue",
              delivery.MESSAGING_QUEUE_NAMES["payment-telegram"],
              "winwidget.payment-notification.telegram.v2",
            ],
            [
              "destination-unavailable routing key",
              monolith.MESSAGING_ROUTING_KEYS[
                "telegram-destination-unavailable"
              ],
              "notification.telegram.destination-unavailable.v1",
            ],
            [
              "destination-unavailable queue",
              monolith.MESSAGING_QUEUE_NAMES[
                "telegram-destination-unavailable"
              ],
              "winwidget.notification.telegram-destination-unavailable",
            ],
            [
              "auto-renewal routing key",
              monolith.MESSAGING_ROUTING_KEYS["auto-renewal"],
              "payment.auto-renewal.charge.requested.v1",
            ],
            [
              "auto-renewal queue",
              monolith.MESSAGING_QUEUE_NAMES["auto-renewal"],
              "winwidget.payment.auto-renewal",
            ],
            [
              "Reporting admin audit routing key",
              monolith.MESSAGING_ROUTING_KEYS["reporting-admin-audit"],
              "admin.audit.reporting.v1",
            ],
            [
              "Reporting admin audit queue",
              monolith.MESSAGING_QUEUE_NAMES["reporting-admin-audit"],
              "winwidget.admin.audit.reporting.v1",
            ],
          ]) {
            if (actual !== expected) {
              throw new Error(`${label} drift: ${actual} != ${expected}`);
            }
          }

          const deployScript = fs.readFileSync(
            "scripts/deploy-production.sh",
            "utf8",
          );
          const topologyWait = deployScript.slice(
            deployScript.indexOf("wait_for_rabbitmq_topology() {"),
            deployScript.indexOf("verify_notification_delivery_runtime_crud() {"),
          );
          if (
            !topologyWait.includes("CORE_RABBITMQ_TOPOLOGY_KINDS") ||
            topologyWait.includes("for (const kind of MESSAGING_KINDS)")
          ) {
            throw new Error(
              "Routine RabbitMQ wait must use the Core-owned topology catalog",
            );
          }
          for (const ownershipNeedle of [
            '-e "BILLING_OWNER_ACTIVE=$billing_owner_active"',
            "process.env.RABBITMQ_BILLING_WORKER_URL",
            'connectionName: "winwidget-billing-worker"',
            'kind === "notification-delivery-outcome"',
            "BILLING_NOTIFICATION_OUTCOME_QUEUE_NAME",
            "RabbitMQ Billing parking queue",
          ]) {
            if (!deployScript.includes(ownershipNeedle)) {
              throw new Error(
                `Billing auto-renewal ownership gate is missing: ${ownershipNeedle}`,
              );
            }
          }
          const autoRenewalQueue =
            monolith.MESSAGING_QUEUE_NAMES["auto-renewal"];
          for (const patternName of [
            "post_cutover_integration_read_pattern",
            "legacy_integration_read_pattern",
          ]) {
            const match = deployScript.match(
              new RegExp(`^${patternName}='([^']+)'$`, "m"),
            );
            if (!match) {
              throw new Error(
                `RabbitMQ permission pattern is missing: ${patternName}`,
              );
            }
            const permissionPattern = new RegExp(match[1]);
            for (const queue of [
              autoRenewalQueue,
              `${autoRenewalQueue}.dead-letter`,
              `${autoRenewalQueue}.retry-v2.1`,
            ]) {
              if (!permissionPattern.test(queue)) {
                throw new Error(
                  `${patternName} does not permit auto-renewal queue ${queue}`,
                );
              }
            }
          }
          const postCutoverMatch = deployScript.match(
            /^post_cutover_integration_read_pattern='([^']+)'$/m,
          );
          if (!postCutoverMatch) {
            throw new Error(
              "Post-cutover RabbitMQ permission pattern is missing",
            );
          }
          const postCutoverPattern = new RegExp(postCutoverMatch[1]);
          const billingProjectionKinds = [
            "billing-admin-audit",
            "billing-payment-projection",
            "billing-subscription-projection",
            "billing-affiliate-projection",
            "billing-settings-projection",
          ];
          for (const kind of billingProjectionKinds) {
            const queue = monolith.MESSAGING_QUEUE_NAMES[kind];
            for (const candidate of [
              queue,
              `${queue}.dead-letter`,
              `${queue}.retry-v2.1`,
            ]) {
              if (!postCutoverPattern.test(candidate)) {
                throw new Error(
                  `post_cutover_integration_read_pattern does not permit ${candidate}`,
                );
              }
            }
          }
          const postBillingMatch = deployScript.match(
            /^post_billing_integration_read_pattern='([^']+)'$/m,
          );
          if (!postBillingMatch) {
            throw new Error(
              "Post-Billing RabbitMQ permission pattern is missing",
            );
          }
          const billingCutoverScript = fs.readFileSync(
            "scripts/billing-cutover-production.sh",
            "utf8",
          );
          const cutoverPostBillingMatch = billingCutoverScript.match(
            /^readonly core_integration_post_billing_read_pattern='([^']+)'$/m,
          );
          if (
            !cutoverPostBillingMatch ||
            cutoverPostBillingMatch[1] !== postBillingMatch[1]
          ) {
            throw new Error(
              "Billing cutover and routine deploy integration permissions differ",
            );
          }
          const postBillingPattern = new RegExp(postBillingMatch[1]);
          for (const kind of billingProjectionKinds) {
            const queue = monolith.MESSAGING_QUEUE_NAMES[kind];
            if (!postBillingPattern.test(queue)) {
              throw new Error(
                `post_billing_integration_read_pattern does not permit ${queue}`,
              );
            }
          }
          for (const candidate of [
            autoRenewalQueue,
            `${autoRenewalQueue}.dead-letter`,
            `${autoRenewalQueue}.retry-v2.1`,
          ]) {
            if (postBillingPattern.test(candidate)) {
              throw new Error(
                `post_billing_integration_read_pattern permits Billing-owned ${candidate}`,
              );
            }
          }
          const postIdentityMatch = deployScript.match(
            /^post_identity_integration_read_pattern='([^']+)'$/m,
          );
          if (!postIdentityMatch) {
            throw new Error(
              "Post-Identity RabbitMQ permission pattern is missing",
            );
          }
          const postIdentityPattern = new RegExp(postIdentityMatch[1]);
          for (const kind of [
            ...billingProjectionKinds,
            "identity-admin-audit",
          ]) {
            const queue = monolith.MESSAGING_QUEUE_NAMES[kind];
            if (!postIdentityPattern.test(queue)) {
              throw new Error(
                `post_identity_integration_read_pattern does not permit ${queue}`,
              );
            }
          }
          for (const candidate of [
            monolith.MESSAGING_QUEUE_NAMES["telegram-destination-unavailable"],
            `${monolith.MESSAGING_QUEUE_NAMES["telegram-destination-unavailable"]}.dead-letter`,
            `${monolith.MESSAGING_QUEUE_NAMES["telegram-destination-unavailable"]}.retry-v2.1`,
            autoRenewalQueue,
          ]) {
            if (postIdentityPattern.test(candidate)) {
              throw new Error(
                `post_identity_integration_read_pattern permits service-owned ${candidate}`,
              );
            }
          }
          for (const candidate of [
            "winwidget.billing.identity.v1",
            "winwidget.billing.notification-delivery-outcome",
            "winwidget.lead-integration.webhook",
            "winwidget.notification.campaign.email.v2",
          ]) {
            if (
              postCutoverPattern.test(candidate) ||
              postBillingPattern.test(candidate)
            ) {
              throw new Error(
                `Core integration permission permits a service-owned queue: ${candidate}`,
              );
            }
          }

          for (const kind of coreDeliveryKinds) {
            for (const [label, left, right] of [
              [
                "routing key",
                monolith.MESSAGING_ROUTING_KEYS[kind],
                delivery.MESSAGING_ROUTING_KEYS[kind],
              ],
              [
                "queue name",
                monolith.MESSAGING_QUEUE_NAMES[kind],
                delivery.MESSAGING_QUEUE_NAMES[kind],
              ],
              [
                "manual retry routing key",
                monolith.getManualRetryRoutingKey(kind),
                delivery.getManualRetryRoutingKey(kind),
              ],
              [
                "dead-letter routing key",
                monolith.getDeadLetterRoutingKey(kind),
                delivery.getDeadLetterRoutingKey(kind),
              ],
            ]) {
              if (left !== right) {
                throw new Error(
                  `Notification Delivery ${label} drift for ${kind}: ${left} != ${right}`,
                );
              }
            }
          }
          process.stdout.write(
            "Notification Delivery producer/consumer wire contract verified\n",
          );
          NODE

      - name: Verify Campaigns wire contract boundary
        run: |
          node <<'NODE'
          const campaigns = require(
            "./apps/campaigns/dist/src/messaging/campaigns-messaging.constants.js",
          );
          const delivery = require(
            "./apps/notification-delivery/dist/src/messaging/messaging.constants.js",
          );
          const monolith = require("./dist/src/messaging/messaging.constants.js");
          for (const [label, actual, expected] of [
            [
              "email request",
              campaigns.CAMPAIGN_EMAIL_REQUESTED_EVENT_TYPE,
              delivery.CAMPAIGN_EMAIL_NOTIFICATION_EVENT_TYPE,
            ],
            [
              "telegram request",
              campaigns.CAMPAIGN_TELEGRAM_REQUESTED_EVENT_TYPE,
              delivery.CAMPAIGN_TELEGRAM_NOTIFICATION_EVENT_TYPE,
            ],
            [
              "delivery outcome",
              campaigns.NOTIFICATION_DELIVERY_OUTCOME_EVENT_TYPE,
              delivery.CAMPAIGN_NOTIFICATION_DELIVERY_OUTCOME_EVENT_TYPE,
            ],
            [
              "admin audit",
              campaigns.ADMIN_AUDIT_EVENT_TYPE,
              monolith.CAMPAIGN_ADMIN_AUDIT_EVENT_TYPE,
            ],
          ]) {
            if (!actual || actual !== expected) {
              throw new Error(
                `Campaigns ${label} contract drift: ${actual} != ${expected}`,
              );
            }
          }
          if (
            JSON.stringify(campaigns).includes("mailing.delivery.requested.v1")
          ) {
            throw new Error("Campaigns standalone contract contains legacy mailing v1");
          }
          process.stdout.write(
            "Campaigns/Notification Delivery/Admin audit contracts verified\n",
          );
          NODE

      - name: Build and verify production image
        run: |
          ci_rabbitmq_volume="winwidget-ci-rabbitmq-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$ci_rabbitmq_volume" > /dev/null
          trap 'docker volume rm "$ci_rabbitmq_volume" > /dev/null 2>&1 || true' EXIT
          export RABBITMQ_DATA_VOLUME="$ci_rabbitmq_volume"

          docker compose --env-file .env.example -f deploy/docker-compose.prod.yml build api api-gateway maintenance-worker database-restore-worker notification-delivery-worker campaigns-service reporting-service widgets-service billing-api identity-api
          test "$(
            docker image inspect "winwidget-api:$APP_VERSION" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          )" = "$APP_REVISION"
          test "$(
            docker image inspect "winwidget-api-gateway:$APP_VERSION" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          )" = "$APP_REVISION"
          test "$(
            docker image inspect "$MAINTENANCE_IMAGE" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          )" = "$MAINTENANCE_REVISION"
          test "$(
            docker image inspect "$DATABASE_RESTORE_IMAGE" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          )" = "$DATABASE_RESTORE_REVISION"
          test "$(
            docker image inspect "$NOTIFICATION_DELIVERY_IMAGE" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          )" = "$NOTIFICATION_DELIVERY_REVISION"
          test "$(
            docker image inspect "$CAMPAIGNS_IMAGE" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          )" = "$CAMPAIGNS_REVISION"
          test "$(
            docker image inspect "$REPORTING_IMAGE" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          )" = "$REPORTING_REVISION"
          test "$(
            docker image inspect "$WIDGETS_IMAGE" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          )" = "$WIDGETS_REVISION"
          test "$(
            docker image inspect "$BILLING_IMAGE" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          )" = "$BILLING_REVISION"
          test "$(
            docker image inspect "$BILLING_IMAGE" \
              --format '{{.Config.User}}'
          )" = 'billing'
          docker run --rm --network none \
            --entrypoint sh \
            "$BILLING_IMAGE" \
            -euc '
              test "$(id -u)" = 1001
              openssl version > /dev/null
              test -f dist/src/main.js
              test -f dist/src/cutover-main.js
              engine="$(find node_modules/@prisma/billing-client -maxdepth 1 -type f -name "libquery_engine-*.so.node" -print -quit)"
              test -n "$engine"
              if ldd "$engine" | grep -q "not found"; then
                exit 1
              fi
            '
          test "$(
            docker image inspect "$IDENTITY_IMAGE" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          )" = "$IDENTITY_REVISION"
          test "$(
            docker image inspect "$IDENTITY_IMAGE" \
              --format '{{.Config.User}}'
          )" = 'identity'
          docker run --rm --network none \
            --entrypoint sh \
            "$IDENTITY_IMAGE" \
            -euc '
              test "$(id -u)" = 1001
              openssl version > /dev/null
              test -f dist/src/main.js
              test -f dist/src/cutover/main.js
              test -f prisma/schema.prisma
              test -d prisma/migrations
              test ! -e dist/src/app.module.js
              test ! -e public/widgets
            '
          docker compose --env-file .env.example -f deploy/docker-compose.prod.yml \
            run --rm --no-deps --entrypoint sh maintenance-worker -lc \
            'pg_dump --version | grep -Eq " 18[.]" && pg_restore --version | grep -Eq " 18[.]" && test -f dist/src/maintenance-worker-main.js'
          docker run --rm --network none \
            --entrypoint sh \
            "$DATABASE_RESTORE_IMAGE" \
            -euc '
              flock --version
              test -x /usr/local/bin/database-restore-entrypoint.sh
              test -f dist/src/database-restore-worker-main.js
              test -d prisma/migrations
              test -d apps/notification-delivery/prisma/migrations
              test -d apps/campaigns/prisma/migrations
              test -d apps/reporting/prisma/migrations
              test -d apps/widgets/prisma/migrations
              test -d apps/billing/prisma/migrations
              test -d apps/identity/prisma/migrations
            '
          restore_entrypoint_run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          restore_entrypoint_volume="winwidget-ci-restore-entrypoint-${restore_entrypoint_run_id}"
          restore_entrypoint_container="winwidget-restore-entrypoint-${restore_entrypoint_run_id}"
          restore_entrypoint_secret_root=''
          cleanup_restore_entrypoint_smoke() {
            local identity
            if docker container inspect "$restore_entrypoint_container" > /dev/null 2>&1; then
              identity="$(
                docker inspect "$restore_entrypoint_container" \
                  --format '{{ index .Config.Labels "com.winwidget.ci.rehearsal" }}|{{ index .Config.Labels "com.winwidget.ci.run-id" }}'
              )"
              if [ "$identity" != "database-restore-entrypoint|$restore_entrypoint_run_id" ]; then
                echo 'Refusing to delete a database restore entrypoint smoke container with foreign labels.' >&2
                return 1
              fi
              docker rm --force "$restore_entrypoint_container" > /dev/null
            fi
            if docker volume inspect "$restore_entrypoint_volume" > /dev/null 2>&1; then
              identity="$(
                docker volume inspect "$restore_entrypoint_volume" \
                  --format '{{ index .Labels "com.winwidget.ci.rehearsal" }}|{{ index .Labels "com.winwidget.ci.run-id" }}'
              )"
              if [ "$identity" != "database-restore-entrypoint|$restore_entrypoint_run_id" ]; then
                echo 'Refusing to delete a database restore entrypoint smoke volume with foreign labels.' >&2
                return 1
              fi
              docker volume rm "$restore_entrypoint_volume" > /dev/null
            fi
            if [ -n "$restore_entrypoint_secret_root" ] && \
              { [ -e "$restore_entrypoint_secret_root" ] || [ -L "$restore_entrypoint_secret_root" ]; }; then
              case "$restore_entrypoint_secret_root" in
                "$RUNNER_TEMP"/winwidget-ci-restore-entrypoint-secrets.*)
                  if [ ! -d "$restore_entrypoint_secret_root" ] || \
                    [ -L "$restore_entrypoint_secret_root" ]; then
                      echo 'Refusing to delete an unsafe database restore entrypoint fixture root.' >&2
                      return 1
                  fi
                  sudo rm -rf -- "$restore_entrypoint_secret_root"
                  ;;
                *)
                  echo 'Refusing to delete a database restore entrypoint fixture outside RUNNER_TEMP.' >&2
                  return 1
                  ;;
              esac
            fi
          }
          test -n "$RUNNER_TEMP"
          restore_entrypoint_secret_root="$(
            mktemp -d "$RUNNER_TEMP/winwidget-ci-restore-entrypoint-secrets.XXXXXX"
          )"
          restore_entrypoint_fixture="$restore_entrypoint_secret_root/.fixture"
          printf 'ci-database-restore-entrypoint-fixture\n' > "$restore_entrypoint_fixture"
          for secret_name in \
            core-admin-password \
            notification-delivery-admin-password \
            campaigns-admin-password \
            reporting-admin-password \
            widgets-admin-password \
            billing-admin-password \
            identity-admin-password; do
            sudo install -o root -g root -m 400 \
              "$restore_entrypoint_fixture" \
              "$restore_entrypoint_secret_root/$secret_name"
          done
          rm -f -- "$restore_entrypoint_fixture"
          sudo chown root:root "$restore_entrypoint_secret_root"
          sudo chmod 700 "$restore_entrypoint_secret_root"
          for secret_name in \
            core-admin-password \
            notification-delivery-admin-password \
            campaigns-admin-password \
            reporting-admin-password \
            widgets-admin-password \
            billing-admin-password \
            identity-admin-password; do
            test "$(sudo stat -c '%u:%g:%a' "$restore_entrypoint_secret_root/$secret_name")" = '0:0:400'
          done
          docker volume create \
            --label com.winwidget.ci.rehearsal=database-restore-entrypoint \
            --label "com.winwidget.ci.run-id=$restore_entrypoint_run_id" \
            "$restore_entrypoint_volume" > /dev/null
          trap 'cleanup_restore_entrypoint_smoke || true; docker volume rm "$ci_rabbitmq_volume" > /dev/null 2>&1 || true' EXIT
          docker run --rm \
            --network none \
            --entrypoint sh \
            --mount "type=volume,source=$restore_entrypoint_volume,target=/var/lib/winwidget/database-restores" \
            "$DATABASE_RESTORE_IMAGE" \
            -euc '
              chown 1001:1001 /var/lib/winwidget/database-restores
              chmod 700 /var/lib/winwidget/database-restores
            '
          docker run --rm \
            --name "$restore_entrypoint_container" \
            --label com.winwidget.ci.rehearsal=database-restore-entrypoint \
            --label "com.winwidget.ci.run-id=$restore_entrypoint_run_id" \
            --network none \
            --read-only \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            --cap-add CHOWN \
            --cap-add SETGID \
            --cap-add SETUID \
            --env DATABASE_RESTORE_STORAGE_DIR=/var/lib/winwidget/database-restores \
            --mount "type=volume,source=$restore_entrypoint_volume,target=/var/lib/winwidget/database-restores" \
            --mount "type=bind,source=$restore_entrypoint_secret_root/core-admin-password,target=/run/secrets/database-restore-core-admin-password,readonly" \
            --mount "type=bind,source=$restore_entrypoint_secret_root/notification-delivery-admin-password,target=/run/secrets/database-restore-notification-delivery-admin-password,readonly" \
            --mount "type=bind,source=$restore_entrypoint_secret_root/campaigns-admin-password,target=/run/secrets/database-restore-campaigns-admin-password,readonly" \
            --mount "type=bind,source=$restore_entrypoint_secret_root/reporting-admin-password,target=/run/secrets/database-restore-reporting-admin-password,readonly" \
            --mount "type=bind,source=$restore_entrypoint_secret_root/widgets-admin-password,target=/run/secrets/database-restore-widgets-admin-password,readonly" \
            --mount "type=bind,source=$restore_entrypoint_secret_root/billing-admin-password,target=/run/secrets/database-restore-billing-admin-password,readonly" \
            --mount "type=bind,source=$restore_entrypoint_secret_root/identity-admin-password,target=/run/secrets/database-restore-identity-admin-password,readonly" \
            --tmpfs /run/database-restore-secrets:rw,noexec,nosuid,nodev,size=64k,mode=0700 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777 \
            "$DATABASE_RESTORE_IMAGE" \
            sh -euc '
              test "$(id -u):$(id -g)" = "1001:1001"
              test "$(stat -c "%u:%g:%a" /run/database-restore-secrets)" = "1001:1001:700"
              copied=0
              for secret_file in \
                /run/database-restore-secrets/core-admin-password \
                /run/database-restore-secrets/notification-delivery-admin-password \
                /run/database-restore-secrets/campaigns-admin-password \
                /run/database-restore-secrets/reporting-admin-password \
                /run/database-restore-secrets/widgets-admin-password \
                /run/database-restore-secrets/billing-admin-password \
                /run/database-restore-secrets/identity-admin-password; do
                test -f "$secret_file"
                test ! -L "$secret_file"
                test -r "$secret_file"
                test "$(stat -c "%u:%g:%a" "$secret_file")" = "1001:1001:400"
                IFS= read -r fixture_value < "$secret_file"
                test -n "$fixture_value"
                copied=$((copied + 1))
              done
              test "$copied" -eq 7
              printf "database-restore-entrypoint-secret-copy=passed\n"
            '
          cleanup_restore_entrypoint_smoke
          trap 'docker volume rm "$ci_rabbitmq_volume" > /dev/null 2>&1 || true' EXIT
          restore_singleton_volume="winwidget-ci-restore-singleton-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          restore_singleton_container="winwidget-restore-singleton-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$restore_singleton_volume" > /dev/null
          cleanup_restore_singleton() {
            docker rm --force "$restore_singleton_container" > /dev/null 2>&1 || true
            docker volume rm "$restore_singleton_volume" > /dev/null 2>&1 || true
          }
          trap 'cleanup_restore_singleton; docker volume rm "$ci_rabbitmq_volume" > /dev/null 2>&1 || true' EXIT
          docker run --rm \
            --network none \
            --entrypoint sh \
            --mount "type=volume,source=$restore_singleton_volume,target=/var/lib/winwidget/database-restores" \
            "$DATABASE_RESTORE_IMAGE" \
            -euc '
              chown 1001:1001 /var/lib/winwidget/database-restores
              chmod 700 /var/lib/winwidget/database-restores
            '
          docker run --detach \
            --name "$restore_singleton_container" \
            --network none \
            --read-only \
            --init \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            --cap-add CHOWN \
            --cap-add KILL \
            --cap-add SETGID \
            --cap-add SETUID \
            --env DATABASE_RESTORE_STORAGE_DIR=/var/lib/winwidget/database-restores \
            --env DATABASE_RESTORE_SINGLETON_SELF_TEST_SECONDS=60 \
            --mount "type=volume,source=$restore_singleton_volume,target=/var/lib/winwidget/database-restores" \
            "$DATABASE_RESTORE_IMAGE" \
            --singleton-self-test > /dev/null
          for attempt in $(seq 1 30); do
            if docker logs "$restore_singleton_container" 2>&1 | \
              grep -Fxq 'database-restore-singleton-lock-acquired'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'First database restore singleton self-test did not acquire its lock.' >&2
              exit 1
            fi
            sleep 1
          done
          restore_singleton_init_process="$(
            docker exec "$restore_singleton_container" \
              sh -c 'cat /proc/1/comm'
          )"
          case "$restore_singleton_init_process" in
            docker-init | tini) ;;
            *)
              echo "Unexpected database restore singleton init process: $restore_singleton_init_process" >&2
              exit 1
              ;;
          esac
          test "$(
            docker exec "$restore_singleton_container" \
              sh -euc '
                set -- $(cat /proc/1/task/1/children)
                test "$#" -eq 1
                cat "/proc/$1/comm"
              '
          )" = 'node'
          test "$(
            docker exec --user 1001:1001 "$restore_singleton_container" \
              stat -c '%u' \
                /var/lib/winwidget/database-restores/.database-restore-worker.singleton.lock
          )" -eq 1001
          set +e
          docker run --rm \
            --network none \
            --read-only \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            --cap-add CHOWN \
            --cap-add SETGID \
            --cap-add SETUID \
            --env DATABASE_RESTORE_STORAGE_DIR=/var/lib/winwidget/database-restores \
            --env DATABASE_RESTORE_SINGLETON_SELF_TEST_SECONDS=1 \
            --mount "type=volume,source=$restore_singleton_volume,target=/var/lib/winwidget/database-restores" \
            "$DATABASE_RESTORE_IMAGE" \
            --singleton-self-test
          restore_singleton_conflict_status="$?"
          set -e
          test "$restore_singleton_conflict_status" -eq 75
          docker stop --timeout 2 "$restore_singleton_container" > /dev/null
          test "$(
            docker inspect "$restore_singleton_container" \
              --format '{{.State.ExitCode}}'
          )" -eq 143
          docker rm "$restore_singleton_container" > /dev/null
          cleanup_restore_singleton
          trap 'docker volume rm "$ci_rabbitmq_volume" > /dev/null 2>&1 || true' EXIT
          docker compose --env-file .env.example -f deploy/docker-compose.prod.yml \
            run --rm --no-deps --entrypoint node notification-delivery-worker \
            -e "const fs=require('node:fs'); require('@prisma/notification-delivery-client'); fs.accessSync('dist/src/main.js'); fs.accessSync('prisma/schema.prisma'); for (const path of ['dist/src/app.module.js','dist/src/messaging/notification-delivery-client.service.js','dist/src/outbox-publisher-main.js','public/widgets']) if (fs.existsSync(path)) throw new Error('Standalone image contains monolith artifact: '+path)"
          docker compose --env-file .env.example -f deploy/docker-compose.prod.yml \
            run --rm --no-deps --entrypoint node campaigns-service \
            -e "const fs=require('node:fs'); require('@prisma/campaigns-client'); fs.accessSync('dist/src/main.js'); fs.accessSync('prisma/schema.prisma'); for (const path of ['dist/src/app.module.js','dist/src/mailing/mailing.service.js','dist/src/outbox-publisher-main.js','public/widgets']) if (fs.existsSync(path)) throw new Error('Campaigns image contains monolith artifact: '+path)"
          docker compose --env-file .env.example -f deploy/docker-compose.prod.yml \
            run --rm --no-deps --entrypoint node reporting-service \
            -e "const fs=require('node:fs'); require('@prisma/reporting-client'); fs.accessSync('dist/src/main.js'); fs.accessSync('prisma/schema.prisma'); for (const path of ['dist/src/app.module.js','dist/src/statistics/statistics.service.js','dist/src/outbox-publisher-main.js','public/widgets']) if (fs.existsSync(path)) throw new Error('Reporting image contains monolith artifact: '+path)"
          docker compose --env-file .env.example -f deploy/docker-compose.prod.yml \
            run --rm --no-deps --entrypoint node widgets-service \
            -e "const fs=require('node:fs'); require('@prisma/widgets-client'); fs.accessSync('dist/src/main.js'); fs.accessSync('dist/src/cutover-main.js'); fs.accessSync('prisma/schema.prisma'); const expected=['calculator-button.png','calculator.js','callback-button.png','callback.js','email-logo.png','gift-button.png','helpers/libphonenumber-min.js','helpers/winwidget-phone.js','online-consultant-button.png','online-consultant.js','quiz-button.png','quiz.js','stop-offer.js','timer-button.png','timer.js','wheel.js']; const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{const p=d+'/'+e.name;return e.isDirectory()?walk(p):[p.slice('public/widgets/'.length)]}).sort(); if(JSON.stringify(walk('public/widgets'))!==JSON.stringify(expected)) throw new Error('Widgets runtime asset manifest drifted'); for (const path of ['dist/src/app.module.js','dist/src/widget/widget.service.js','dist/src/outbox-publisher-main.js','public/email']) if (fs.existsSync(path)) throw new Error('Widgets image contains Core artifact: '+path)"
          docker compose --env-file .env.example -f deploy/docker-compose.prod.yml \
            run --rm --no-deps --entrypoint sh billing-api \
            -euc "test \"\$(id -u):\$(id -g)\" = '1001:1001'; test -f dist/src/main.js; test -f dist/src/cutover-main.js; test -f prisma/schema.prisma; test -d prisma/migrations; test ! -e dist/src/app.module.js; test ! -e public/widgets"
          docker compose --env-file .env.example -f deploy/docker-compose.prod.yml \
            run --rm --no-deps --entrypoint node api \
            -e "const fs=require('node:fs'); fs.accessSync('dist/src/main.js'); if (fs.existsSync('public/widgets')) throw new Error('Core image still contains Widgets runtime assets')"
          docker compose --env-file .env.example -f deploy/docker-compose.prod.yml \
            run --rm --no-deps --entrypoint node api-gateway \
            -e "require('./dist/src/config.js').loadConfig()"

      - name: Messaging integration smoke
        env:
          MESSAGING_INTEGRATION_ALLOW_MUTATION: 'true'
          RABBITMQ_CONTAINER_ID: ${{ job.services.rabbitmq.id }}
        run: pnpm run test:messaging-integration

      - name: Core restricted integration-user smoke
        env:
          RABBITMQ_CONTAINER_ID: ${{ job.services.rabbitmq.id }}
        run: |
          docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl add_user \
              integration_ci integration_ci_password_at_least_32_characters
          docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl set_permissions \
              --vhost winwidget \
              integration_ci \
              '^$' \
              '^(winwidget\.retry|winwidget\.dead-letter)$' \
              '^winwidget\.(admin\.audit\.(campaigns|reporting|widgets|billing|identity)\.v1|core\.billing\.(payment-details|subscription-details|affiliate|settings)\.v1)(\..*)?$'
          docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl set_user_tags integration_ci
          docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl authenticate_user \
              integration_ci integration_ci_password_at_least_32_characters
          test "$(
            docker exec "$RABBITMQ_CONTAINER_ID" \
              rabbitmqctl --silent list_user_permissions integration_ci |
              awk 'NF == 4 { print $1 "|" $2 "|" $3 "|" $4 }'
          )" = \
            'winwidget|^$|^(winwidget\.retry|winwidget\.dead-letter)$|^winwidget\.(admin\.audit\.(campaigns|reporting|widgets|billing|identity)\.v1|core\.billing\.(payment-details|subscription-details|affiliate|settings)\.v1)(\..*)?$'
          docker run --rm \
            --network host \
            --env ADMIN_URL=amqp://winwidget:winwidget_ci@127.0.0.1:5672/winwidget \
            --env WORKER_URL=amqp://integration_ci:integration_ci_password_at_least_32_characters@127.0.0.1:5672/winwidget \
            --entrypoint node \
            "winwidget-api:$APP_VERSION" \
            -e '
          const amqp = require("amqplib");
          const adminUrl = process.env.ADMIN_URL;
          const workerUrl = process.env.WORKER_URL;
          const queue = "winwidget.admin.audit.reporting.v1";
          const routingKey = "admin.audit.reporting.v1";
          const readableQueues = [
            "winwidget.admin.audit.billing.v1",
            "winwidget.core.billing.payment-details.v1",
            "winwidget.core.billing.subscription-details.v1",
            "winwidget.core.billing.affiliate.v1",
            "winwidget.core.billing.settings.v1",
          ];
          (async () => {
            const worker = await amqp.connect(workerUrl);
            const admin = await amqp.connect(adminUrl);
            try {
              const consumer = await worker.createChannel();
              const publisher = await admin.createConfirmChannel();
              try {
                for (const readableQueue of readableQueues) {
                  const registration = await consumer.consume(
                    readableQueue,
                    () => {},
                  );
                  await consumer.cancel(registration.consumerTag);
                }
                let resolveReceived;
                let rejectReceived;
                const received = new Promise((resolve, reject) => {
                  resolveReceived = resolve;
                  rejectReceived = reject;
                });
                const timeout = setTimeout(
                  () => rejectReceived(new Error("Restricted integration user did not receive Reporting audit event")),
                  5000,
                );
                await consumer.consume(queue, message => {
                  if (!message) return;
                  consumer.ack(message);
                  clearTimeout(timeout);
                  resolveReceived();
                });
                publisher.publish(
                  "winwidget.events",
                  routingKey,
                  Buffer.from(JSON.stringify({ id: "ci-reporting-audit" })),
                  { mandatory: true, persistent: true },
                );
                await publisher.waitForConfirms();
                await received;
              } finally {
                await publisher.close();
                await consumer.close();
              }
            } finally {
              await admin.close();
              await worker.close();
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          '

