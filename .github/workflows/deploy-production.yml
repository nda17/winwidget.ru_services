name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Production deployment target
        required: true
        default: all
        type: choice
        options:
          - all
          - maintenance
          - notification-delivery
  push:
    branches:
      - prod

permissions:
  contents: read

concurrency:
  group: deploy-production-server
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: winwidget_ci
          POSTGRES_USER: winwidget
          POSTGRES_PASSWORD: winwidget_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U winwidget -d winwidget_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4.2-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: winwidget
          RABBITMQ_DEFAULT_PASS: winwidget_ci
          RABBITMQ_DEFAULT_VHOST: winwidget
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_REVISION: ${{ github.sha }}
      APP_VERSION: git-${{ github.sha }}
      MAINTENANCE_REVISION: ${{ github.sha }}
      MAINTENANCE_IMAGE: winwidget-maintenance:git-${{ github.sha }}
      NOTIFICATION_DELIVERY_REVISION: ${{ github.sha }}
      NOTIFICATION_DELIVERY_IMAGE: winwidget-notification-delivery:git-${{ github.sha }}
      # CI-only 32-byte key. Production uses deploy/backend/.env.production.
      PAYMENT_METHOD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DATABASE_URL: postgresql://winwidget:winwidget_ci@127.0.0.1:5432/winwidget_ci?schema=public
      DATABASE_URL_DEVELOPMENT: postgresql://winwidget:winwidget_ci@127.0.0.1:5432/winwidget_ci?schema=public
      NOTIFICATION_DELIVERY_DATABASE_URL: postgresql://notification_delivery_runtime:notification_delivery_runtime_ci@127.0.0.1:5432/winwidget_ci?schema=notification_delivery
      NOTIFICATION_DELIVERY_CI_MIGRATION_DATABASE_URL: postgresql://notification_delivery_migration:notification_delivery_migration_ci@127.0.0.1:5432/winwidget_ci?schema=notification_delivery
      NOTIFICATION_DELIVERY_INTERNAL_URL: http://127.0.0.1:4401/internal/notification-delivery
      NOTIFICATION_DELIVERY_INTERNAL_TOKEN: ci_notification_delivery_internal_token_at_least_32_chars
      NOTIFICATION_DELIVERY_INTERNAL_TIMEOUT_MS: 5000
      NOTIFICATION_DELIVERY_LISTEN_HOST: 127.0.0.1
      NOTIFICATION_DELIVERY_HEALTH_PORT: 4401
      NOTIFICATION_DELIVERY_PREFETCH: 5
      NOTIFICATION_DELIVERY_KINDS: email,telegram,payment-email,payment-telegram,limit-email,limit-telegram,campaign-email,campaign-telegram,daily-summary-delivery-telegram,subscription-expiry-email,subscription-expiry-telegram
      NOTIFICATION_DELIVERY_TEST_RABBITMQ_URL: amqp://notification_delivery_ci:notification_delivery_ci_password@127.0.0.1:5672/winwidget
      RABBITMQ_URL: amqp://winwidget:winwidget_ci@127.0.0.1:5672/winwidget
      RABBITMQ_MANAGEMENT_URL: http://127.0.0.1:15672
      RABBITMQ_USER: winwidget
      RABBITMQ_PASSWORD: winwidget_ci
      RABBITMQ_MONITOR_USER: winwidget
      RABBITMQ_MONITOR_PASSWORD: winwidget_ci
      RABBITMQ_VHOST: winwidget

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/api-gateway/pnpm-lock.yaml
            apps/notification-delivery/pnpm-lock.yaml

      - name: Install dependencies
        env:
          HUSKY: 0
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/api-gateway install --frozen-lockfile
          pnpm --dir apps/notification-delivery install --frozen-lockfile

      - name: Create isolated Notification Delivery database roles
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 --username winwidget --dbname winwidget_ci <<'SQL'
          REVOKE ALL ON DATABASE winwidget_ci FROM PUBLIC;

          CREATE ROLE notification_delivery_migration
            LOGIN
            PASSWORD 'notification_delivery_migration_ci'
            NOSUPERUSER
            NOCREATEDB
            NOCREATEROLE
            NOREPLICATION;
          CREATE ROLE notification_delivery_runtime
            LOGIN
            PASSWORD 'notification_delivery_runtime_ci'
            NOSUPERUSER
            NOCREATEDB
            NOCREATEROLE
            NOREPLICATION;

          GRANT CONNECT, CREATE ON DATABASE winwidget_ci
            TO notification_delivery_migration;
          GRANT CONNECT ON DATABASE winwidget_ci
            TO notification_delivery_runtime;

          CREATE SCHEMA notification_delivery
            AUTHORIZATION notification_delivery_migration;
          REVOKE ALL ON SCHEMA notification_delivery FROM PUBLIC;
          GRANT USAGE ON SCHEMA notification_delivery
            TO notification_delivery_runtime;

          ALTER DEFAULT PRIVILEGES
            FOR ROLE notification_delivery_migration
            IN SCHEMA notification_delivery
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES
            TO notification_delivery_runtime;
          ALTER DEFAULT PRIVILEGES
            FOR ROLE notification_delivery_migration
            IN SCHEMA notification_delivery
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES
            TO notification_delivery_runtime;

          REVOKE CREATE ON DATABASE winwidget_ci
            FROM notification_delivery_migration;
          SQL

      - name: Generate ephemeral CI JWT keyset
        run: |
          cp .env.example "$RUNNER_TEMP/winwidget-jwt-ci.env"
          node scripts/generate-jwt-keyset.mjs \
            --backend-env "$RUNNER_TEMP/winwidget-jwt-ci.env" \
            --issuer https://api.winwidget.test/auth \
            --audience https://api.winwidget.test \
            --kid-prefix winwidget-ci \
            --keep-previous 0
          JWT_ENV_FILE="$RUNNER_TEMP/winwidget-jwt-ci.env" node <<'NODE'
          const { appendFileSync, readFileSync } = require('node:fs');
          const requiredKeys = new Set([
            'JWT_ACCESS_PRIVATE_KEY_BASE64',
            'JWT_ACCESS_JWKS_BASE64',
            'JWT_ACCESS_ACTIVE_KID',
            'JWT_ISSUER',
            'JWT_AUDIENCE',
            'JWT_ACCESS_TTL_SECONDS',
            'JWT_CLOCK_TOLERANCE_SECONDS',
          ]);
          const values = new Map();
          for (const line of readFileSync(process.env.JWT_ENV_FILE, 'utf8').split(/\r?\n/)) {
            const match = line.match(/^([A-Za-z_][A-Za-z0-9_]*)=(.*)$/);
            if (match && requiredKeys.has(match[1])) values.set(match[1], match[2]);
          }
          for (const key of requiredKeys) {
            const value = values.get(key);
            if (!value) throw new Error(`Missing generated ${key}`);
            appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          appendFileSync(
            process.env.GITHUB_ENV,
            'JWT_JWKS_URL=http://127.0.0.1:4200/api/v1/auth/.well-known/jwks.json\n',
          );
          NODE

      - name: Generate Prisma Client
        run: |
          pnpm exec prisma generate
          pnpm --dir apps/notification-delivery run prisma:validate
          pnpm --dir apps/notification-delivery run prisma:generate

      - name: Apply database migrations
        run: |
          pnpm exec prisma migrate deploy
          NOTIFICATION_DELIVERY_DATABASE_URL="$NOTIFICATION_DELIVERY_CI_MIGRATION_DATABASE_URL" \
            pnpm --dir apps/notification-delivery run prisma:migrate:deploy

      - name: Finalize Notification Delivery runtime grants
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec -i \
            --env PGPASSWORD=notification_delivery_migration_ci \
            "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 \
              --host 127.0.0.1 \
              --username notification_delivery_migration \
              --dbname winwidget_ci <<'SQL'
          DO $$
          BEGIN
            IF has_database_privilege(
              current_user,
              current_database(),
              'CREATE'
            ) THEN
              RAISE EXCEPTION 'migration role must not have database CREATE';
            END IF;
            IF NOT has_schema_privilege(
              current_user,
              'notification_delivery',
              'CREATE'
            ) THEN
              RAISE EXCEPTION 'migration role must own service schema';
            END IF;
          END
          $$;
          CREATE SEQUENCE notification_delivery.ci_runtime_sequence;
          SQL

      - name: Verify RabbitMQ Management API
        run: curl --fail --user "$RABBITMQ_USER:$RABBITMQ_PASSWORD" "$RABBITMQ_MANAGEMENT_URL/api/overview"

      - name: Type check
        run: |
          pnpm exec tsc --noEmit --incremental false -p tsconfig.build.json
          pnpm --dir apps/notification-delivery run typecheck

      - name: Lint
        run: |
          pnpm exec eslint "{src,libs,test}/**/*.ts" --max-warnings=0
          pnpm --dir apps/notification-delivery run lint

      - name: Test
        run: |
          pnpm exec jest --runInBand
          pnpm --dir apps/notification-delivery test

      - name: Validate production compose
        run: |
          docker compose --profile migration --profile notification-delivery-migration --env-file .env.example -f deploy/docker-compose.prod.yml config --quiet
          docker compose --profile migration --profile notification-delivery-migration --env-file .env.example -f deploy/docker-compose.prod.yml config --format json |
            node -e '
              const config = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
              const services = config.services ?? {};
              if (config.name !== "winwidget") {
                throw new Error(`Unexpected Compose project name: ${config.name}`);
              }
              for (const [name, service] of Object.entries(services)) {
                if ("container_name" in service) {
                  throw new Error(`${name} must use the standard Compose container name`);
                }
              }
              const rabbitVolume = config.volumes?.["winwidget-rabbitmq-data"];
              if (!rabbitVolume?.external || !rabbitVolume.name) {
                throw new Error("RabbitMQ must use a named external volume");
              }
              const persistentServiceNames = Object.entries(services)
                .filter(([, service]) => (service.profiles ?? []).length === 0)
                .map(([name]) => name)
                .sort();
              const expectedPersistentServiceNames = [
                "api",
                "api-gateway",
                "integration-worker",
                "maintenance-worker",
                "notification-delivery-worker",
                "outbox-publisher",
                "rabbitmq",
              ];
              if (
                JSON.stringify(persistentServiceNames) !==
                JSON.stringify(expectedPersistentServiceNames)
              ) {
                throw new Error(
                  `Unexpected persistent services: ${persistentServiceNames.join(",")}`,
                );
              }

              const requireService = name => {
                const service = services[name];
                if (!service) throw new Error(`Missing production service ${name}`);
                return service;
              };
              const requireCommand = (name, expected) => {
                const command = requireService(name).command;
                const normalized = Array.isArray(command)
                  ? command.join(" ")
                  : String(command ?? "");
                if (normalized !== expected) {
                  throw new Error(`Unexpected ${name} command: ${normalized}`);
                }
              };
              const requireEnvironment = (name, keys, allowEmpty = []) => {
                const environment = requireService(name).environment ?? {};
                for (const key of keys) {
                  if (
                    !(key in environment) ||
                    (environment[key] === "" && !allowEmpty.includes(key))
                  ) {
                    throw new Error(`Missing ${key} in production ${name} environment`);
                  }
                }
                return environment;
              };
              for (const name of [
                "api",
                "api-gateway",
                "maintenance-worker",
                "notification-delivery-worker",
              ]) {
                const service = requireService(name);
                const expectedRevision = {
                  api: process.env.APP_REVISION,
                  "api-gateway": process.env.APP_REVISION,
                  "maintenance-worker": process.env.MAINTENANCE_REVISION,
                  "notification-delivery-worker":
                    process.env.NOTIFICATION_DELIVERY_REVISION,
                }[name];
                if (service.build?.args?.APP_REVISION !== expectedRevision) {
                  throw new Error(`${name} image build revision is not pinned`);
                }
                const expectedImage = {
                  api: `winwidget-api:${process.env.APP_VERSION}`,
                  "api-gateway": `winwidget-api-gateway:${process.env.APP_VERSION}`,
                  "maintenance-worker": process.env.MAINTENANCE_IMAGE,
                  "notification-delivery-worker":
                    process.env.NOTIFICATION_DELIVERY_IMAGE,
                }[name];
                if (service.image !== expectedImage) {
                  throw new Error(`${name} image tag is not pinned to the revision`);
                }
              }
              if (
                requireService("maintenance-worker").build?.target !==
                "maintenance-runner"
              ) {
                throw new Error(
                  "maintenance-worker must use the maintenance-runner image target",
                );
              }
              const requireStandaloneNotificationBuild = name => {
                const service = requireService(name);
                const build = service.build ?? {};
                if (
                  !String(build.context ?? "")
                    .replaceAll("\\", "/")
                    .endsWith("/apps/notification-delivery") ||
                  build.dockerfile !== "Dockerfile" ||
                  build.target != null ||
                  build.args?.APP_REVISION !==
                    process.env.NOTIFICATION_DELIVERY_REVISION ||
                  service.image !== process.env.NOTIFICATION_DELIVERY_IMAGE
                ) {
                  throw new Error(
                    `${name} must use the exact standalone app image and context`,
                  );
                }
              };
              requireStandaloneNotificationBuild(
                "notification-delivery-worker",
              );
              requireStandaloneNotificationBuild(
                "notification-delivery-migrate",
              );
              const requireExactKinds = (environment, key, expected, name) => {
                const kinds = [...new Set(String(environment[key] ?? "")
                  .split(",")
                  .map(value => value.trim())
                  .filter(Boolean))].sort();
                const normalizedExpected = [...expected].sort();
                if (JSON.stringify(kinds) !== JSON.stringify(normalizedExpected)) {
                  throw new Error(
                    `${key} in ${name} must contain exactly ${normalizedExpected.join(",")}`,
                  );
                }
              };

              requireCommand(
                "outbox-publisher",
                "node dist/src/outbox-publisher-main.js",
              );
              requireCommand(
                "integration-worker",
                "node dist/src/integration-worker-main.js",
              );
              requireCommand(
                "migrate",
                "migrate deploy",
              );
              requireCommand(
                "notification-delivery-migrate",
                "migrate deploy --schema prisma/schema.prisma",
              );
              const migration = requireService("migrate");
              const migrationEntrypoint = Array.isArray(migration.entrypoint)
                ? migration.entrypoint.join(" ")
                : String(migration.entrypoint ?? "");
              if (migrationEntrypoint !== "./node_modules/.bin/prisma") {
                throw new Error(
                  `Unexpected migrate entrypoint: ${migrationEntrypoint}`,
                );
              }
              if (!(migration.profiles ?? []).includes("migration")) {
                throw new Error("migrate must remain behind the migration profile");
              }
              const migrationEnvironment = requireEnvironment("migrate", [
                "APP_REVISION",
                "NODE_ENV",
                "DATABASE_URL",
              ]);
              const unexpectedMigrationKeys = Object.keys(
                migrationEnvironment,
              ).filter(
                key =>
                  ![
                    "APP_REVISION",
                    "NODE_ENV",
                    "DATABASE_URL",
                  ].includes(key),
              );
              if (unexpectedMigrationKeys.length > 0) {
                throw new Error(
                  `migrate receives unexpected environment: ${unexpectedMigrationKeys.join(",")}`,
                );
              }
              const notificationMigration = requireService(
                "notification-delivery-migrate",
              );
              const notificationMigrationEntrypoint = Array.isArray(
                notificationMigration.entrypoint,
              )
                ? notificationMigration.entrypoint.join(" ")
                : String(notificationMigration.entrypoint ?? "");
              if (
                notificationMigrationEntrypoint !==
                "./node_modules/.bin/prisma"
              ) {
                throw new Error(
                  `Unexpected notification-delivery-migrate entrypoint: ${notificationMigrationEntrypoint}`,
                );
              }
              if (
                !(notificationMigration.profiles ?? []).includes(
                  "notification-delivery-migration",
                )
              ) {
                throw new Error(
                  "notification-delivery-migrate must remain behind its migration profile",
                );
              }
              const notificationMigrationEnvironment = requireEnvironment(
                "notification-delivery-migrate",
                [
                  "APP_REVISION",
                  "NODE_ENV",
                  "NOTIFICATION_DELIVERY_DATABASE_URL",
                ],
              );
              const unexpectedNotificationMigrationKeys = Object.keys(
                notificationMigrationEnvironment,
              ).filter(
                key =>
                  ![
                    "APP_REVISION",
                    "NODE_ENV",
                    "NOTIFICATION_DELIVERY_DATABASE_URL",
                  ].includes(key),
              );
              if (unexpectedNotificationMigrationKeys.length > 0) {
                throw new Error(
                  `notification-delivery-migrate receives unexpected environment: ${unexpectedNotificationMigrationKeys.join(",")}`,
                );
              }
              if (requireService("maintenance-worker").command != null) {
                throw new Error(
                  "maintenance-worker command must be owned by its image",
                );
              }
              if (
                requireService("notification-delivery-worker").command != null
              ) {
                throw new Error(
                  "notification-delivery-worker command must be owned by its image",
                );
              }

              requireEnvironment("api", [
                "RABBITMQ_MANAGEMENT_URL",
                "RABBITMQ_MONITOR_USER",
                "RABBITMQ_MONITOR_PASSWORD",
                "RABBITMQ_VHOST",
                "TRUST_PROXY",
                "JWT_ACCESS_PRIVATE_KEY_BASE64",
                "JWT_ACCESS_JWKS_BASE64",
                "JWT_ACCESS_ACTIVE_KID",
                "JWT_ISSUER",
                "JWT_AUDIENCE",
                "CORS_ALLOWED_ORIGINS",
                "NOTIFICATION_DELIVERY_INTERNAL_URL",
                "NOTIFICATION_DELIVERY_INTERNAL_TOKEN",
                "NOTIFICATION_DELIVERY_INTERNAL_TIMEOUT_MS",
              ]);
              const apiEnvironment = requireService("api").environment ?? {};
              if (
                apiEnvironment.NOTIFICATION_DELIVERY_INTERNAL_URL !==
                "http://127.0.0.1:4401/internal/notification-delivery"
              ) {
                throw new Error(
                  "api must use the exact loopback notification delivery endpoint",
                );
              }
              if (
                apiEnvironment.NOTIFICATION_DELIVERY_INTERNAL_TIMEOUT_MS !==
                "5000"
              ) {
                throw new Error(
                  "api notification delivery timeout must default to 5000ms",
                );
              }
              const gatewayEnvironment = requireEnvironment("api-gateway", [
                "GATEWAY_ROUTES_JSON",
                "CORS_ALLOWED_ORIGINS",
                "JWT_JWKS_URL",
                "JWT_ISSUER",
                "JWT_AUDIENCE",
                "JWT_CLOCK_TOLERANCE_SECONDS",
                "JWT_MAX_TOKEN_LIFETIME_SECONDS",
              ]);
              for (const forbidden of [
                "DATABASE_URL",
                "DATABASE_URL_PRODUCTION",
                "JWT_SECRET",
                "JWT_ACCESS_PRIVATE_KEY_BASE64",
                "JWT_ACCESS_JWKS_BASE64",
                "RABBITMQ_URL",
                "RABBITMQ_MONITOR_PASSWORD",
                "API_UPSTREAM_URL",
                "PROXY_TIMEOUT_MS",
              ]) {
                if (forbidden in gatewayEnvironment) {
                  throw new Error(`api-gateway must not receive ${forbidden}`);
                }
              }
              const gatewayRoutes = JSON.parse(
                gatewayEnvironment.GATEWAY_ROUTES_JSON,
              );
              const expectedGatewayRoutes = [{
                id: "monolith",
                pathPrefix: "/api/v1",
                upstreamUrl: "http://127.0.0.1:4200",
                authPolicy: "optional",
                timeoutMs: 60000,
              }];
              if (
                JSON.stringify(gatewayRoutes) !==
                JSON.stringify(expectedGatewayRoutes)
              ) {
                throw new Error(
                  "Production example must define the explicit monolith /api/v1 catch-all route",
                );
              }
              requireEnvironment("outbox-publisher", [
                "DATABASE_URL_PRODUCTION",
                "RABBITMQ_URL",
                "RABBITMQ_ASSERT_TOPOLOGY",
                "MESSAGING_SERVICE_NAME",
              ], ["DATABASE_URL_PRODUCTION"]);
              const integrationEnvironment = requireEnvironment(
                "integration-worker",
                [
                  "DATABASE_URL_PRODUCTION",
                  "RABBITMQ_URL",
                  "RABBITMQ_ASSERT_TOPOLOGY",
                  "MESSAGING_SERVICE_NAME",
                  "INTEGRATION_WORKER_KINDS",
                  "INTEGRATION_RECEIPT_RETENTION_DAYS",
                  "INTEGRATION_FAILURE_DETAIL_RETENTION_DAYS",
                ],
                ["DATABASE_URL_PRODUCTION"],
              );
              requireExactKinds(
                integrationEnvironment,
                "INTEGRATION_WORKER_KINDS",
                [
                  "webhook",
                  "bitrix24",
                  "amo-crm",
                  "mailing-email",
                  "mailing-telegram",
                  "daily-summary-telegram",
                  "telegram-destination-unavailable",
                  "notification-delivery-outcome",
                ],
                "integration-worker",
              );
              if (
                integrationEnvironment.INTEGRATION_RECEIPT_RETENTION_DAYS !== "90" ||
                integrationEnvironment.INTEGRATION_FAILURE_DETAIL_RETENTION_DAYS !== "30"
              ) {
                throw new Error(
                  "integration-worker retention defaults must remain receipt=90 and failure-detail=30 days",
                );
              }
              const notificationDelivery = requireService(
                "notification-delivery-worker",
              );
              const notificationDeliveryEnvironment = requireEnvironment(
                "notification-delivery-worker",
                [
                  "APP_REVISION",
                  "NOTIFICATION_DELIVERY_DATABASE_URL",
                  "RABBITMQ_URL",
                  "RABBITMQ_ASSERT_TOPOLOGY",
                  "MESSAGING_SERVICE_NAME",
                  "NOTIFICATION_DELIVERY_INTERNAL_TOKEN",
                  "NOTIFICATION_DELIVERY_LISTEN_HOST",
                  "NOTIFICATION_DELIVERY_HEALTH_PORT",
                  "NOTIFICATION_DELIVERY_PREFETCH",
                  "NOTIFICATION_DELIVERY_KINDS",
                  "NOTIFICATION_DELIVERY_RECEIPT_RETENTION_DAYS",
                  "NOTIFICATION_DELIVERY_FAILURE_DETAIL_RETENTION_DAYS",
                  "SMTP_LOGIN",
                  "SMTP_PASSWORD",
                  "TELEGRAM_INFO_BOT_TOKEN",
                ],
                ["TELEGRAM_INFO_BOT_TOKEN"],
              );
              requireExactKinds(
                notificationDeliveryEnvironment,
                "NOTIFICATION_DELIVERY_KINDS",
                [
                  "email",
                  "telegram",
                  "payment-email",
                  "payment-telegram",
                  "limit-email",
                  "limit-telegram",
                  "campaign-email",
                  "campaign-telegram",
                  "daily-summary-delivery-telegram",
                  "subscription-expiry-email",
                  "subscription-expiry-telegram",
                ],
                "notification-delivery-worker",
              );
              if (
                notificationDeliveryEnvironment.APP_REVISION !==
                process.env.NOTIFICATION_DELIVERY_REVISION
              ) {
                throw new Error(
                  "notification-delivery-worker runtime revision is not pinned",
                );
              }
              if (
                notificationDeliveryEnvironment.NOTIFICATION_DELIVERY_RECEIPT_RETENTION_DAYS !== "90" ||
                notificationDeliveryEnvironment.NOTIFICATION_DELIVERY_FAILURE_DETAIL_RETENTION_DAYS !== "30"
              ) {
                throw new Error(
                  "notification-delivery-worker retention defaults must remain receipt=90 and failure-detail=30 days",
                );
              }
              const internalTokens = [
                apiEnvironment.NOTIFICATION_DELIVERY_INTERNAL_TOKEN,
                notificationDeliveryEnvironment.NOTIFICATION_DELIVERY_INTERNAL_TOKEN,
              ];
              if (
                internalTokens.some(
                  token =>
                    typeof token !== "string" ||
                    token === "XYZXYZXYZ" ||
                    token.startsWith("change_me") ||
                    token.length < 32,
                ) ||
                internalTokens[0] !== internalTokens[1]
              ) {
                throw new Error(
                  "api and notification-delivery-worker must share one non-placeholder internal token of at least 32 characters",
                );
              }
              const maintenance = requireService("maintenance-worker");
              const maintenanceEnvironment = requireEnvironment(
                "maintenance-worker",
                [
                  "DATABASE_URL_PRODUCTION",
                  "RABBITMQ_URL",
                  "RABBITMQ_ASSERT_TOPOLOGY",
                  "MESSAGING_SERVICE_NAME",
                  "DATABASE_BACKUP_URL",
                  "MAINTENANCE_WORKER_PREFETCH",
                  "MAINTENANCE_HEALTH_PORT",
                  "SCHEDULED_JOB_POLL_INTERVAL_MS",
                  "SCHEDULED_JOB_LEASE_MS",
                  "SCHEDULED_JOB_LEASE_RENEW_INTERVAL_MS",
                  "MAINTENANCE_WORKER_KINDS",
                ],
                [],
              );
              requireExactKinds(
                maintenanceEnvironment,
                "MAINTENANCE_WORKER_KINDS",
                ["database-backup"],
                "maintenance-worker",
              );
              if ("RABBITMQ_URL" in (services.api.environment ?? {})) {
                throw new Error("api must not receive an AMQP URL");
              }
              if (!maintenance.healthcheck?.test) {
                throw new Error("maintenance-worker must define readiness healthcheck");
              }
              if (!notificationDelivery.healthcheck?.test) {
                throw new Error(
                  "notification-delivery-worker must define readiness healthcheck",
                );
              }
              if (
                notificationDeliveryEnvironment.NOTIFICATION_DELIVERY_HEALTH_PORT !==
                "4401"
              ) {
                throw new Error(
                  "notification-delivery-worker health port must be 4401",
                );
              }
              if (
                notificationDeliveryEnvironment.NOTIFICATION_DELIVERY_LISTEN_HOST !==
                "127.0.0.1"
              ) {
                throw new Error(
                  "notification-delivery-worker must bind to loopback",
                );
              }
              if (
                notificationDeliveryEnvironment.NOTIFICATION_DELIVERY_PREFETCH !==
                "5"
              ) {
                throw new Error(
                  "notification-delivery-worker prefetch must default to 5",
                );
              }
              const rabbitUsers = [
                services.rabbitmq.environment?.RABBITMQ_DEFAULT_USER,
                services.api.environment?.RABBITMQ_MONITOR_USER,
                new URL(services["outbox-publisher"].environment.RABBITMQ_URL).username,
                new URL(services["integration-worker"].environment.RABBITMQ_URL).username,
                new URL(services["maintenance-worker"].environment.RABBITMQ_URL).username,
                new URL(services["notification-delivery-worker"].environment.RABBITMQ_URL).username,
              ];
              if (
                services.rabbitmq.environment?.RABBITMQ_DEFAULT_VHOST !== "winwidget" ||
                services.api.environment?.RABBITMQ_VHOST !== "winwidget"
              ) {
                throw new Error("Production RabbitMQ vhost must be winwidget");
              }
              for (const name of [
                "outbox-publisher",
                "integration-worker",
                "maintenance-worker",
                "notification-delivery-worker",
              ]) {
                if (new URL(services[name].environment.RABBITMQ_URL).pathname !== "/winwidget") {
                  throw new Error(`${name} must connect to the winwidget vhost`);
                }
              }
              if (
                rabbitUsers.some(value => !value) ||
                new Set(rabbitUsers).size !== rabbitUsers.length
              ) {
                throw new Error("RabbitMQ admin, monitor and service users must be distinct");
              }
              if (
                services["outbox-publisher"].environment.RABBITMQ_ASSERT_TOPOLOGY !== "true" ||
                services["integration-worker"].environment.RABBITMQ_ASSERT_TOPOLOGY !== "false" ||
                services["maintenance-worker"].environment.RABBITMQ_ASSERT_TOPOLOGY !== "false" ||
                services["notification-delivery-worker"].environment.RABBITMQ_ASSERT_TOPOLOGY !== "false"
              ) {
                throw new Error("Only outbox-publisher may assert RabbitMQ topology");
              }
              for (const name of [
                "outbox-publisher",
                "integration-worker",
                "maintenance-worker",
                "notification-delivery-worker",
              ]) {
                const environment = services[name].environment ?? {};
                for (const forbidden of [
                  "JWT_SECRET",
                  "JWT_ACCESS_PRIVATE_KEY_BASE64",
                  "JWT_ACCESS_JWKS_BASE64",
                  "JWT_ACCESS_ACTIVE_KID",
                  "JWT_ISSUER",
                  "JWT_AUDIENCE",
                  "RABBITMQ_MONITOR_PASSWORD",
                ]) {
                  if (forbidden in environment) {
                    throw new Error(`${name} must not receive ${forbidden}`);
                  }
                }
              }
              for (const forbidden of [
                "DATABASE_URL",
                "DATABASE_URL_PRODUCTION",
                "DATABASE_BACKUP_URL",
                "NOTIFICATION_DELIVERY_INTERNAL_URL",
                "NOTIFICATION_DELIVERY_INTERNAL_TIMEOUT_MS",
                "RABBITMQ_WORKER_PREFETCH",
                "RABBITMQ_ADMIN_PASSWORD",
                "RABBITMQ_MONITOR_PASSWORD",
                "S3_ACCESS_KEY_ID",
                "S3_SECRET_ACCESS_KEY",
                "GOOGLE_CLIENT_SECRET",
                "GITHUB_CLIENT_SECRET",
                "YANDEX_CLIENT_SECRET",
                "VK_CLIENT_SECRET",
              ]) {
                if (forbidden in notificationDeliveryEnvironment) {
                  throw new Error(
                    `notification-delivery-worker must not receive ${forbidden}`,
                  );
                }
              }
              for (const forbidden of [
                "SMTP_LOGIN",
                "SMTP_PASSWORD",
                "S3_ACCESS_KEY_ID",
                "S3_SECRET_ACCESS_KEY",
                "GOOGLE_CLIENT_SECRET",
                "GITHUB_CLIENT_SECRET",
                "YANDEX_CLIENT_SECRET",
                "VK_CLIENT_SECRET",
                "RABBITMQ_ADMIN_PASSWORD",
              ]) {
                if (forbidden in maintenanceEnvironment) {
                  throw new Error(
                    `maintenance-worker must not receive ${forbidden}`,
                  );
                }
              }
              const tmpfs = Array.isArray(maintenance.tmpfs)
                ? maintenance.tmpfs.map(value =>
                    typeof value === "string" ? value : JSON.stringify(value),
                  )
                : [];
              if (
                !tmpfs.some(
                  value =>
                    value.startsWith("/tmp") &&
                    (value.includes("size=64m") ||
                      value.includes("size=67108864") ||
                      value.includes("\"size\":67108864")) &&
                    (value.includes("mode=1777") ||
                      value.includes("\"mode\":1777") ||
                      value.includes("\"mode\":\"1777\"")),
                )
              ) {
                throw new Error("maintenance-worker must use bounded /tmp tmpfs");
              }
            '

      - name: Build
        run: |
          bash -n scripts/deploy-production.sh
          bash -n scripts/deploy-maintenance-production.sh
          bash -n scripts/deploy-notification-delivery-production.sh
          pnpm build
          pnpm --dir apps/api-gateway run typecheck
          pnpm --dir apps/api-gateway test
          pnpm --dir apps/notification-delivery run build

      - name: Verify Notification Delivery wire contract boundary
        run: |
          node <<'NODE'
          const monolith = require("./dist/src/messaging/messaging.constants.js");
          const delivery = require(
            "./apps/notification-delivery/dist/src/messaging/messaging.constants.js",
          );

          const expectedKinds = [...monolith.NOTIFICATION_DELIVERY_KINDS];
          const actualKinds = [...delivery.NOTIFICATION_DELIVERY_KINDS];
          const expectedMonolithKinds = [
            "webhook",
            "bitrix24",
            "amo-crm",
            "mailing-email",
            "mailing-telegram",
            "daily-summary-telegram",
            "telegram-destination-unavailable",
            "notification-delivery-outcome",
          ];
          if (
            JSON.stringify(actualKinds) !== JSON.stringify(expectedKinds) ||
            Object.keys(delivery.MESSAGING_ROUTING_KEYS).sort().join(",") !==
              [...expectedKinds].sort().join(",") ||
            Object.keys(delivery.MESSAGING_QUEUE_NAMES).sort().join(",") !==
              [...expectedKinds].sort().join(",")
          ) {
            throw new Error(
              "Notification Delivery kind ownership drifted from the producer contract",
            );
          }
          if (
            JSON.stringify([...monolith.MONOLITH_INTEGRATION_KINDS]) !==
              JSON.stringify(expectedMonolithKinds) ||
            expectedKinds.some(kind =>
              monolith.MONOLITH_INTEGRATION_KINDS.includes(kind)
            ) ||
            [...new Set([
              ...expectedKinds,
              ...monolith.MONOLITH_INTEGRATION_KINDS,
            ])].sort().join(",") !==
              [...monolith.INTEGRATION_KINDS].sort().join(",")
          ) {
            throw new Error(
              "Monolith and Notification Delivery kind ownership must be an exact disjoint union",
            );
          }
          for (const [label, actual, expected] of [
            [
              "prepared payment routing key",
              delivery.MESSAGING_ROUTING_KEYS["payment-telegram"],
              "payment.notification.telegram.requested.v1",
            ],
            [
              "prepared payment queue",
              delivery.MESSAGING_QUEUE_NAMES["payment-telegram"],
              "winwidget.payment-notification.telegram.v2",
            ],
            [
              "destination-unavailable routing key",
              monolith.MESSAGING_ROUTING_KEYS[
                "telegram-destination-unavailable"
              ],
              "notification.telegram.destination-unavailable.v1",
            ],
            [
              "destination-unavailable queue",
              monolith.MESSAGING_QUEUE_NAMES[
                "telegram-destination-unavailable"
              ],
              "winwidget.notification.telegram-destination-unavailable",
            ],
          ]) {
            if (actual !== expected) {
              throw new Error(`${label} drift: ${actual} != ${expected}`);
            }
          }

          for (const kind of expectedKinds) {
            for (const [label, left, right] of [
              [
                "routing key",
                monolith.MESSAGING_ROUTING_KEYS[kind],
                delivery.MESSAGING_ROUTING_KEYS[kind],
              ],
              [
                "queue name",
                monolith.MESSAGING_QUEUE_NAMES[kind],
                delivery.MESSAGING_QUEUE_NAMES[kind],
              ],
              [
                "manual retry routing key",
                monolith.getManualRetryRoutingKey(kind),
                delivery.getManualRetryRoutingKey(kind),
              ],
              [
                "dead-letter routing key",
                monolith.getDeadLetterRoutingKey(kind),
                delivery.getDeadLetterRoutingKey(kind),
              ],
            ]) {
              if (left !== right) {
                throw new Error(
                  `Notification Delivery ${label} drift for ${kind}: ${left} != ${right}`,
                );
              }
            }
          }
          process.stdout.write(
            "Notification Delivery producer/consumer wire contract verified\n",
          );
          NODE

      - name: Build and verify production image
        run: |
          ci_rabbitmq_volume="winwidget-ci-rabbitmq-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$ci_rabbitmq_volume" > /dev/null
          trap 'docker volume rm "$ci_rabbitmq_volume" > /dev/null 2>&1 || true' EXIT
          export RABBITMQ_DATA_VOLUME="$ci_rabbitmq_volume"

          docker compose --env-file .env.example -f deploy/docker-compose.prod.yml build api api-gateway maintenance-worker notification-delivery-worker
          test "$(
            docker image inspect "winwidget-api:$APP_VERSION" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          )" = "$APP_REVISION"
          test "$(
            docker image inspect "winwidget-api-gateway:$APP_VERSION" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          )" = "$APP_REVISION"
          test "$(
            docker image inspect "$MAINTENANCE_IMAGE" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          )" = "$MAINTENANCE_REVISION"
          test "$(
            docker image inspect "$NOTIFICATION_DELIVERY_IMAGE" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          )" = "$NOTIFICATION_DELIVERY_REVISION"
          docker compose --env-file .env.example -f deploy/docker-compose.prod.yml \
            run --rm --no-deps --entrypoint sh maintenance-worker -lc \
            'pg_dump --version && pg_restore --version && test -f dist/src/maintenance-worker-main.js'
          docker compose --env-file .env.example -f deploy/docker-compose.prod.yml \
            run --rm --no-deps --entrypoint node notification-delivery-worker \
            -e "const fs=require('node:fs'); require('@prisma/notification-delivery-client'); fs.accessSync('dist/src/main.js'); fs.accessSync('prisma/schema.prisma'); for (const path of ['dist/src/app.module.js','dist/src/messaging/notification-delivery-client.service.js','dist/src/outbox-publisher-main.js','public/widgets']) if (fs.existsSync(path)) throw new Error('Standalone image contains monolith artifact: '+path)"
          docker compose --env-file .env.example -f deploy/docker-compose.prod.yml \
            run --rm --no-deps --entrypoint node api-gateway \
            -e "require('./dist/src/config.js').loadConfig()"

      - name: Messaging integration smoke
        env:
          RABBITMQ_CONTAINER_ID: ${{ job.services.rabbitmq.id }}
        run: pnpm run test:messaging-integration

      - name: Create restricted Notification Delivery RabbitMQ user
        env:
          RABBITMQ_CONTAINER_ID: ${{ job.services.rabbitmq.id }}
        run: |
          docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl add_user \
              notification_delivery_ci notification_delivery_ci_password
          docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl set_permissions \
              --vhost winwidget \
              notification_delivery_ci \
              '^$' \
              '^(winwidget\.events|winwidget\.dead-letter)$' \
              '^winwidget\.(lead-integration\.(email|telegram)|payment-notification\.(email|telegram\.v2)|limit-notification\.(email|telegram)|notification\.(campaign\.(email|telegram)|daily-summary\.telegram|subscription-expiry\.(email|telegram)))(\..*)?$'
          docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl set_user_tags notification_delivery_ci
          docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl authenticate_user \
              notification_delivery_ci notification_delivery_ci_password

      - name: Notification Delivery commercial integration smoke
        env:
          NOTIFICATION_DELIVERY_INTEGRATION_ALLOW_PURGE: 'true'
          NOTIFICATION_DELIVERY_TEST_IMAGE: ${{ env.NOTIFICATION_DELIVERY_IMAGE }}
        run: |
          if (( "$(sysctl -n net.ipv4.ip_unprivileged_port_start)" > 465 )); then
            sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0 > /dev/null
          fi
          pnpm --dir apps/notification-delivery run test:integration

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Add VPS host to known_hosts
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
        run: |
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy backend on VPS
        env:
          APP_ROOT: /opt/winwidget
          DEPLOY_REVISION: ${{ github.sha }}
          DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || 'all' }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "APP_ROOT='$APP_ROOT' EXPECTED_REVISION='$DEPLOY_REVISION' DEPLOY_TARGET='$DEPLOY_TARGET' bash -s" <<'EOF'
          set -euo pipefail
          cd "$APP_ROOT/winwidget.ru_server"
          git fetch origin prod
          git checkout prod
          git pull --ff-only origin prod
          case "$DEPLOY_TARGET" in
            all)
              APP_ROOT="$APP_ROOT" bash scripts/deploy-production.sh
              ;;
            maintenance)
              APP_ROOT="$APP_ROOT" bash scripts/deploy-maintenance-production.sh
              ;;
            notification-delivery)
              APP_ROOT="$APP_ROOT" bash scripts/deploy-notification-delivery-production.sh
              ;;
            *)
              echo "Unsupported deploy target: $DEPLOY_TARGET" >&2
              exit 1
              ;;
          esac
          EOF
