              echo "Refusing to remove an unverified Reporting container." >&2
              cleanup_failed=true
            else
              docker container rm --force \
                "$REPORTING_CI_POSTGRES_CONTAINER" > /dev/null
            fi
          fi
          if docker volume inspect \
            "$REPORTING_CI_POSTGRES_VOLUME" > /dev/null 2>&1; then
            volume_identity="$(
              docker volume inspect \
                --format '{{index .Labels "com.winwidget.owner"}}|{{index .Labels "com.winwidget.purpose"}}|{{index .Labels "com.winwidget.github-run"}}' \
                "$REPORTING_CI_POSTGRES_VOLUME"
            )"
            if [[ "$volume_identity" != "reporting|ci-postgres-data|$GITHUB_RUN_ID" ]]; then
              echo "Refusing to remove an unverified Reporting volume." >&2
              cleanup_failed=true
            else
              docker volume rm "$REPORTING_CI_POSTGRES_VOLUME" > /dev/null
            fi
          fi
          rm -f -- "$REPORTING_CI_POSTGRES_PASSWORD_FILE"
          [[ "$cleanup_failed" == "false" ]]

      - name: Cleanup isolated Widgets PostgreSQL
        if: ${{ always() }}
        env:
          WIDGETS_CI_POSTGRES_PASSWORD_FILE: ${{ runner.temp }}/winwidget-widgets-postgres-admin-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cleanup_failed=false
          if docker container inspect \
            "$WIDGETS_CI_POSTGRES_CONTAINER" > /dev/null 2>&1; then
            container_identity="$(
              docker container inspect \
                --format '{{index .Config.Labels "com.winwidget.owner"}}|{{index .Config.Labels "com.winwidget.purpose"}}|{{index .Config.Labels "com.winwidget.github-run"}}' \
                "$WIDGETS_CI_POSTGRES_CONTAINER"
            )"
            if [[ "$container_identity" != "widgets|ci-postgres|$GITHUB_RUN_ID" ]]; then
              echo "Refusing to remove an unverified Widgets container." >&2
              cleanup_failed=true
            else
              docker container rm --force \
                "$WIDGETS_CI_POSTGRES_CONTAINER" > /dev/null
            fi
          fi
          if docker volume inspect \
            "$WIDGETS_CI_POSTGRES_VOLUME" > /dev/null 2>&1; then
            volume_identity="$(
              docker volume inspect \
                --format '{{index .Labels "com.winwidget.owner"}}|{{index .Labels "com.winwidget.purpose"}}|{{index .Labels "com.winwidget.github-run"}}' \
                "$WIDGETS_CI_POSTGRES_VOLUME"
            )"
            if [[ "$volume_identity" != "widgets|ci-postgres-data|$GITHUB_RUN_ID" ]]; then
              echo "Refusing to remove an unverified Widgets volume." >&2
              cleanup_failed=true
            else
              docker volume rm "$WIDGETS_CI_POSTGRES_VOLUME" > /dev/null
            fi
          fi
          rm -f -- "$WIDGETS_CI_POSTGRES_PASSWORD_FILE"
          [[ "$cleanup_failed" == "false" ]]

      - name: Cleanup isolated Billing PostgreSQL
        if: ${{ always() }}
        env:
          BILLING_CI_POSTGRES_PASSWORD_FILE: ${{ runner.temp }}/winwidget-billing-postgres-admin-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cleanup_failed=false
          if docker container inspect \
            "$BILLING_CI_POSTGRES_CONTAINER" > /dev/null 2>&1; then
            container_identity="$(
              docker container inspect \
                --format '{{index .Config.Labels "com.winwidget.owner"}}|{{index .Config.Labels "com.winwidget.purpose"}}|{{index .Config.Labels "com.winwidget.github-run"}}' \
                "$BILLING_CI_POSTGRES_CONTAINER"
            )"
            if [[ "$container_identity" != "billing|ci-postgres|$GITHUB_RUN_ID" ]]; then
              echo "Refusing to remove an unverified Billing container." >&2
              cleanup_failed=true
            else
              docker container rm --force \
                "$BILLING_CI_POSTGRES_CONTAINER" > /dev/null
            fi
          fi
          if docker volume inspect \
            "$BILLING_CI_POSTGRES_VOLUME" > /dev/null 2>&1; then
            volume_identity="$(
              docker volume inspect \
                --format '{{index .Labels "com.winwidget.owner"}}|{{index .Labels "com.winwidget.purpose"}}|{{index .Labels "com.winwidget.github-run"}}' \
                "$BILLING_CI_POSTGRES_VOLUME"
            )"
            if [[ "$volume_identity" != "billing|ci-postgres-data|$GITHUB_RUN_ID" ]]; then
              echo "Refusing to remove an unverified Billing volume." >&2
              cleanup_failed=true
            else
              docker volume rm "$BILLING_CI_POSTGRES_VOLUME" > /dev/null
            fi
          fi
          rm -f -- "$BILLING_CI_POSTGRES_PASSWORD_FILE"
          [[ "$cleanup_failed" == "false" ]]

      - name: Cleanup isolated Identity PostgreSQL
        if: ${{ always() }}
        env:
          IDENTITY_CI_POSTGRES_PASSWORD_FILE: ${{ runner.temp }}/winwidget-identity-postgres-admin-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cleanup_failed=false
          if docker container inspect \
            "$IDENTITY_CI_POSTGRES_CONTAINER" > /dev/null 2>&1; then
            container_identity="$(
              docker container inspect \
                --format '{{index .Config.Labels "com.winwidget.owner"}}|{{index .Config.Labels "com.winwidget.purpose"}}|{{index .Config.Labels "com.winwidget.github-run"}}' \
                "$IDENTITY_CI_POSTGRES_CONTAINER"
            )"
            if [[ "$container_identity" != "identity|ci-postgres|$GITHUB_RUN_ID" ]]; then
              echo "Refusing to remove an unverified Identity container." >&2
              cleanup_failed=true
            else
              docker container rm --force \
                "$IDENTITY_CI_POSTGRES_CONTAINER" > /dev/null
            fi
          fi
          if docker volume inspect \
            "$IDENTITY_CI_POSTGRES_VOLUME" > /dev/null 2>&1; then
            volume_identity="$(
              docker volume inspect \
                --format '{{index .Labels "com.winwidget.owner"}}|{{index .Labels "com.winwidget.purpose"}}|{{index .Labels "com.winwidget.github-run"}}' \
                "$IDENTITY_CI_POSTGRES_VOLUME"
            )"
            if [[ "$volume_identity" != "identity|ci-postgres-data|$GITHUB_RUN_ID" ]]; then
              echo "Refusing to remove an unverified Identity volume." >&2
              cleanup_failed=true
            else
              docker volume rm "$IDENTITY_CI_POSTGRES_VOLUME" > /dev/null
            fi
          fi
          rm -f -- "$IDENTITY_CI_POSTGRES_PASSWORD_FILE"
          [[ "$cleanup_failed" == "false" ]]

  deploy:
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout deployment controller
        uses: actions/checkout@v6

      - name: Configure SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Add VPS host to known_hosts
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
        run: |
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Stage Identity production env export certificate
        if: >-
          github.event_name == 'workflow_dispatch' &&
          ((inputs.deploy_target == 'identity' &&
            (inputs.identity_action == 'export-env' || inputs.identity_action == 'prepare')) ||
           (inputs.deploy_target == 'identity-cleanup' &&
            (inputs.identity_cleanup_action == 'run' || inputs.identity_cleanup_action == 'forward-recovery')))
        env:
          IDENTITY_ENV_EXPORT_CERTIFICATE_PEM: ${{ secrets.PRODUCTION_ENV_EXPORT_CERTIFICATE_PEM }}
          IDENTITY_ENV_EXPORT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          certificate="$RUNNER_TEMP/identity-env-export-certificate-$IDENTITY_ENV_EXPORT_ID.pem"
          [[ -n "$IDENTITY_ENV_EXPORT_CERTIFICATE_PEM" ]] || {
            echo 'PRODUCTION_ENV_EXPORT_CERTIFICATE_PEM is required for encrypted Identity env export.' >&2
            exit 1
          }
          printf '%s' "$IDENTITY_ENV_EXPORT_CERTIFICATE_PEM" > "$certificate"
          chmod 600 "$certificate"
          openssl x509 -in "$certificate" -noout -checkend 86400 > /dev/null
          scp -q -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -P "$SSH_PORT" \
            "$certificate" \
            "$SSH_USER@$SSH_HOST:/opt/winwidget/deploy/backend/.identity-env-export-certificate-$IDENTITY_ENV_EXPORT_ID.pem"
          rm -f -- "$certificate"

      - name: Stage read-only Identity env export controller
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.deploy_target == 'identity' &&
          inputs.identity_action == 'export-env'
        env:
          IDENTITY_ENV_EXPORT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          [[ -f scripts/identity-production-env-control.sh &&
            ! -L scripts/identity-production-env-control.sh &&
            -z "$(git status --short -- scripts/identity-production-env-control.sh)" ]]
          scp -q -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -P "$SSH_PORT" \
            scripts/identity-production-env-control.sh \
            "$SSH_USER@$SSH_HOST:/opt/winwidget/deploy/backend/.identity-env-export-control-$IDENTITY_ENV_EXPORT_ID.sh"
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "chmod 600 '/opt/winwidget/deploy/backend/.identity-env-export-control-$IDENTITY_ENV_EXPORT_ID.sh'"

      - name: Export current backend env without checkout
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.deploy_target == 'identity' &&
          inputs.identity_action == 'export-env'
        env:
          IDENTITY_ENV_EXPORT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "APP_ROOT='/opt/winwidget' EXPECTED_REVISION='${{ github.sha }}' IDENTITY_ENV_EXPORT_CERTIFICATE_FILE='/opt/winwidget/deploy/backend/.identity-env-export-certificate-$IDENTITY_ENV_EXPORT_ID.pem' IDENTITY_ENV_EXPORT_FILE='/opt/winwidget/deploy/backend/.identity-production-env-$IDENTITY_ENV_EXPORT_ID.p7m' bash '/opt/winwidget/deploy/backend/.identity-env-export-control-$IDENTITY_ENV_EXPORT_ID.sh' --export-encrypted"

      - name: Stage or deploy backend on VPS
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.deploy_target != 'identity' ||
          inputs.identity_action != 'export-env'
        env:
          APP_ROOT: /opt/winwidget
          AUTOMATIC_PROD_PUSH: ${{ github.event_name == 'push' && 'true' || 'false' }}
          DEPLOY_REVISION: ${{ github.sha }}
          DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || 'all' }}
          WIDGETS_CUTOVER_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.widgets_cutover_confirmation || '' }}
          BILLING_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.billing_action || 'status' }}
          BILLING_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target != 'billing-cleanup' && inputs.billing_confirmation || '' }}
          BILLING_CLEANUP_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.billing_cleanup_action || 'status' }}
          BILLING_CLEANUP_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'billing-cleanup' && inputs.billing_confirmation || '' }}
          IDENTITY_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.identity_action || 'status' }}
          IDENTITY_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target != 'identity-cleanup' && inputs.identity_confirmation || '' }}
          IDENTITY_ENV_EXPECTED_SHA256: ${{ github.event_name == 'workflow_dispatch' && inputs.identity_backend_env_expected_sha256 || '' }}
          IDENTITY_ENV_EXPORT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          IDENTITY_CLEANUP_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.identity_cleanup_action || 'status' }}
          IDENTITY_CLEANUP_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'identity-cleanup' && inputs.identity_confirmation || '' }}
          IDENTITY_CLEANUP_MIGRATION_SHA256: ${{ github.event_name == 'workflow_dispatch' && inputs.identity_cleanup_migration_sha256 || '' }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: bash .github/scripts/stage-or-deploy-backend.sh
      - name: Download encrypted canonical Identity production env
        id: download_identity_env
        if: >-
          always() &&
          github.event_name == 'workflow_dispatch' &&
          ((inputs.deploy_target == 'identity' &&
            (inputs.identity_action == 'export-env' || inputs.identity_action == 'prepare')) ||
           (inputs.deploy_target == 'identity-cleanup' &&
            (inputs.identity_cleanup_action == 'run' || inputs.identity_cleanup_action == 'forward-recovery')))
        env:
          IDENTITY_ENV_EXPORT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          encrypted="$RUNNER_TEMP/identity-production-env-$IDENTITY_ENV_EXPORT_ID.p7m"
          checksum="$encrypted.env-sha256"
          scp -q -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -P "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST:/opt/winwidget/deploy/backend/.identity-production-env-$IDENTITY_ENV_EXPORT_ID.p7m" \
            "$encrypted"
          scp -q -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -P "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST:/opt/winwidget/deploy/backend/.identity-production-env-$IDENTITY_ENV_EXPORT_ID.p7m.env-sha256" \
            "$checksum"
          [[ -s "$encrypted" && ! -L "$encrypted" ]]
          [[ "$(tr -d '\r\n' < "$checksum")" =~ ^[0-9a-f]{64}$ ]]
          chmod 600 "$encrypted" "$checksum"

      - name: Upload encrypted canonical Identity production env
        if: steps.download_identity_env.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: identity-production-env-encrypted-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/identity-production-env-${{ github.run_id }}-${{ github.run_attempt }}.p7m
            ${{ runner.temp }}/identity-production-env-${{ github.run_id }}-${{ github.run_attempt }}.p7m.env-sha256
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 1

      - name: Remove transient Identity env export files
        if: >-
          always() &&
          github.event_name == 'workflow_dispatch' &&
          ((inputs.deploy_target == 'identity' &&
            (inputs.identity_action == 'export-env' || inputs.identity_action == 'prepare')) ||
           (inputs.deploy_target == 'identity-cleanup' &&
            (inputs.identity_cleanup_action == 'run' || inputs.identity_cleanup_action == 'forward-recovery')))
        env:
          IDENTITY_ENV_EXPORT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "rm -f -- '/opt/winwidget/deploy/backend/.identity-env-export-certificate-$IDENTITY_ENV_EXPORT_ID.pem' '/opt/winwidget/deploy/backend/.identity-env-export-control-$IDENTITY_ENV_EXPORT_ID.sh' '/opt/winwidget/deploy/backend/.identity-production-env-$IDENTITY_ENV_EXPORT_ID.p7m' '/opt/winwidget/deploy/backend/.identity-production-env-$IDENTITY_ENV_EXPORT_ID.p7m.env-sha256'" || true
          rm -f -- \
            "$RUNNER_TEMP/identity-production-env-$IDENTITY_ENV_EXPORT_ID.p7m" \
            "$RUNNER_TEMP/identity-production-env-$IDENTITY_ENV_EXPORT_ID.p7m.env-sha256"
