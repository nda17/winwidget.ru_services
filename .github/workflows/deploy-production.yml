                --dbname winwidget_identity_restore_ci \
                --command \
                  "SELECT count(*) FROM identity.source_sequences WHERE id = '$sentinel_id' AND last_value = 42;"
          )" = "1"
          test "$(
            docker exec "$POSTGRES_CONTAINER_ID" \
              psql --tuples-only --no-align --set ON_ERROR_STOP=1 \
