      - name: Cleanup isolated Notification Delivery PostgreSQL
        if: ${{ always() }}
        env:
          NOTIFICATION_DELIVERY_CI_POSTGRES_PASSWORD_FILE: ${{ runner.temp }}/winwidget-notification-delivery-postgres-admin-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cleanup_failed=false

          if docker container inspect \
            "$NOTIFICATION_DELIVERY_CI_POSTGRES_CONTAINER" > /dev/null 2>&1; then
            container_owner="$(
              docker container inspect \
                --format '{{index .Config.Labels "com.winwidget.owner"}}' \
                "$NOTIFICATION_DELIVERY_CI_POSTGRES_CONTAINER"
            )"
            container_purpose="$(
              docker container inspect \
                --format '{{index .Config.Labels "com.winwidget.purpose"}}' \
                "$NOTIFICATION_DELIVERY_CI_POSTGRES_CONTAINER"
            )"
            container_run="$(
              docker container inspect \
                --format '{{index .Config.Labels "com.winwidget.github-run"}}' \
                "$NOTIFICATION_DELIVERY_CI_POSTGRES_CONTAINER"
            )"
            if [[
              "$container_owner" != "notification-delivery" ||
              "$container_purpose" != "ci-postgres" ||
              "$container_run" != "$GITHUB_RUN_ID"
            ]]; then
              echo "Refusing to remove an unverified PostgreSQL container." >&2
              cleanup_failed=true
            else
              docker container rm --force \
                "$NOTIFICATION_DELIVERY_CI_POSTGRES_CONTAINER" > /dev/null
            fi
          fi

          if docker volume inspect \
            "$NOTIFICATION_DELIVERY_CI_POSTGRES_VOLUME" > /dev/null 2>&1; then
            volume_owner="$(
              docker volume inspect \
                --format '{{index .Labels "com.winwidget.owner"}}' \
                "$NOTIFICATION_DELIVERY_CI_POSTGRES_VOLUME"
            )"
            volume_purpose="$(
              docker volume inspect \
                --format '{{index .Labels "com.winwidget.purpose"}}' \
                "$NOTIFICATION_DELIVERY_CI_POSTGRES_VOLUME"
            )"
            volume_run="$(
              docker volume inspect \
                --format '{{index .Labels "com.winwidget.github-run"}}' \
                "$NOTIFICATION_DELIVERY_CI_POSTGRES_VOLUME"
            )"
            if [[
              "$volume_owner" != "notification-delivery" ||
              "$volume_purpose" != "ci-postgres-data" ||
              "$volume_run" != "$GITHUB_RUN_ID"
            ]]; then
              echo "Refusing to remove an unverified PostgreSQL volume." >&2
              cleanup_failed=true
            else
              docker volume rm \
                "$NOTIFICATION_DELIVERY_CI_POSTGRES_VOLUME" > /dev/null
            fi
          fi

          rm -f -- "$NOTIFICATION_DELIVERY_CI_POSTGRES_PASSWORD_FILE"
          if [[ "$cleanup_failed" == "true" ]]; then
            exit 1
          fi

      - name: Cleanup isolated Campaigns PostgreSQL
        if: ${{ always() }}
        env:
          CAMPAIGNS_CI_POSTGRES_PASSWORD_FILE: ${{ runner.temp }}/winwidget-campaigns-postgres-admin-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cleanup_failed=false
          if docker container inspect \
            "$CAMPAIGNS_CI_POSTGRES_CONTAINER" > /dev/null 2>&1; then
            container_identity="$(
              docker container inspect \
                --format '{{index .Config.Labels "com.winwidget.owner"}}|{{index .Config.Labels "com.winwidget.purpose"}}|{{index .Config.Labels "com.winwidget.github-run"}}' \
                "$CAMPAIGNS_CI_POSTGRES_CONTAINER"
            )"
            if [[ "$container_identity" != "campaigns|ci-postgres|$GITHUB_RUN_ID" ]]; then
              echo "Refusing to remove an unverified Campaigns container." >&2
              cleanup_failed=true
            else
              docker container rm --force \
                "$CAMPAIGNS_CI_POSTGRES_CONTAINER" > /dev/null
            fi
          fi
          if docker volume inspect \
            "$CAMPAIGNS_CI_POSTGRES_VOLUME" > /dev/null 2>&1; then
            volume_identity="$(
              docker volume inspect \
                --format '{{index .Labels "com.winwidget.owner"}}|{{index .Labels "com.winwidget.purpose"}}|{{index .Labels "com.winwidget.github-run"}}' \
                "$CAMPAIGNS_CI_POSTGRES_VOLUME"
            )"
            if [[ "$volume_identity" != "campaigns|ci-postgres-data|$GITHUB_RUN_ID" ]]; then
              echo "Refusing to remove an unverified Campaigns volume." >&2
              cleanup_failed=true
            else
              docker volume rm "$CAMPAIGNS_CI_POSTGRES_VOLUME" > /dev/null
            fi
          fi
          rm -f -- "$CAMPAIGNS_CI_POSTGRES_PASSWORD_FILE"
          [[ "$cleanup_failed" == "false" ]]

  deploy:
    needs: verify
    if: >-
      github.event_name == 'push' ||
      (
        inputs.deploy_target != 'notification-delivery-database' &&
        inputs.deploy_target != 'campaigns-database'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Add VPS host to known_hosts
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
        run: |
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Stage or deploy backend on VPS
        env:
          APP_ROOT: /opt/winwidget
          AUTOMATIC_PROD_PUSH: ${{ github.event_name == 'push' && 'true' || 'false' }}
          DEPLOY_REVISION: ${{ github.sha }}
          DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || 'all' }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "APP_ROOT='$APP_ROOT' AUTOMATIC_PROD_PUSH='$AUTOMATIC_PROD_PUSH' EXPECTED_REVISION='$DEPLOY_REVISION' DEPLOY_TARGET='$DEPLOY_TARGET' bash -s" <<'EOF'
          set -euo pipefail
          cd "$APP_ROOT/winwidget.ru_server"
          guard_campaigns_checkout_before_pull() {
            local expected_revision="$1"
            local lifecycle_script="scripts/campaigns-database-lifecycle.sh"
            local staged_marker="$APP_ROOT/deploy/backend/.campaigns-first-cutover-staged-v1"
            local cutover_marker="$APP_ROOT/deploy/backend/.campaigns-database-cutover-v1"
            local tracked_blob actual_blob

            [[ "$expected_revision" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Expected production revision is invalid." >&2
              return 1
            }
            tracked_blob="$(
              git rev-parse --verify "HEAD:$lifecycle_script" 2>/dev/null ||
                true
            )"
            if [[ -e "$lifecycle_script" || -L "$lifecycle_script" ]]; then
              [[ -f "$lifecycle_script" && ! -L "$lifecycle_script" ]] || {
                echo "Campaigns lifecycle guard script is unsafe." >&2
                return 1
              }
              actual_blob="$(git hash-object "$lifecycle_script")"
              [[ -n "$tracked_blob" && "$actual_blob" == "$tracked_blob" ]] || {
                echo "Campaigns lifecycle guard script differs from the checked-out revision." >&2
                return 1
              }
              APP_ROOT="$APP_ROOT" \
                bash "$lifecycle_script" \
                  --guard-checkout-revision "$expected_revision"
              return
            fi
            if [[ -n "$tracked_blob" ]]; then
              echo "Tracked Campaigns lifecycle guard script is missing." >&2
              return 1
            fi
            if [[ -e "$staged_marker" || -L "$staged_marker" ||
              -e "$cutover_marker" || -L "$cutover_marker" ]]; then
              echo "Campaigns marker exists but its checkout guard is unavailable." >&2
              return 1
            fi
          }
          checkout_verified_prod_revision() {
            local expected_revision="$1"
            local fetched_revision

            guard_campaigns_checkout_before_pull "$expected_revision"
            git fetch origin prod
            fetched_revision="$(git rev-parse FETCH_HEAD)"
            [[ "$fetched_revision" == "$expected_revision" ]] || {
              echo "Origin prod changed after workflow start; checkout was not modified." >&2
              return 1
            }
            git checkout prod
            git merge --ff-only "$fetched_revision"
            [[ "$(git rev-parse HEAD)" == "$expected_revision" ]] || {
              echo "Verified prod checkout revision mismatch." >&2
              return 1
            }
          }
          current_revision="$(git rev-parse HEAD)"
          if [[ "$AUTOMATIC_PROD_PUSH" == "true" &&
            "$current_revision" != "$EXPECTED_REVISION" ]]; then
            guard_campaigns_checkout_before_pull "$current_revision"
            if ! guard_campaigns_checkout_before_pull \
              "$EXPECTED_REVISION" > /dev/null 2>&1; then
              echo "Automatic backend deploy is verified but deferred: the incomplete Campaigns database lifecycle is pinned to $current_revision."
              echo "Run the protected campaigns-database restart action for $EXPECTED_REVISION."
              exit 0
            fi
          fi
          case "$DEPLOY_TARGET" in
            all)
              checkout_verified_prod_revision "$EXPECTED_REVISION"
              APP_ROOT="$APP_ROOT" \
                CAMPAIGNS_AUTOMATIC_PROD_PUSH="$AUTOMATIC_PROD_PUSH" \
                bash scripts/deploy-production.sh
              ;;
            maintenance)
              checkout_verified_prod_revision "$EXPECTED_REVISION"
              APP_ROOT="$APP_ROOT" bash scripts/deploy-maintenance-production.sh
              ;;
            notification-delivery)
              checkout_verified_prod_revision "$EXPECTED_REVISION"
              APP_ROOT="$APP_ROOT" bash scripts/deploy-notification-delivery-production.sh
              ;;
            campaigns)
              checkout_verified_prod_revision "$EXPECTED_REVISION"
              APP_ROOT="$APP_ROOT" bash scripts/deploy-campaigns-production.sh
              ;;
            *)
              echo "Unsupported deploy target: $DEPLOY_TARGET" >&2
              exit 1
              ;;
          esac
          EOF

  notification-delivery-database:
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_target == 'notification-delivery-database' &&
      github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    steps:
      - name: Configure SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
