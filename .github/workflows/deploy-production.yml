name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches:
      - prod

permissions:
  contents: read

concurrency:
  group: deploy-production-server
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: winwidget_ci
          POSTGRES_USER: winwidget
          POSTGRES_PASSWORD: winwidget_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U winwidget -d winwidget_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4.2-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: winwidget
          RABBITMQ_DEFAULT_PASS: winwidget_ci
          RABBITMQ_DEFAULT_VHOST: winwidget
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://winwidget:winwidget_ci@127.0.0.1:5432/winwidget_ci?schema=public
      DATABASE_URL_DEVELOPMENT: postgresql://winwidget:winwidget_ci@127.0.0.1:5432/winwidget_ci?schema=public
      RABBITMQ_URL: amqp://winwidget:winwidget_ci@127.0.0.1:5672/winwidget
      RABBITMQ_MANAGEMENT_URL: http://127.0.0.1:15672
      RABBITMQ_USER: winwidget
      RABBITMQ_PASSWORD: winwidget_ci
      RABBITMQ_MONITOR_USER: winwidget
      RABBITMQ_MONITOR_PASSWORD: winwidget_ci
      RABBITMQ_VHOST: winwidget

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy

      - name: Verify RabbitMQ Management API
        run: curl --fail --user "$RABBITMQ_USER:$RABBITMQ_PASSWORD" "$RABBITMQ_MANAGEMENT_URL/api/overview"

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm exec jest --runInBand

      - name: Validate production compose
        run: |
          docker compose --env-file .env.example -f deploy/docker-compose.prod.yml config --quiet
          docker compose --env-file .env.example -f deploy/docker-compose.prod.yml config --format json |
            node -e '
              const config = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
              const services = config.services ?? {};
              if (config.name !== "winwidget") {
                throw new Error(`Unexpected Compose project name: ${config.name}`);
              }
              for (const [name, service] of Object.entries(services)) {
                if ("container_name" in service) {
                  throw new Error(`${name} must use the standard Compose container name`);
                }
              }
              const rabbitVolume = config.volumes?.["winwidget-rabbitmq-data"];
              if (!rabbitVolume?.external || !rabbitVolume.name) {
                throw new Error("RabbitMQ must use a named external volume");
              }
              const persistentServiceNames = Object.entries(services)
                .filter(([, service]) => !(service.profiles ?? []).includes("migration"))
                .map(([name]) => name)
                .sort();
              const expectedPersistentServiceNames = [
                "api",
                "integration-worker",
                "maintenance-worker",
                "outbox-publisher",
                "rabbitmq",
              ];
              if (
                JSON.stringify(persistentServiceNames) !==
                JSON.stringify(expectedPersistentServiceNames)
              ) {
                throw new Error(
                  `Unexpected persistent services: ${persistentServiceNames.join(",")}`,
                );
              }

              const requireService = name => {
                const service = services[name];
                if (!service) throw new Error(`Missing production service ${name}`);
                return service;
              };
              const requireCommand = (name, expected) => {
                const command = requireService(name).command;
                const normalized = Array.isArray(command)
                  ? command.join(" ")
                  : String(command ?? "");
                if (normalized !== expected) {
                  throw new Error(`Unexpected ${name} command: ${normalized}`);
                }
              };
              const requireEnvironment = (name, keys, allowEmpty = []) => {
                const environment = requireService(name).environment ?? {};
                for (const key of keys) {
                  if (
                    !(key in environment) ||
                    (environment[key] === "" && !allowEmpty.includes(key))
                  ) {
                    throw new Error(`Missing ${key} in production ${name} environment`);
                  }
                }
                return environment;
              };
              const requireExactKinds = (environment, key, expected, name) => {
                const kinds = [...new Set(String(environment[key] ?? "")
                  .split(",")
                  .map(value => value.trim())
                  .filter(Boolean))].sort();
                const normalizedExpected = [...expected].sort();
                if (JSON.stringify(kinds) !== JSON.stringify(normalizedExpected)) {
                  throw new Error(
                    `${key} in ${name} must contain exactly ${normalizedExpected.join(",")}`,
                  );
                }
              };

              requireCommand(
                "outbox-publisher",
                "node dist/src/outbox-publisher-main.js",
              );
              requireCommand(
                "integration-worker",
                "node dist/src/integration-worker-main.js",
              );
              requireCommand(
                "maintenance-worker",
                "node dist/src/maintenance-worker-main.js",
              );

              requireEnvironment("api", [
                "RABBITMQ_MANAGEMENT_URL",
                "RABBITMQ_MONITOR_USER",
                "RABBITMQ_MONITOR_PASSWORD",
                "RABBITMQ_VHOST",
                "TRUST_PROXY",
              ]);
              requireEnvironment("outbox-publisher", [
                "DATABASE_URL_PRODUCTION",
                "RABBITMQ_URL",
                "RABBITMQ_ASSERT_TOPOLOGY",
                "MESSAGING_SERVICE_NAME",
              ], ["DATABASE_URL_PRODUCTION"]);
              const integrationEnvironment = requireEnvironment(
                "integration-worker",
                [
                  "DATABASE_URL_PRODUCTION",
                  "RABBITMQ_URL",
                  "RABBITMQ_ASSERT_TOPOLOGY",
                  "MESSAGING_SERVICE_NAME",
                  "INTEGRATION_WORKER_KINDS",
                ],
                ["DATABASE_URL_PRODUCTION"],
              );
              requireExactKinds(
                integrationEnvironment,
                "INTEGRATION_WORKER_KINDS",
                [
                  "email",
                  "webhook",
                  "telegram",
                  "bitrix24",
                  "amo-crm",
                  "payment-email",
                  "payment-telegram",
                  "mailing-email",
                  "mailing-telegram",
                  "limit-email",
                  "limit-telegram",
                  "daily-summary-telegram",
                ],
                "integration-worker",
              );
              const maintenance = requireService("maintenance-worker");
              const maintenanceEnvironment = requireEnvironment(
                "maintenance-worker",
                [
                  "DATABASE_URL_PRODUCTION",
                  "RABBITMQ_URL",
                  "RABBITMQ_ASSERT_TOPOLOGY",
                  "MESSAGING_SERVICE_NAME",
                  "MAINTENANCE_WORKER_PREFETCH",
                  "SCHEDULED_JOB_POLL_INTERVAL_MS",
                  "SCHEDULED_JOB_LEASE_MS",
                  "SCHEDULED_JOB_LEASE_RENEW_INTERVAL_MS",
                  "MAINTENANCE_WORKER_KINDS",
                ],
                ["DATABASE_URL_PRODUCTION"],
              );
              requireExactKinds(
                maintenanceEnvironment,
                "MAINTENANCE_WORKER_KINDS",
                ["database-backup"],
                "maintenance-worker",
              );
              if ("RABBITMQ_URL" in (services.api.environment ?? {})) {
                throw new Error("api must not receive an AMQP URL");
              }
              const rabbitUsers = [
                services.rabbitmq.environment?.RABBITMQ_DEFAULT_USER,
                services.api.environment?.RABBITMQ_MONITOR_USER,
                new URL(services["outbox-publisher"].environment.RABBITMQ_URL).username,
                new URL(services["integration-worker"].environment.RABBITMQ_URL).username,
                new URL(services["maintenance-worker"].environment.RABBITMQ_URL).username,
              ];
              if (
                services.rabbitmq.environment?.RABBITMQ_DEFAULT_VHOST !== "winwidget" ||
                services.api.environment?.RABBITMQ_VHOST !== "winwidget"
              ) {
                throw new Error("Production RabbitMQ vhost must be winwidget");
              }
              for (const name of ["outbox-publisher", "integration-worker", "maintenance-worker"]) {
                if (new URL(services[name].environment.RABBITMQ_URL).pathname !== "/winwidget") {
                  throw new Error(`${name} must connect to the winwidget vhost`);
                }
              }
              if (
                rabbitUsers.some(value => !value) ||
                new Set(rabbitUsers).size !== rabbitUsers.length
              ) {
                throw new Error("RabbitMQ admin, monitor and service users must be distinct");
              }
              if (
                services["outbox-publisher"].environment.RABBITMQ_ASSERT_TOPOLOGY !== "true" ||
                services["integration-worker"].environment.RABBITMQ_ASSERT_TOPOLOGY !== "false" ||
                services["maintenance-worker"].environment.RABBITMQ_ASSERT_TOPOLOGY !== "false"
              ) {
                throw new Error("Only outbox-publisher may assert RabbitMQ topology");
              }
              for (const name of ["outbox-publisher", "integration-worker", "maintenance-worker"]) {
                const environment = services[name].environment ?? {};
                for (const forbidden of ["JWT_SECRET", "RABBITMQ_MONITOR_PASSWORD"]) {
                  if (forbidden in environment) {
                    throw new Error(`${name} must not receive ${forbidden}`);
                  }
                }
              }
              const tmpfs = Array.isArray(maintenance.tmpfs)
                ? maintenance.tmpfs.map(value =>
                    typeof value === "string" ? value : JSON.stringify(value),
                  )
                : [];
              if (
                !tmpfs.some(
                  value =>
                    value.startsWith("/tmp") &&
                    (value.includes("size=64m") ||
                      value.includes("size=67108864") ||
                      value.includes("\"size\":67108864")) &&
                    (value.includes("mode=1777") ||
                      value.includes("\"mode\":1777") ||
                      value.includes("\"mode\":\"1777\"")),
                )
              ) {
                throw new Error("maintenance-worker must use bounded /tmp tmpfs");
              }
            '

      - name: Build
        run: pnpm build

      - name: Build and verify production image
        run: |
          docker compose --env-file .env.example -f deploy/docker-compose.prod.yml build api
          docker compose --env-file .env.example -f deploy/docker-compose.prod.yml \
            run --rm --no-deps --entrypoint sh api -lc \
            'pg_dump --version && pg_restore --version && test -f dist/src/maintenance-worker-main.js'

      - name: Messaging integration smoke
        env:
          RABBITMQ_CONTAINER_ID: ${{ job.services.rabbitmq.id }}
        run: pnpm run test:messaging-integration

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Add VPS host to known_hosts
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
        run: |
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy backend on VPS
        env:
          APP_ROOT: /opt/winwidget
          DEPLOY_REVISION: ${{ github.sha }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "APP_ROOT='$APP_ROOT' EXPECTED_REVISION='$DEPLOY_REVISION' bash -s" <<'EOF'
          set -euo pipefail
          cd "$APP_ROOT/winwidget.ru_server"
          git fetch origin prod
          git checkout prod
          git pull --ff-only origin prod
          APP_ROOT="$APP_ROOT" bash scripts/deploy-production.sh
          EOF
