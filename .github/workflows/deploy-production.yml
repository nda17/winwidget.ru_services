          docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl add_user \
              reporting_ci reporting_ci_password_at_least_32_characters
          docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl set_permissions \
              --vhost winwidget \
              reporting_ci \
              '^winwidget\.reporting(\..*)?$' \
              '^(winwidget\.(events|dead-letter)|winwidget\.reporting(\..*)?)$' \
              '^(winwidget\.(events|dead-letter)|winwidget\.reporting(\..*)?)$'
          docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl clear_topic_permissions \
              --vhost winwidget \
              reporting_ci
          docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl set_topic_permissions \
              --vhost winwidget \
              reporting_ci \
              winwidget.events \
              '^(notification\.daily-summary\.telegram\.requested\.v1|admin\.audit\.reporting\.v1)$' \
              '^(identity\.user\.changed\.v1|billing\.(payment|subscription)\.changed\.v1|widgets\.(widget|lead)\.changed\.v1|reporting\.(settings|core-operational-routing)\.changed\.v1|reporting\.notification\.delivery\.outcome\.v1)$'
          docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl set_topic_permissions \
              --vhost winwidget \
              reporting_ci \
              winwidget.dead-letter \
              '^reporting\.(identityUser|billingPayment|billingSubscription|widget|lead|reportingSettings|deliveryOutcome)\.dead-letter$' \
              '^reporting\.(identityUser|billingPayment|billingSubscription|widget|lead|reportingSettings|deliveryOutcome)\.dead-letter$'
          docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl set_user_tags reporting_ci
          docker exec "$RABBITMQ_CONTAINER_ID" \
            rabbitmqctl authenticate_user \
              reporting_ci reporting_ci_password_at_least_32_characters
          regular_permissions="$(
            docker exec "$RABBITMQ_CONTAINER_ID" \
              rabbitmqctl --silent list_user_permissions reporting_ci |
              awk 'NF == 4 { print $1 "|" $2 "|" $3 "|" $4 }'
          )"
          test "$regular_permissions" = \
            'winwidget|^winwidget\.reporting(\..*)?$|^(winwidget\.(events|dead-letter)|winwidget\.reporting(\..*)?)$|^(winwidget\.(events|dead-letter)|winwidget\.reporting(\..*)?)$'
          topic_permissions="$(
            docker exec "$RABBITMQ_CONTAINER_ID" \
              rabbitmqctl --silent list_user_topic_permissions reporting_ci |
              awk 'NF == 4 { print $1 "|" $2 "|" $3 "|" $4 }' |
              sort
          )"
          expected_topic_permissions="$(
            printf '%s\n' \
              'winwidget|winwidget.dead-letter|^reporting\.(identityUser|billingPayment|billingSubscription|widget|lead|reportingSettings|deliveryOutcome)\.dead-letter$|^reporting\.(identityUser|billingPayment|billingSubscription|widget|lead|reportingSettings|deliveryOutcome)\.dead-letter$' \
              'winwidget|winwidget.events|^(notification\.daily-summary\.telegram\.requested\.v1|admin\.audit\.reporting\.v1)$|^(identity\.user\.changed\.v1|billing\.(payment|subscription)\.changed\.v1|widgets\.(widget|lead)\.changed\.v1|reporting\.(settings|core-operational-routing)\.changed\.v1|reporting\.notification\.delivery\.outcome\.v1)$' |
              sort
          )"
          test "$topic_permissions" = "$expected_topic_permissions"

      - name: Reporting restricted integration smoke
        env:
          REPORTING_INTEGRATION_ALLOW_MUTATION: 'true'
          REPORTING_TEST_DATABASE_URL: ${{ env.REPORTING_DATABASE_URL }}
          REPORTING_TEST_MIGRATION_DATABASE_URL: ${{ env.REPORTING_CI_MIGRATION_DATABASE_URL }}
          REPORTING_TEST_RABBITMQ_URL: amqp://reporting_ci:reporting_ci_password_at_least_32_characters@127.0.0.1:5672/winwidget
          REPORTING_TEST_RABBITMQ_ADMIN_URL: ${{ env.RABBITMQ_URL }}
        run: pnpm --dir apps/reporting run test:integration

      - name: Cleanup isolated Notification Delivery PostgreSQL
        if: ${{ always() }}
        env:
          NOTIFICATION_DELIVERY_CI_POSTGRES_PASSWORD_FILE: ${{ runner.temp }}/winwidget-notification-delivery-postgres-admin-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cleanup_failed=false

          if docker container inspect \
            "$NOTIFICATION_DELIVERY_CI_POSTGRES_CONTAINER" > /dev/null 2>&1; then
            container_owner="$(
              docker container inspect \
                --format '{{index .Config.Labels "com.winwidget.owner"}}' \
                "$NOTIFICATION_DELIVERY_CI_POSTGRES_CONTAINER"
            )"
            container_purpose="$(
              docker container inspect \
                --format '{{index .Config.Labels "com.winwidget.purpose"}}' \
                "$NOTIFICATION_DELIVERY_CI_POSTGRES_CONTAINER"
            )"
            container_run="$(
              docker container inspect \
                --format '{{index .Config.Labels "com.winwidget.github-run"}}' \
                "$NOTIFICATION_DELIVERY_CI_POSTGRES_CONTAINER"
            )"
            if [[
              "$container_owner" != "notification-delivery" ||
              "$container_purpose" != "ci-postgres" ||
              "$container_run" != "$GITHUB_RUN_ID"
            ]]; then
              echo "Refusing to remove an unverified PostgreSQL container." >&2
              cleanup_failed=true
            else
              docker container rm --force \
                "$NOTIFICATION_DELIVERY_CI_POSTGRES_CONTAINER" > /dev/null
            fi
          fi

          if docker volume inspect \
            "$NOTIFICATION_DELIVERY_CI_POSTGRES_VOLUME" > /dev/null 2>&1; then
            volume_owner="$(
              docker volume inspect \
                --format '{{index .Labels "com.winwidget.owner"}}' \
                "$NOTIFICATION_DELIVERY_CI_POSTGRES_VOLUME"
            )"
            volume_purpose="$(
              docker volume inspect \
                --format '{{index .Labels "com.winwidget.purpose"}}' \
                "$NOTIFICATION_DELIVERY_CI_POSTGRES_VOLUME"
            )"
            volume_run="$(
              docker volume inspect \
                --format '{{index .Labels "com.winwidget.github-run"}}' \
                "$NOTIFICATION_DELIVERY_CI_POSTGRES_VOLUME"
            )"
            if [[
              "$volume_owner" != "notification-delivery" ||
              "$volume_purpose" != "ci-postgres-data" ||
              "$volume_run" != "$GITHUB_RUN_ID"
            ]]; then
              echo "Refusing to remove an unverified PostgreSQL volume." >&2
              cleanup_failed=true
            else
              docker volume rm \
                "$NOTIFICATION_DELIVERY_CI_POSTGRES_VOLUME" > /dev/null
            fi
          fi

          rm -f -- "$NOTIFICATION_DELIVERY_CI_POSTGRES_PASSWORD_FILE"
          if [[ "$cleanup_failed" == "true" ]]; then
            exit 1
          fi

      - name: Cleanup isolated Campaigns PostgreSQL
        if: ${{ always() }}
        env:
          CAMPAIGNS_CI_POSTGRES_PASSWORD_FILE: ${{ runner.temp }}/winwidget-campaigns-postgres-admin-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cleanup_failed=false
          if docker container inspect \
            "$CAMPAIGNS_CI_POSTGRES_CONTAINER" > /dev/null 2>&1; then
            container_identity="$(
              docker container inspect \
                --format '{{index .Config.Labels "com.winwidget.owner"}}|{{index .Config.Labels "com.winwidget.purpose"}}|{{index .Config.Labels "com.winwidget.github-run"}}' \
                "$CAMPAIGNS_CI_POSTGRES_CONTAINER"
            )"
            if [[ "$container_identity" != "campaigns|ci-postgres|$GITHUB_RUN_ID" ]]; then
              echo "Refusing to remove an unverified Campaigns container." >&2
              cleanup_failed=true
            else
              docker container rm --force \
                "$CAMPAIGNS_CI_POSTGRES_CONTAINER" > /dev/null
            fi
          fi
          if docker volume inspect \
            "$CAMPAIGNS_CI_POSTGRES_VOLUME" > /dev/null 2>&1; then
            volume_identity="$(
              docker volume inspect \
                --format '{{index .Labels "com.winwidget.owner"}}|{{index .Labels "com.winwidget.purpose"}}|{{index .Labels "com.winwidget.github-run"}}' \
                "$CAMPAIGNS_CI_POSTGRES_VOLUME"
            )"
            if [[ "$volume_identity" != "campaigns|ci-postgres-data|$GITHUB_RUN_ID" ]]; then
              echo "Refusing to remove an unverified Campaigns volume." >&2
              cleanup_failed=true
            else
              docker volume rm "$CAMPAIGNS_CI_POSTGRES_VOLUME" > /dev/null
            fi
          fi
          rm -f -- "$CAMPAIGNS_CI_POSTGRES_PASSWORD_FILE"
          [[ "$cleanup_failed" == "false" ]]

      - name: Cleanup isolated Reporting PostgreSQL
        if: ${{ always() }}
        env:
          REPORTING_CI_POSTGRES_PASSWORD_FILE: ${{ runner.temp }}/winwidget-reporting-postgres-admin-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cleanup_failed=false
          if docker container inspect \
            "$REPORTING_CI_POSTGRES_CONTAINER" > /dev/null 2>&1; then
            container_identity="$(
              docker container inspect \
                --format '{{index .Config.Labels "com.winwidget.owner"}}|{{index .Config.Labels "com.winwidget.purpose"}}|{{index .Config.Labels "com.winwidget.github-run"}}' \
                "$REPORTING_CI_POSTGRES_CONTAINER"
            )"
            if [[ "$container_identity" != "reporting|ci-postgres|$GITHUB_RUN_ID" ]]; then
              echo "Refusing to remove an unverified Reporting container." >&2
              cleanup_failed=true
            else
              docker container rm --force \
                "$REPORTING_CI_POSTGRES_CONTAINER" > /dev/null
            fi
          fi
          if docker volume inspect \
            "$REPORTING_CI_POSTGRES_VOLUME" > /dev/null 2>&1; then
            volume_identity="$(
              docker volume inspect \
                --format '{{index .Labels "com.winwidget.owner"}}|{{index .Labels "com.winwidget.purpose"}}|{{index .Labels "com.winwidget.github-run"}}' \
                "$REPORTING_CI_POSTGRES_VOLUME"
            )"
            if [[ "$volume_identity" != "reporting|ci-postgres-data|$GITHUB_RUN_ID" ]]; then
              echo "Refusing to remove an unverified Reporting volume." >&2
              cleanup_failed=true
            else
              docker volume rm "$REPORTING_CI_POSTGRES_VOLUME" > /dev/null
            fi
          fi
          rm -f -- "$REPORTING_CI_POSTGRES_PASSWORD_FILE"
          [[ "$cleanup_failed" == "false" ]]

  deploy:
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Add VPS host to known_hosts
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
        run: |
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Stage or deploy backend on VPS
        env:
          APP_ROOT: /opt/winwidget
          AUTOMATIC_PROD_PUSH: ${{ github.event_name == 'push' && 'true' || 'false' }}
          DEPLOY_REVISION: ${{ github.sha }}
          DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || 'all' }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "APP_ROOT='$APP_ROOT' AUTOMATIC_PROD_PUSH='$AUTOMATIC_PROD_PUSH' EXPECTED_REVISION='$DEPLOY_REVISION' DEPLOY_TARGET='$DEPLOY_TARGET' bash -s" <<'EOF'
          set -euo pipefail
          unset ENV_FILE COMPOSE_FILE REPORTING_DATABASE_MARKER \
            REPORTING_FIRST_ROLLOUT_STAGED_MARKER
          cd "$APP_ROOT/winwidget.ru_server"
          lock_script="scripts/production-deploy-lock.sh"
          [[ "$(id -u)" == "0" && -f "$lock_script" && ! -L "$lock_script" &&
            "$(git branch --show-current)" == "prod" &&
            -z "$(git status --porcelain --untracked-files=all)" ]] || {
            echo "Backend checkout requires a trusted clean prod bootstrap." >&2
            exit 1
          }
          tracked_lock_blob="$(git rev-parse --verify "HEAD:$lock_script")"
          [[ "$(git hash-object "$lock_script")" == "$tracked_lock_blob" ]] || {
            echo "Production lock script differs from the checked-out revision." >&2
            exit 1
          }
          # shellcheck source=/dev/null
          source "$lock_script"
          acquire_production_deploy_lock "backend checkout and deployment"
          guard_campaigns_checkout_before_pull() {
            local expected_revision="$1"
            local lifecycle_script="scripts/campaigns-database-lifecycle.sh"
            local staged_marker="$APP_ROOT/deploy/backend/.campaigns-first-cutover-staged-v1"
            local cutover_marker="$APP_ROOT/deploy/backend/.campaigns-database-cutover-v1"
            local tracked_blob actual_blob

            [[ "$expected_revision" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Expected production revision is invalid." >&2
              return 1
            }
            tracked_blob="$(
              git rev-parse --verify "HEAD:$lifecycle_script" 2>/dev/null ||
                true
            )"
            if [[ -e "$lifecycle_script" || -L "$lifecycle_script" ]]; then
              [[ -f "$lifecycle_script" && ! -L "$lifecycle_script" ]] || {
                echo "Campaigns lifecycle guard script is unsafe." >&2
                return 1
              }
              actual_blob="$(git hash-object "$lifecycle_script")"
              [[ -n "$tracked_blob" && "$actual_blob" == "$tracked_blob" ]] || {
                echo "Campaigns lifecycle guard script differs from the checked-out revision." >&2
                return 1
              }
              APP_ROOT="$APP_ROOT" \
                bash "$lifecycle_script" \
                  --guard-checkout-revision "$expected_revision"
              return
            fi
            if [[ -n "$tracked_blob" ]]; then
              echo "Tracked Campaigns lifecycle guard script is missing." >&2
              return 1
            fi
            if [[ -e "$staged_marker" || -L "$staged_marker" ||
              -e "$cutover_marker" || -L "$cutover_marker" ]]; then
              echo "Campaigns marker exists but its checkout guard is unavailable." >&2
              return 1
            fi
          }
          guard_reporting_checkout_before_pull() {
            local expected_revision="$1"
            local guard_action="${2:---guard-before-fetch-revision}"
            local lifecycle_script="scripts/reporting-database-lifecycle.sh"
            local staged_marker="$APP_ROOT/deploy/backend/.reporting-first-rollout-staged-v1"
            local database_marker="$APP_ROOT/deploy/backend/.reporting-database-lifecycle-v1"
            local cutover_marker="$APP_ROOT/deploy/backend/.reporting-database-cutover-v1"
            local tracked_blob actual_blob

            [[ "$expected_revision" =~ ^[0-9a-f]{40}$ &&
              "$guard_action" =~ ^--guard-before-(fetch|checkout)-revision$ ]] || {
              echo "Expected Reporting revision is invalid." >&2
              return 1
            }
            tracked_blob="$(
              git rev-parse --verify "HEAD:$lifecycle_script" 2>/dev/null ||
                true
            )"
            if [[ -e "$lifecycle_script" || -L "$lifecycle_script" ]]; then
              [[ -f "$lifecycle_script" && ! -L "$lifecycle_script" ]] || {
                echo "Reporting lifecycle guard script is unsafe." >&2
                return 1
              }
              actual_blob="$(git hash-object "$lifecycle_script")"
              [[ -n "$tracked_blob" && "$actual_blob" == "$tracked_blob" ]] || {
                echo "Reporting lifecycle guard script differs from the checked-out revision." >&2
                return 1
              }
              APP_ROOT="$APP_ROOT" \
                bash "$lifecycle_script" \
                  "$guard_action" "$expected_revision"
              return
            fi
            if [[ -n "$tracked_blob" ]]; then
              echo "Tracked Reporting lifecycle guard script is missing." >&2
              return 1
            fi
            if [[ -e "$staged_marker" || -L "$staged_marker" ||
              -e "$database_marker" || -L "$database_marker" ||
              -e "$cutover_marker" || -L "$cutover_marker" ]]; then
              echo "Reporting marker exists but its checkout guard is unavailable." >&2
              return 1
            fi
          }
          checkout_verified_prod_revision() {
            local expected_revision="$1"
            local current_revision fetched_revision

            current_revision="$(git rev-parse HEAD)"
            guard_campaigns_checkout_before_pull "$current_revision"
            guard_reporting_checkout_before_pull "$current_revision"
            guard_campaigns_checkout_before_pull "$expected_revision"
            guard_reporting_checkout_before_pull "$expected_revision"
            git fetch origin prod
            fetched_revision="$(git rev-parse FETCH_HEAD)"
            [[ "$fetched_revision" == "$expected_revision" ]] || {
              echo "Origin prod changed after workflow start; checkout was not modified." >&2
              return 1
            }
            guard_reporting_checkout_before_pull \
              "$expected_revision" --guard-before-checkout-revision
            git checkout prod
            git merge --ff-only "$fetched_revision"
            [[ "$(git rev-parse HEAD)" == "$expected_revision" ]] || {
              echo "Verified prod checkout revision mismatch." >&2
              return 1
            }
          }
          current_revision="$(git rev-parse HEAD)"
          if [[ "$AUTOMATIC_PROD_PUSH" == "true" &&
            "$current_revision" != "$EXPECTED_REVISION" ]]; then
            guard_campaigns_checkout_before_pull "$current_revision"
            guard_reporting_checkout_before_pull "$current_revision"
            if ! guard_campaigns_checkout_before_pull \
              "$EXPECTED_REVISION" > /dev/null 2>&1; then
              echo "Automatic backend deploy is verified but deferred: the incomplete Campaigns database lifecycle is pinned to $current_revision."
              echo "Resolve the pinned Campaigns lifecycle guard from the production runbook before deploying $EXPECTED_REVISION."
              exit 0
            fi
            if ! guard_reporting_checkout_before_pull \
              "$EXPECTED_REVISION" > /dev/null 2>&1; then
              echo "Automatic backend deploy is verified but deferred: Reporting first-rollout preparation is pinned to $current_revision."
              echo "Resolve the pinned Reporting lifecycle guard before deploying another revision."
              exit 0
            fi
          fi
          case "$DEPLOY_TARGET" in
            all)
              checkout_verified_prod_revision "$EXPECTED_REVISION"
              APP_ROOT="$APP_ROOT" \
                CAMPAIGNS_AUTOMATIC_PROD_PUSH="$AUTOMATIC_PROD_PUSH" \
                REPORTING_AUTOMATIC_PROD_PUSH="$AUTOMATIC_PROD_PUSH" \
                bash scripts/deploy-production.sh
              exit 0
              ;;
            maintenance)
              checkout_verified_prod_revision "$EXPECTED_REVISION"
              APP_ROOT="$APP_ROOT" bash scripts/deploy-maintenance-production.sh
              ;;
            notification-delivery)
              checkout_verified_prod_revision "$EXPECTED_REVISION"
              APP_ROOT="$APP_ROOT" bash scripts/deploy-notification-delivery-production.sh
              ;;
            campaigns)
              checkout_verified_prod_revision "$EXPECTED_REVISION"
              APP_ROOT="$APP_ROOT" bash scripts/deploy-campaigns-production.sh
              ;;
            reporting)
              checkout_verified_prod_revision "$EXPECTED_REVISION"
              APP_ROOT="$APP_ROOT" bash scripts/deploy-reporting-production.sh
              ;;
            *)
              echo "Unsupported deploy target: $DEPLOY_TARGET" >&2
              exit 1
              ;;
          esac
          EOF
