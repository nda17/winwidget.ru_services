      - name: Verify Notification Delivery PostgreSQL persistence and restore
        env:
          NOTIFICATION_DELIVERY_CI_POSTGRES_PASSWORD_FILE: ${{ runner.temp }}/winwidget-notification-delivery-postgres-admin-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_CONTAINER_ID: ${{ env.NOTIFICATION_DELIVERY_CI_POSTGRES_CONTAINER }}
        run: |
          sentinel_id=00000000-0000-4000-8000-000000000001
          source_dump="$RUNNER_TEMP/notification-delivery-ci.dump"
          source_manifest="$RUNNER_TEMP/notification-delivery-source.manifest"
          restore_manifest="$RUNNER_TEMP/notification-delivery-restore.manifest"

          docker exec -i \
            --env PGPASSWORD=winwidget_notification_delivery_runtime_ci \
            "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 \
              --host 127.0.0.1 \
              --username winwidget_notification_delivery_runtime \
              --dbname winwidget_notification_delivery_ci <<SQL
          INSERT INTO notification_delivery.heartbeats (
            id,
            service,
            instance_id,
            metadata,
            updated_at
          ) VALUES (
            '$sentinel_id',
            'ci-persistence-probe',
            'ci-persistence-probe',
            '{"persisted":true}'::jsonb,
            CURRENT_TIMESTAMP
          );
          SELECT setval(
            'notification_delivery.ci_runtime_sequence',
            4242,
            true
          );
          SQL

          system_identifier="$(
            docker exec "$POSTGRES_CONTAINER_ID" \
              psql --tuples-only --no-align \
                --username winwidget_notification_delivery_admin \
                --dbname postgres \
                --command "SELECT system_identifier FROM pg_control_system()"
          )"
          test -n "$system_identifier"

          docker rm --force "$POSTGRES_CONTAINER_ID" > /dev/null
          docker run --detach \
            --name "$POSTGRES_CONTAINER_ID" \
            --label com.winwidget.owner=notification-delivery \
            --label com.winwidget.purpose=ci-postgres \
            --label "com.winwidget.github-run=$GITHUB_RUN_ID" \
            --publish 127.0.0.1:55432:5432 \
            --mount \
              "type=volume,source=$NOTIFICATION_DELIVERY_CI_POSTGRES_VOLUME,target=/var/lib/postgresql" \
            --mount \
              "type=bind,source=$NOTIFICATION_DELIVERY_CI_POSTGRES_PASSWORD_FILE,target=/run/secrets/notification-delivery-postgres-admin-password,readonly" \
            --env POSTGRES_DB=winwidget_notification_delivery_ci \
            --env POSTGRES_USER=winwidget_notification_delivery_admin \
            --env POSTGRES_PASSWORD_FILE=/run/secrets/notification-delivery-postgres-admin-password \
            --env "POSTGRES_INITDB_ARGS=--locale=C.UTF-8 --encoding=UTF8 --auth-host=scram-sha-256 --data-checksums" \
            --env PGDATA=/var/lib/postgresql/18/docker \
            --health-cmd \
              "pg_isready --username winwidget_notification_delivery_admin --dbname winwidget_notification_delivery_ci" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 20 \
            postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296 > /dev/null
          for attempt in $(seq 1 30); do
            health="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' \
                "$POSTGRES_CONTAINER_ID"
            )"
            if [[ "$health" == "healthy" ]]; then
              break
            fi
            if [[ "$health" == "unhealthy" || "$attempt" == "30" ]]; then
              docker logs "$POSTGRES_CONTAINER_ID" >&2
              echo "Notification Delivery PostgreSQL did not recover after restart." >&2
              exit 1
            fi
            sleep 2
          done

          test "$(
            docker exec "$POSTGRES_CONTAINER_ID" \
              psql --tuples-only --no-align \
                --username winwidget_notification_delivery_admin \
                --dbname postgres \
                --command "SELECT system_identifier FROM pg_control_system()"
          )" = "$system_identifier"
          test "$(
            docker inspect \
              --format '{{range .Mounts}}{{printf "%s|%s|%s|%t\n" .Destination .Type .Name .RW}}{{end}}' \
              "$POSTGRES_CONTAINER_ID" |
              awk -F'|' '$1 == "/var/lib/postgresql" || index($1, "/var/lib/postgresql/") == 1'
          )" = "/var/lib/postgresql|volume|$NOTIFICATION_DELIVERY_CI_POSTGRES_VOLUME|true"
          test "$(
            docker exec \
              --env PGPASSWORD=winwidget_notification_delivery_runtime_ci \
              "$POSTGRES_CONTAINER_ID" \
              psql --tuples-only --no-align \
                --host 127.0.0.1 \
                --username winwidget_notification_delivery_runtime \
                --dbname winwidget_notification_delivery_ci \
                --command "
                  SELECT count(*)
                  FROM notification_delivery.heartbeats
                  WHERE id = '$sentinel_id'
                    AND metadata = '{\"persisted\":true}'::jsonb;
                "
          )" = "1"

          docker exec \
            --env PGPASSWORD=winwidget_notification_delivery_backup_ci \
            "$POSTGRES_CONTAINER_ID" \
            pg_dump \
              --host 127.0.0.1 \
              --username winwidget_notification_delivery_backup \
              --dbname winwidget_notification_delivery_ci \
              --format custom \
              --no-owner \
              --no-privileges \
              --schema notification_delivery \
              --file /tmp/notification-delivery-ci.dump
          docker exec "$POSTGRES_CONTAINER_ID" \
            pg_restore --list /tmp/notification-delivery-ci.dump > /dev/null
          docker cp \
            "$POSTGRES_CONTAINER_ID:/tmp/notification-delivery-ci.dump" \
            "$source_dump"
          test -s "$source_dump"
          docker cp \
            "$source_dump" \
            "$POSTGRES_CONTAINER_ID:/tmp/notification-delivery-restore.dump"

          docker exec "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 \
              --username winwidget_notification_delivery_admin \
              --dbname postgres \
              --command "
                CREATE DATABASE winwidget_notification_delivery_restore_ci
                  WITH TEMPLATE template0;
              "
          docker exec "$POSTGRES_CONTAINER_ID" \
            pg_restore \
              --exit-on-error \
              --single-transaction \
              --no-owner \
              --no-privileges \
              --username winwidget_notification_delivery_admin \
              --dbname winwidget_notification_delivery_restore_ci \
              /tmp/notification-delivery-restore.dump

          build_manifest() {
            local database="$1"
            local output="$2"
            local tables
            local table

            tables="$(
              docker exec "$POSTGRES_CONTAINER_ID" \
                psql --tuples-only --no-align \
                  --username winwidget_notification_delivery_admin \
                  --dbname "$database" \
                  --command "
                    SELECT tablename
                    FROM pg_tables
                    WHERE schemaname = 'notification_delivery'
                    ORDER BY tablename;
                  "
            )"
            test -n "$tables"
            : > "$output"
            while IFS= read -r table; do
              [[ "$table" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]
              docker exec "$POSTGRES_CONTAINER_ID" \
                psql --tuples-only --no-align --field-separator '|' \
                  --username winwidget_notification_delivery_admin \
                  --dbname "$database" \
                  --command "
                    SELECT
                      '$table',
                      count(*),
                      md5(
                        COALESCE(
                          string_agg(
                            row_json,
                            E'\\n'
                            ORDER BY row_json COLLATE \"C\"
                          ),
                          ''
                        )
                      )
                    FROM (
                      SELECT to_jsonb(source_row)::text AS row_json
                      FROM notification_delivery.\"$table\" AS source_row
                    ) AS rows;
                  " >> "$output"
            done <<< "$tables"
            docker exec "$POSTGRES_CONTAINER_ID" \
              psql --tuples-only --no-align --field-separator '|' \
                --username winwidget_notification_delivery_admin \
                --dbname "$database" \
                --command "
                  SELECT
                    '@sequence',
                    sequencename,
                    COALESCE(last_value::text, 'NULL'),
                    start_value,
                    increment_by,
                    min_value,
                    max_value,
                    cache_size,
                    cycle
                  FROM pg_sequences
                  WHERE schemaname = 'notification_delivery'
                  ORDER BY sequencename;
                " >> "$output"
          }

          build_manifest winwidget_notification_delivery_ci "$source_manifest"
          build_manifest \
            winwidget_notification_delivery_restore_ci \
            "$restore_manifest"
          diff -u "$source_manifest" "$restore_manifest"
          grep -Eq '^_prisma_migrations\|[1-9][0-9]*\|' "$restore_manifest"
          grep -Eq '^heartbeats\|1\|' "$restore_manifest"
          grep -Eq '^@sequence\|ci_runtime_sequence\|4242\|' "$restore_manifest"

          docker exec "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 \
              --username winwidget_notification_delivery_admin \
              --dbname postgres \
              --command "
                DROP DATABASE winwidget_notification_delivery_restore_ci
                  WITH (FORCE);
              "

      - name: Verify Campaigns PostgreSQL persistence and restore
        env:
          POSTGRES_CONTAINER_ID: ${{ env.CAMPAIGNS_CI_POSTGRES_CONTAINER }}
        run: |
          campaign_id=11111111-1111-4111-8111-111111111111
          idempotency_key=22222222-2222-4222-8222-222222222222
          before_system_id="$(
