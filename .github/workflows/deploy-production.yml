name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Production deployment target
        required: true
        default: all
        type: choice
        options:
          - all
          - maintenance
          - notification-delivery
          - campaigns
          - reporting
  push:
    branches:
      - prod

permissions:
  contents: read

concurrency:
  group: deploy-production-server
  cancel-in-progress: false

jobs:
  lifecycle_checkout_preflight:
    name: Active lifecycle checkout preflight
    if: >-
      github.ref == 'refs/heads/prod' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Configure SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Add VPS host to known_hosts
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
        run: |
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Reject a checkout that would strand an active lifecycle
        env:
          APP_ROOT: /opt/winwidget
          AUTOMATIC_PROD_PUSH: ${{ github.event_name == 'push' && 'true' || 'false' }}
          DEPLOY_REVISION: ${{ github.sha }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "APP_ROOT='$APP_ROOT' EXPECTED_REVISION='$DEPLOY_REVISION' AUTOMATIC_PROD_PUSH='$AUTOMATIC_PROD_PUSH' bash -s" <<'EOF'
          set -euo pipefail
          cd "$APP_ROOT/winwidget.ru_server"
          [[ "$(id -u)" == "0" &&
            "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ &&
            "$(git branch --show-current)" == "prod" &&
            -z "$(git status --porcelain --untracked-files=all)" ]] || {
            echo "Lifecycle preflight requires a trusted clean prod checkout." >&2
            exit 1
          }

          guard_campaigns_checkout_before_pull() {
            local expected_revision="$1"
            local lifecycle_script="scripts/campaigns-database-lifecycle.sh"
            local staged_marker="$APP_ROOT/deploy/backend/.campaigns-first-cutover-staged-v1"
            local cutover_marker="$APP_ROOT/deploy/backend/.campaigns-database-cutover-v1"
            local tracked_blob actual_blob

            [[ "$expected_revision" =~ ^[0-9a-f]{40}$ ]] || return 1
            tracked_blob="$(
              git rev-parse --verify "HEAD:$lifecycle_script" 2>/dev/null ||
                true
            )"
            if [[ -e "$lifecycle_script" || -L "$lifecycle_script" ]]; then
              [[ -f "$lifecycle_script" && ! -L "$lifecycle_script" ]] || return 1
              actual_blob="$(git hash-object "$lifecycle_script")"
              [[ -n "$tracked_blob" && "$actual_blob" == "$tracked_blob" ]] || return 1
              APP_ROOT="$APP_ROOT" \
                bash "$lifecycle_script" \
                  --guard-checkout-revision "$expected_revision"
              return
            fi
            [[ -z "$tracked_blob" ]] || return 1
            [[ ! -e "$staged_marker" && ! -L "$staged_marker" &&
              ! -e "$cutover_marker" && ! -L "$cutover_marker" ]]
          }

          guard_reporting_checkout_before_pull() {
            local expected_revision="$1"
            local guard_action="${2:---guard-before-fetch-revision}"
            local lifecycle_script="scripts/reporting-database-lifecycle.sh"
            local staged_marker="$APP_ROOT/deploy/backend/.reporting-first-rollout-staged-v1"
            local database_marker="$APP_ROOT/deploy/backend/.reporting-database-lifecycle-v1"
            local cutover_marker="$APP_ROOT/deploy/backend/.reporting-database-cutover-v1"
            local tracked_blob actual_blob

            [[ "$expected_revision" =~ ^[0-9a-f]{40}$ &&
              "$guard_action" =~ ^--guard-before-(fetch|checkout)-revision$ ]] || return 1
            tracked_blob="$(
              git rev-parse --verify "HEAD:$lifecycle_script" 2>/dev/null ||
                true
            )"
            if [[ -e "$lifecycle_script" || -L "$lifecycle_script" ]]; then
              [[ -f "$lifecycle_script" && ! -L "$lifecycle_script" ]] || return 1
              actual_blob="$(git hash-object "$lifecycle_script")"
              [[ -n "$tracked_blob" && "$actual_blob" == "$tracked_blob" ]] || return 1
              APP_ROOT="$APP_ROOT" \
                bash "$lifecycle_script" \
                  "$guard_action" "$expected_revision"
              return
            fi
            [[ -z "$tracked_blob" ]] || return 1
            [[ ! -e "$staged_marker" && ! -L "$staged_marker" &&
              ! -e "$database_marker" && ! -L "$database_marker" &&
              ! -e "$cutover_marker" && ! -L "$cutover_marker" ]]
          }

          current_revision="$(git rev-parse HEAD)"
          [[ "$AUTOMATIC_PROD_PUSH" =~ ^(true|false)$ ]] || exit 1
          guard_campaigns_checkout_before_pull "$current_revision"
          guard_reporting_checkout_before_pull "$current_revision"
          guard_campaigns_checkout_before_pull "$EXPECTED_REVISION"
          if [[ "$AUTOMATIC_PROD_PUSH" != "true" ||
            "$current_revision" == "$EXPECTED_REVISION" ]]; then
            guard_reporting_checkout_before_pull "$EXPECTED_REVISION"
          else
            echo "Automatic push will verify before the deploy job evaluates the active Reporting revision guard."
          fi
          echo "Active lifecycle checkout preflight passed without changing VPS state."
          EOF

  verify:
    needs: lifecycle_checkout_preflight
    if: >-
      ${{
        !cancelled() &&
        needs.lifecycle_checkout_preflight.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_DB: winwidget_ci
          POSTGRES_USER: winwidget
          POSTGRES_PASSWORD: winwidget_ci
          POSTGRES_INITDB_ARGS: --locale=C.UTF-8 --encoding=UTF8 --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U winwidget -d winwidget_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4.2-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: winwidget
          RABBITMQ_DEFAULT_PASS: winwidget_ci
          RABBITMQ_DEFAULT_VHOST: winwidget
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_REVISION: ${{ github.sha }}
      APP_VERSION: git-${{ github.sha }}
      MAINTENANCE_REVISION: ${{ github.sha }}
      MAINTENANCE_IMAGE: winwidget-maintenance:git-${{ github.sha }}
      DATABASE_RESTORE_REVISION: ${{ github.sha }}
      DATABASE_RESTORE_IMAGE: winwidget-database-restore:git-${{ github.sha }}
      NOTIFICATION_DELIVERY_REVISION: ${{ github.sha }}
      NOTIFICATION_DELIVERY_IMAGE: winwidget-notification-delivery:git-${{ github.sha }}
      CAMPAIGNS_REVISION: ${{ github.sha }}
      CAMPAIGNS_IMAGE: winwidget-campaigns:git-${{ github.sha }}
      REPORTING_REVISION: ${{ github.sha }}
      REPORTING_IMAGE: winwidget-reporting:git-${{ github.sha }}
      # CI-only 32-byte key. Production uses deploy/backend/.env.production.
      PAYMENT_METHOD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DATABASE_URL: postgresql://winwidget:winwidget_ci@127.0.0.1:5432/winwidget_ci?schema=public
      DATABASE_URL_DEVELOPMENT: postgresql://winwidget:winwidget_ci@127.0.0.1:5432/winwidget_ci?schema=public
      NOTIFICATION_DELIVERY_DATABASE_URL: postgresql://winwidget_notification_delivery_runtime:winwidget_notification_delivery_runtime_ci@127.0.0.1:55432/winwidget_notification_delivery_ci?schema=notification_delivery&sslmode=disable
      NOTIFICATION_DELIVERY_CI_MIGRATION_DATABASE_URL: postgresql://winwidget_notification_delivery_migration:winwidget_notification_delivery_migration_ci@127.0.0.1:55432/winwidget_notification_delivery_ci?schema=notification_delivery&sslmode=disable
      NOTIFICATION_DELIVERY_BACKUP_URL: postgresql://winwidget_notification_delivery_backup:winwidget_notification_delivery_backup_ci@127.0.0.1:55432/winwidget_notification_delivery_ci?schema=notification_delivery&sslmode=disable
      NOTIFICATION_DELIVERY_CI_POSTGRES_CONTAINER: winwidget-notification-delivery-postgres-ci-${{ github.run_id }}-${{ github.run_attempt }}
      NOTIFICATION_DELIVERY_CI_POSTGRES_VOLUME: winwidget-notification-delivery-postgres-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CAMPAIGNS_DATABASE_URL: postgresql://winwidget_campaigns_runtime:campaigns_runtime_ci@127.0.0.1:55433/winwidget_campaigns_ci?schema=campaigns&sslmode=disable
      CAMPAIGNS_CI_MIGRATION_DATABASE_URL: postgresql://winwidget_campaigns_migration:campaigns_migration_ci@127.0.0.1:55433/winwidget_campaigns_ci?schema=campaigns&sslmode=disable
      CAMPAIGNS_BACKUP_URL: postgresql://winwidget_campaigns_backup:campaigns_backup_ci@127.0.0.1:55433/winwidget_campaigns_ci?schema=campaigns&sslmode=disable
      CAMPAIGNS_CI_POSTGRES_CONTAINER: winwidget-campaigns-postgres-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CAMPAIGNS_CI_POSTGRES_VOLUME: winwidget-campaigns-postgres-ci-${{ github.run_id }}-${{ github.run_attempt }}
      REPORTING_DATABASE_URL: postgresql://winwidget_reporting_runtime:reporting_runtime_ci@127.0.0.1:55435/winwidget_reporting_ci?schema=reporting&sslmode=disable
      REPORTING_CI_MIGRATION_DATABASE_URL: postgresql://winwidget_reporting_migration:reporting_migration_ci@127.0.0.1:55435/winwidget_reporting_ci?schema=reporting&sslmode=disable
      REPORTING_BACKUP_URL: postgresql://winwidget_reporting_backup:reporting_backup_ci@127.0.0.1:55435/winwidget_reporting_ci?schema=reporting&sslmode=disable
      REPORTING_CI_POSTGRES_CONTAINER: winwidget-reporting-postgres-ci-${{ github.run_id }}-${{ github.run_attempt }}
      REPORTING_CI_POSTGRES_VOLUME: winwidget-reporting-postgres-ci-${{ github.run_id }}-${{ github.run_attempt }}
      REPORTING_PROCESS_ROLE: all
      REPORTING_LISTEN_HOST: 127.0.0.1
      REPORTING_PORT: 4600
      REPORTING_CORE_INTERNAL_BASE_URL: http://127.0.0.1:4200
      REPORTING_INTERNAL_TOKEN: ci_reporting_internal_token_at_least_32_chars
      REPORTING_INTERNAL_TIMEOUT_MS: 5000
      REPORTING_SCHEDULER_ENABLED: 'false'
      REPORTING_PREFETCH: 10
      CAMPAIGNS_PROCESS_ROLE: all
      CAMPAIGNS_LISTEN_HOST: 127.0.0.1
      CAMPAIGNS_HEALTH_PORT: 4500
      CAMPAIGNS_CORE_INTERNAL_BASE_URL: http://127.0.0.1:4200
      CAMPAIGNS_INTERNAL_TIMEOUT_MS: 5000
      CAMPAIGNS_AUDIENCE_EXPORT_CHUNK_SIZE: 500
      CAMPAIGNS_AUDIENCE_EXPORT_TIMEOUT_MS: 300000
      CAMPAIGNS_AUDIENCE_IMPORT_BATCH_SIZE: 1000
      NOTIFICATION_DELIVERY_INTERNAL_URL: http://127.0.0.1:4401/internal/notification-delivery
      NOTIFICATION_DELIVERY_INTERNAL_TOKEN: ci_notification_delivery_internal_token_at_least_32_chars
      NOTIFICATION_DELIVERY_INTERNAL_TIMEOUT_MS: 5000
      NOTIFICATION_DELIVERY_LISTEN_HOST: 127.0.0.1
      NOTIFICATION_DELIVERY_HEALTH_PORT: 4401
      NOTIFICATION_DELIVERY_PREFETCH: 5
      NOTIFICATION_DELIVERY_KINDS: email,telegram,payment-email,payment-telegram,limit-email,limit-telegram,campaign-email,campaign-telegram,daily-summary-delivery-telegram,subscription-expiry-email,subscription-expiry-telegram
      NOTIFICATION_DELIVERY_TEST_RABBITMQ_URL: amqp://notification_delivery_ci:notification_delivery_ci_password@127.0.0.1:5672/winwidget
      RABBITMQ_URL: amqp://winwidget:winwidget_ci@127.0.0.1:5672/winwidget
      RABBITMQ_MANAGEMENT_URL: http://127.0.0.1:15672
      RABBITMQ_USER: winwidget
      RABBITMQ_PASSWORD: winwidget_ci
      RABBITMQ_MONITOR_USER: winwidget
      RABBITMQ_MONITOR_PASSWORD: winwidget_ci
      RABBITMQ_VHOST: winwidget

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate CI-only Campaigns internal token
        run: |
          campaigns_internal_token="$(openssl rand -hex 32)"
          echo "::add-mask::$campaigns_internal_token"
          printf 'CAMPAIGNS_INTERNAL_TOKEN=%s\n' \
            "$campaigns_internal_token" >> "$GITHUB_ENV"

      - name: Generate CI-only Reporting internal token
        run: |
          reporting_internal_token="$(openssl rand -hex 32)"
          echo "::add-mask::$reporting_internal_token"
          printf 'REPORTING_INTERNAL_TOKEN=%s\n' \
            "$reporting_internal_token" >> "$GITHUB_ENV"

      - name: Fast-check Campaigns production recovery
        run: |
          for script in \
            scripts/production-deploy-lock.sh \
            scripts/core-database-production-guard.sh \
            scripts/campaigns-database-lifecycle.sh \
            scripts/cutover-campaigns-database-production.sh \
            scripts/restart-campaigns-database-cutover-production.sh \
            scripts/test-campaigns-cutover-rehearsal.sh \
            scripts/audit-legacy-telegram-channels-production.sh; do
            bash -n "$script"
          done
          bash scripts/restart-campaigns-database-cutover-production.sh \
            --self-test
          bash scripts/audit-legacy-telegram-channels-production.sh --self-test
          docker run --rm \
            --network none \
            --read-only \
            --security-opt no-new-privileges \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
          docker run --rm \
            --network none \
            --read-only \
            --security-opt no-new-privileges \
            --entrypoint shellcheck \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            koalaman/shellcheck-alpine@sha256:5921d946dac740cbeec2fb1c898747b6105e585130cc7f0602eec9a10f7ddb63 \
            --severity=warning \
            scripts/production-deploy-lock.sh \
            scripts/core-database-production-guard.sh \
            scripts/campaigns-database-lifecycle.sh \
            scripts/cutover-campaigns-database-production.sh \
            scripts/restart-campaigns-database-cutover-production.sh \
            scripts/test-campaigns-cutover-rehearsal.sh \
            scripts/audit-legacy-telegram-channels-production.sh

      - name: Fast-check Reporting phase-A production scripts
        run: |
          reporting_ci_app_root="$(cd "$GITHUB_WORKSPACE/.." && pwd -P)"
          [[ "$reporting_ci_app_root/winwidget.ru_server" == "$GITHUB_WORKSPACE" ]]
          for script in \
            scripts/reporting-database-lifecycle.sh \
            scripts/deploy-reporting-production.sh \
            scripts/reporting-producer-lifecycle.sh \
            scripts/reporting-cutover-lifecycle.sh \
            scripts/generate-reporting-frontend-runtime-attestation.sh \
            scripts/run-reporting-scheduler-cutover-smoke.sh \
            scripts/run-reporting-route-cutover-smoke.sh \
            scripts/run-reporting-restore-cutover-smoke.sh \
            scripts/test-reporting-cutover-rehearsal.sh \
            scripts/test-reporting-production-scripts.sh; do
            bash -n "$script"
          done
          bash scripts/test-reporting-cutover-rehearsal.sh --self-test
          bash scripts/generate-reporting-frontend-runtime-attestation.sh --self-test
          APP_ROOT="$reporting_ci_app_root" \
            bash scripts/run-reporting-scheduler-cutover-smoke.sh --self-test
          APP_ROOT="$reporting_ci_app_root" \
            bash scripts/run-reporting-route-cutover-smoke.sh --self-test
          APP_ROOT="$reporting_ci_app_root" \
            bash scripts/run-reporting-restore-cutover-smoke.sh --self-test
          bash scripts/test-reporting-production-scripts.sh
          for script in \
            scripts/reporting-database-lifecycle.sh \
            scripts/deploy-reporting-production.sh \
            scripts/reporting-producer-lifecycle.sh \
            scripts/reporting-cutover-lifecycle.sh \
            scripts/generate-reporting-frontend-runtime-attestation.sh \
            scripts/run-reporting-scheduler-cutover-smoke.sh \
            scripts/run-reporting-route-cutover-smoke.sh \
            scripts/run-reporting-restore-cutover-smoke.sh \
            scripts/test-reporting-cutover-rehearsal.sh \
            scripts/test-reporting-production-scripts.sh; do
            printf 'reporting_shellcheck_start=%s\n' "$script"
            docker run --rm \
              --network none \
              --read-only \
              --security-opt no-new-privileges \
              --entrypoint shellcheck \
              --volume "$GITHUB_WORKSPACE:/repo:ro" \
              --workdir /repo \
              koalaman/shellcheck-alpine@sha256:5921d946dac740cbeec2fb1c898747b6105e585130cc7f0602eec9a10f7ddb63 \
              --severity=warning \
              "$script"
            printf 'reporting_shellcheck_passed=%s\n' "$script"
          done

      - name: Fast-check database restore worker rehearsal
        run: |
          bash -n scripts/database-restore-control.sh
          bash -n scripts/database-restore-production-guard.sh
          bash -n scripts/test-database-restore-worker-rehearsal.sh
          bash scripts/database-restore-control.sh --self-test
          bash scripts/database-restore-production-guard.sh --self-test
          bash scripts/test-database-restore-worker-rehearsal.sh --self-test
          docker run --rm \
            --network none \
            --read-only \
            --security-opt no-new-privileges \
            --entrypoint shellcheck \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            koalaman/shellcheck-alpine@sha256:5921d946dac740cbeec2fb1c898747b6105e585130cc7f0602eec9a10f7ddb63 \
            --severity=warning \
            scripts/database-restore-control.sh \
            scripts/database-restore-production-guard.sh \
            scripts/test-database-restore-worker-rehearsal.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/api-gateway/pnpm-lock.yaml
            apps/notification-delivery/pnpm-lock.yaml
            apps/campaigns/pnpm-lock.yaml
            apps/reporting/pnpm-lock.yaml

      - name: Install dependencies
        env:
          HUSKY: 0
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/api-gateway install --frozen-lockfile
          pnpm --dir apps/notification-delivery install --frozen-lockfile
          pnpm --dir apps/campaigns install --frozen-lockfile
          pnpm --dir apps/reporting install --frozen-lockfile

      - name: Start isolated Notification Delivery PostgreSQL
        env:
          NOTIFICATION_DELIVERY_CI_POSTGRES_PASSWORD_FILE: ${{ runner.temp }}/winwidget-notification-delivery-postgres-admin-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test ! -e "$NOTIFICATION_DELIVERY_CI_POSTGRES_PASSWORD_FILE"
          umask 077
          openssl rand -hex 32 > "$NOTIFICATION_DELIVERY_CI_POSTGRES_PASSWORD_FILE"

          docker volume create \
            --label com.winwidget.owner=notification-delivery \
            --label com.winwidget.purpose=ci-postgres-data \
            --label "com.winwidget.github-run=$GITHUB_RUN_ID" \
            "$NOTIFICATION_DELIVERY_CI_POSTGRES_VOLUME" > /dev/null

          docker run --detach \
            --name "$NOTIFICATION_DELIVERY_CI_POSTGRES_CONTAINER" \
            --label com.winwidget.owner=notification-delivery \
            --label com.winwidget.purpose=ci-postgres \
            --label "com.winwidget.github-run=$GITHUB_RUN_ID" \
            --publish 127.0.0.1:55432:5432 \
            --mount \
              "type=volume,source=$NOTIFICATION_DELIVERY_CI_POSTGRES_VOLUME,target=/var/lib/postgresql" \
            --mount \
              "type=bind,source=$NOTIFICATION_DELIVERY_CI_POSTGRES_PASSWORD_FILE,target=/run/secrets/notification-delivery-postgres-admin-password,readonly" \
            --env POSTGRES_DB=winwidget_notification_delivery_ci \
            --env POSTGRES_USER=winwidget_notification_delivery_admin \
            --env POSTGRES_PASSWORD_FILE=/run/secrets/notification-delivery-postgres-admin-password \
            --env "POSTGRES_INITDB_ARGS=--locale=C.UTF-8 --encoding=UTF8 --auth-host=scram-sha-256 --data-checksums" \
            --env PGDATA=/var/lib/postgresql/18/docker \
            --health-cmd \
              "pg_isready --username winwidget_notification_delivery_admin --dbname winwidget_notification_delivery_ci" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 20 \
            postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296 > /dev/null

          for attempt in $(seq 1 30); do
            status="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' \
                "$NOTIFICATION_DELIVERY_CI_POSTGRES_CONTAINER"
            )"
            if [[ "$status" == "healthy" ]]; then
              break
            fi
            if [[ "$status" == "unhealthy" || "$attempt" == "30" ]]; then
              docker logs "$NOTIFICATION_DELIVERY_CI_POSTGRES_CONTAINER" >&2
              echo "Isolated Notification Delivery PostgreSQL is $status." >&2
              exit 1
            fi
            sleep 2
          done

      - name: Create isolated Notification Delivery roles
        env:
          POSTGRES_CONTAINER_ID: ${{ env.NOTIFICATION_DELIVERY_CI_POSTGRES_CONTAINER }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 \
              --username winwidget_notification_delivery_admin \
              --dbname winwidget_notification_delivery_ci <<'SQL'
          REVOKE ALL
            ON DATABASE winwidget_notification_delivery_ci
            FROM PUBLIC;

          CREATE ROLE winwidget_notification_delivery_migration
            LOGIN
            PASSWORD 'winwidget_notification_delivery_migration_ci'
            NOSUPERUSER
            NOCREATEDB
            NOCREATEROLE
            NOREPLICATION;
          CREATE ROLE winwidget_notification_delivery_runtime
            LOGIN
            PASSWORD 'winwidget_notification_delivery_runtime_ci'
            NOSUPERUSER
            NOCREATEDB
            NOCREATEROLE
            NOREPLICATION;
          CREATE ROLE winwidget_notification_delivery_backup
            LOGIN
            PASSWORD 'winwidget_notification_delivery_backup_ci'
            NOSUPERUSER
            NOCREATEDB
            NOCREATEROLE
            NOREPLICATION;

          GRANT CONNECT ON DATABASE winwidget_notification_delivery_ci
            TO winwidget_notification_delivery_migration;
          GRANT CONNECT ON DATABASE winwidget_notification_delivery_ci
            TO winwidget_notification_delivery_runtime;
          GRANT CONNECT ON DATABASE winwidget_notification_delivery_ci
            TO winwidget_notification_delivery_backup;

          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          CREATE SCHEMA notification_delivery
            AUTHORIZATION winwidget_notification_delivery_migration;
          REVOKE ALL ON SCHEMA notification_delivery FROM PUBLIC;
          GRANT USAGE ON SCHEMA notification_delivery
            TO winwidget_notification_delivery_runtime;
          GRANT USAGE ON SCHEMA notification_delivery
            TO winwidget_notification_delivery_backup;

          ALTER DEFAULT PRIVILEGES
            FOR ROLE winwidget_notification_delivery_migration
            IN SCHEMA notification_delivery
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES
            TO winwidget_notification_delivery_runtime;
          ALTER DEFAULT PRIVILEGES
            FOR ROLE winwidget_notification_delivery_migration
            IN SCHEMA notification_delivery
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES
            TO winwidget_notification_delivery_runtime;
          ALTER DEFAULT PRIVILEGES
