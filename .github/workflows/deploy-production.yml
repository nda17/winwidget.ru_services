      - name: Validate production compose
        env:
          NOTIFICATION_DELIVERY_POSTGRES_IMAGE: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
          NOTIFICATION_DELIVERY_POSTGRES_PORT: '55432'
          NOTIFICATION_DELIVERY_POSTGRES_DATA_VOLUME: winwidget-notification-delivery-postgres-data
          NOTIFICATION_DELIVERY_POSTGRES_ADMIN_USER: winwidget_notification_delivery_admin
          NOTIFICATION_DELIVERY_POSTGRES_ADMIN_PASSWORD_FILE: /tmp/winwidget-notification-delivery-postgres-admin-password
          NOTIFICATION_DELIVERY_DATABASE_URL: postgresql://notification_delivery_runtime:notification_delivery_runtime_ci@127.0.0.1:55432/winwidget_notification_delivery?schema=notification_delivery&sslmode=disable
          NOTIFICATION_DELIVERY_MIGRATION_URL_PRODUCTION: postgresql://notification_delivery_migration:notification_delivery_migration_ci@127.0.0.1:55432/winwidget_notification_delivery?schema=notification_delivery&sslmode=disable
          NOTIFICATION_DELIVERY_BACKUP_URL: postgresql://notification_delivery_backup:notification_delivery_backup_ci@127.0.0.1:55432/winwidget_notification_delivery?schema=notification_delivery&sslmode=disable
          CAMPAIGNS_POSTGRES_IMAGE: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
          CAMPAIGNS_POSTGRES_PORT: '55433'
          CAMPAIGNS_POSTGRES_DATA_VOLUME: winwidget-campaigns-postgres-data
          CAMPAIGNS_POSTGRES_ADMIN_USER: winwidget_campaigns_admin
          CAMPAIGNS_POSTGRES_ADMIN_PASSWORD_FILE: /tmp/winwidget-campaigns-postgres-admin-password
          CAMPAIGNS_DATABASE_URL: postgresql://winwidget_campaigns_runtime:campaigns_runtime_ci@127.0.0.1:55433/winwidget_campaigns?schema=campaigns&sslmode=disable
          CAMPAIGNS_MIGRATION_DATABASE_URL: postgresql://winwidget_campaigns_migration:campaigns_migration_ci@127.0.0.1:55433/winwidget_campaigns?schema=campaigns&sslmode=disable
          CAMPAIGNS_BACKUP_URL: postgresql://winwidget_campaigns_backup:campaigns_backup_ci@127.0.0.1:55433/winwidget_campaigns?schema=campaigns&sslmode=disable
        run: |
          docker compose --profile migration --profile notification-delivery-migration --profile notification-delivery-database --profile campaigns-migration --profile campaigns-database --env-file .env.example -f deploy/docker-compose.prod.yml config --quiet
          # shellcheck disable=SC2016
          docker compose --profile migration --profile notification-delivery-migration --profile notification-delivery-database --profile campaigns-migration --profile campaigns-database --env-file .env.example -f deploy/docker-compose.prod.yml config --format json |
            node -e '
