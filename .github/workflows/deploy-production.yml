      - name: Finalize and verify Reporting database roles
        env:
          MONOLITH_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          POSTGRES_CONTAINER_ID: ${{ env.REPORTING_CI_POSTGRES_CONTAINER }}
        run: |
          test "$POSTGRES_CONTAINER_ID" != "$MONOLITH_POSTGRES_CONTAINER_ID"
          docker exec -i "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 \
              --username winwidget_reporting_admin \
              --dbname winwidget_reporting_ci <<'SQL'
          REVOKE ALL ON ALL TABLES IN SCHEMA reporting
            FROM PUBLIC, winwidget_reporting_runtime, winwidget_reporting_backup;
          REVOKE ALL ON ALL SEQUENCES IN SCHEMA reporting
            FROM PUBLIC, winwidget_reporting_runtime, winwidget_reporting_backup;
          REVOKE ALL ON ALL FUNCTIONS IN SCHEMA reporting
            FROM PUBLIC, winwidget_reporting_runtime, winwidget_reporting_backup;
          GRANT SELECT, INSERT, UPDATE, DELETE
            ON ALL TABLES IN SCHEMA reporting
            TO winwidget_reporting_runtime;
          GRANT USAGE, SELECT, UPDATE
            ON ALL SEQUENCES IN SCHEMA reporting
            TO winwidget_reporting_runtime;
          GRANT SELECT
            ON ALL TABLES IN SCHEMA reporting
            TO winwidget_reporting_backup;
          GRANT SELECT
            ON ALL SEQUENCES IN SCHEMA reporting
            TO winwidget_reporting_backup;
          REVOKE ALL ON TABLE reporting._prisma_migrations
            FROM winwidget_reporting_runtime;
          REVOKE CREATE ON DATABASE winwidget_reporting_ci
            FROM winwidget_reporting_migration;
          REVOKE CREATE ON DATABASE winwidget_reporting_ci
            FROM winwidget_reporting_runtime;
          REVOKE CREATE ON DATABASE winwidget_reporting_ci
            FROM winwidget_reporting_backup;

          ALTER DEFAULT PRIVILEGES
            FOR ROLE winwidget_reporting_migration IN SCHEMA reporting
            REVOKE ALL ON TABLES
            FROM PUBLIC, winwidget_reporting_runtime, winwidget_reporting_backup;
          ALTER DEFAULT PRIVILEGES
            FOR ROLE winwidget_reporting_migration IN SCHEMA reporting
            REVOKE ALL ON SEQUENCES
            FROM PUBLIC, winwidget_reporting_runtime, winwidget_reporting_backup;
          ALTER DEFAULT PRIVILEGES
            FOR ROLE winwidget_reporting_migration IN SCHEMA reporting
            REVOKE ALL ON FUNCTIONS
            FROM PUBLIC, winwidget_reporting_runtime, winwidget_reporting_backup;
          ALTER DEFAULT PRIVILEGES
            FOR ROLE winwidget_reporting_migration
            REVOKE ALL ON FUNCTIONS
            FROM PUBLIC, winwidget_reporting_runtime, winwidget_reporting_backup;
          ALTER DEFAULT PRIVILEGES
            FOR ROLE winwidget_reporting_migration IN SCHEMA reporting
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES
            TO winwidget_reporting_runtime;
          ALTER DEFAULT PRIVILEGES
            FOR ROLE winwidget_reporting_migration IN SCHEMA reporting
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES
            TO winwidget_reporting_runtime;
          ALTER DEFAULT PRIVILEGES
            FOR ROLE winwidget_reporting_migration IN SCHEMA reporting
            GRANT SELECT ON TABLES TO winwidget_reporting_backup;
          ALTER DEFAULT PRIVILEGES
            FOR ROLE winwidget_reporting_migration IN SCHEMA reporting
            GRANT SELECT ON SEQUENCES TO winwidget_reporting_backup;

          DO $$
          DECLARE
            table_name text;
          BEGIN
            FOR table_name IN
              SELECT tablename
              FROM pg_tables
              WHERE schemaname = 'reporting'
                AND tablename <> '_prisma_migrations'
            LOOP
              IF NOT has_table_privilege(
                'winwidget_reporting_runtime',
                format('reporting.%I', table_name),
                'SELECT,INSERT,UPDATE,DELETE'
              ) THEN
                RAISE EXCEPTION 'runtime ACL missing for %', table_name;
              END IF;
              IF NOT has_table_privilege(
                'winwidget_reporting_backup',
                format('reporting.%I', table_name),
                'SELECT'
              ) THEN
                RAISE EXCEPTION 'backup ACL missing for %', table_name;
              END IF;
            END LOOP;
            IF has_table_privilege(
              'winwidget_reporting_runtime',
              'reporting._prisma_migrations',
              'SELECT'
            ) THEN
              RAISE EXCEPTION '_prisma_migrations leaked to runtime';
            END IF;
            IF NOT EXISTS (
              SELECT 1
              FROM pg_default_acl defaults
              CROSS JOIN LATERAL aclexplode(defaults.defaclacl) privilege
              WHERE defaults.defaclrole = 'winwidget_reporting_migration'::regrole
                AND defaults.defaclnamespace = 0
                AND defaults.defaclobjtype = 'f'
              GROUP BY defaults.oid
              HAVING count(*) = 1
                AND bool_and(
                  privilege.grantor = 'winwidget_reporting_migration'::regrole
                  AND privilege.grantee = 'winwidget_reporting_migration'::regrole
                  AND privilege.privilege_type = 'EXECUTE'
                  AND NOT privilege.is_grantable
                )
            ) THEN
              RAISE EXCEPTION 'global function default ACL is unsafe';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM pg_proc routine
              JOIN pg_namespace namespace_state
                ON namespace_state.oid = routine.pronamespace
              CROSS JOIN LATERAL aclexplode(
                COALESCE(routine.proacl, acldefault('f', routine.proowner))
              ) privilege
              WHERE namespace_state.nspname = 'reporting'
                AND privilege.grantee <> routine.proowner
            ) THEN
              RAISE EXCEPTION 'Reporting function ACL is unsafe';
            END IF;
          END $$;
          SQL

          docker exec -i \
            -e PGPASSWORD=reporting_migration_ci \
            "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 \
              --host 127.0.0.1 \
              --username winwidget_reporting_migration \
              --dbname winwidget_reporting_ci <<'SQL'
          BEGIN;
          CREATE FUNCTION reporting.deployment_acl_function_smoke()
          RETURNS INTEGER LANGUAGE SQL AS 'SELECT 1';
          DO $$
          BEGIN
            IF EXISTS (
              SELECT 1
              FROM pg_proc routine
              CROSS JOIN LATERAL aclexplode(
                COALESCE(routine.proacl, acldefault('f', routine.proowner))
              ) privilege
              WHERE routine.oid = 'reporting.deployment_acl_function_smoke()'::regprocedure
                AND privilege.grantee <> routine.proowner
            ) THEN
              RAISE EXCEPTION 'future Reporting function ACL is unsafe';
            END IF;
          END $$;
          ROLLBACK;
          SQL

          docker exec \
            -e PGPASSWORD=reporting_runtime_ci \
            "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 \
              --host 127.0.0.1 \
              --username winwidget_reporting_runtime \
              --dbname winwidget_reporting_ci \
              --command 'SELECT count(*) FROM reporting.reporting_settings;' > /dev/null
          if docker exec \
            -e PGPASSWORD=reporting_runtime_ci \
            "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 \
              --host 127.0.0.1 \
              --username winwidget_reporting_runtime \
              --dbname winwidget_reporting_ci \
              --command 'SELECT count(*) FROM reporting._prisma_migrations;' \
              > /dev/null 2>&1; then
            echo "Reporting runtime can read _prisma_migrations." >&2
            exit 1
          fi
          docker exec \
            -e PGPASSWORD=reporting_backup_ci \
            "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 \
              --host 127.0.0.1 \
              --username winwidget_reporting_backup \
              --dbname winwidget_reporting_ci \
              --command 'SELECT count(*) FROM reporting.reporting_settings;' > /dev/null
          if docker exec \
            -e PGPASSWORD=reporting_backup_ci \
            "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 \
              --host 127.0.0.1 \
              --username winwidget_reporting_backup \
              --dbname winwidget_reporting_ci \
              --command \
                "INSERT INTO reporting.heartbeats (id, role, instance_id, metadata, last_seen_at, created_at, updated_at) VALUES ('00000000-0000-4000-8000-000000000099', 'all', 'ci-backup-write-must-fail', '{}'::jsonb, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP);" \
              > /dev/null 2>&1; then
            echo "Reporting backup role can mutate Reporting data." >&2
            exit 1
          fi

      - name: Verify Notification Delivery PostgreSQL persistence and restore
        env:
          NOTIFICATION_DELIVERY_CI_POSTGRES_PASSWORD_FILE: ${{ runner.temp }}/winwidget-notification-delivery-postgres-admin-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_CONTAINER_ID: ${{ env.NOTIFICATION_DELIVERY_CI_POSTGRES_CONTAINER }}
        run: |
          sentinel_id=00000000-0000-4000-8000-000000000001
          source_dump="$RUNNER_TEMP/notification-delivery-ci.dump"
          source_manifest="$RUNNER_TEMP/notification-delivery-source.manifest"
          restore_manifest="$RUNNER_TEMP/notification-delivery-restore.manifest"

          docker exec -i \
            --env PGPASSWORD=winwidget_notification_delivery_runtime_ci \
            "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 \
              --host 127.0.0.1 \
              --username winwidget_notification_delivery_runtime \
              --dbname winwidget_notification_delivery_ci <<SQL
          INSERT INTO notification_delivery.heartbeats (
            id,
            service,
            instance_id,
            metadata,
            updated_at
          ) VALUES (
            '$sentinel_id',
            'ci-persistence-probe',
            'ci-persistence-probe',
            '{"persisted":true}'::jsonb,
            CURRENT_TIMESTAMP
          );
          SELECT setval(
            'notification_delivery.ci_runtime_sequence',
            4242,
            true
          );
          SQL

          system_identifier="$(
            docker exec "$POSTGRES_CONTAINER_ID" \
              psql --tuples-only --no-align \
                --username winwidget_notification_delivery_admin \
                --dbname postgres \
                --command "SELECT system_identifier FROM pg_control_system()"
          )"
          test -n "$system_identifier"

          docker rm --force "$POSTGRES_CONTAINER_ID" > /dev/null
          docker run --detach \
            --name "$POSTGRES_CONTAINER_ID" \
            --label com.winwidget.owner=notification-delivery \
            --label com.winwidget.purpose=ci-postgres \
            --label "com.winwidget.github-run=$GITHUB_RUN_ID" \
            --publish 127.0.0.1:55432:5432 \
            --mount \
              "type=volume,source=$NOTIFICATION_DELIVERY_CI_POSTGRES_VOLUME,target=/var/lib/postgresql" \
            --mount \
              "type=bind,source=$NOTIFICATION_DELIVERY_CI_POSTGRES_PASSWORD_FILE,target=/run/secrets/notification-delivery-postgres-admin-password,readonly" \
            --env POSTGRES_DB=winwidget_notification_delivery_ci \
            --env POSTGRES_USER=winwidget_notification_delivery_admin \
            --env POSTGRES_PASSWORD_FILE=/run/secrets/notification-delivery-postgres-admin-password \
            --env "POSTGRES_INITDB_ARGS=--locale=C.UTF-8 --encoding=UTF8 --auth-host=scram-sha-256 --data-checksums" \
            --env PGDATA=/var/lib/postgresql/18/docker \
            --health-cmd \
              "pg_isready --username winwidget_notification_delivery_admin --dbname winwidget_notification_delivery_ci" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 20 \
            postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296 > /dev/null
          for attempt in $(seq 1 30); do
            health="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' \
                "$POSTGRES_CONTAINER_ID"
            )"
            if [[ "$health" == "healthy" ]]; then
              break
            fi
            if [[ "$health" == "unhealthy" || "$attempt" == "30" ]]; then
              docker logs "$POSTGRES_CONTAINER_ID" >&2
              echo "Notification Delivery PostgreSQL did not recover after restart." >&2
              exit 1
            fi
            sleep 2
          done

          test "$(
            docker exec "$POSTGRES_CONTAINER_ID" \
              psql --tuples-only --no-align \
                --username winwidget_notification_delivery_admin \
                --dbname postgres \
                --command "SELECT system_identifier FROM pg_control_system()"
          )" = "$system_identifier"
          test "$(
            docker inspect \
              --format '{{range .Mounts}}{{printf "%s|%s|%s|%t\n" .Destination .Type .Name .RW}}{{end}}' \
              "$POSTGRES_CONTAINER_ID" |
              awk -F'|' '$1 == "/var/lib/postgresql" || index($1, "/var/lib/postgresql/") == 1'
          )" = "/var/lib/postgresql|volume|$NOTIFICATION_DELIVERY_CI_POSTGRES_VOLUME|true"
          test "$(
            docker exec \
              --env PGPASSWORD=winwidget_notification_delivery_runtime_ci \
              "$POSTGRES_CONTAINER_ID" \
              psql --tuples-only --no-align \
                --host 127.0.0.1 \
                --username winwidget_notification_delivery_runtime \
                --dbname winwidget_notification_delivery_ci \
                --command "
                  SELECT count(*)
                  FROM notification_delivery.heartbeats
                  WHERE id = '$sentinel_id'
                    AND metadata = '{\"persisted\":true}'::jsonb;
                "
          )" = "1"

          docker exec \
            --env PGPASSWORD=winwidget_notification_delivery_backup_ci \
            "$POSTGRES_CONTAINER_ID" \
            pg_dump \
              --host 127.0.0.1 \
              --username winwidget_notification_delivery_backup \
              --dbname winwidget_notification_delivery_ci \
              --format custom \
              --no-owner \
              --no-privileges \
              --schema notification_delivery \
              --file /tmp/notification-delivery-ci.dump
          docker exec "$POSTGRES_CONTAINER_ID" \
            pg_restore --list /tmp/notification-delivery-ci.dump > /dev/null
          docker cp \
            "$POSTGRES_CONTAINER_ID:/tmp/notification-delivery-ci.dump" \
            "$source_dump"
          test -s "$source_dump"
          docker cp \
            "$source_dump" \
            "$POSTGRES_CONTAINER_ID:/tmp/notification-delivery-restore.dump"

          docker exec "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 \
              --username winwidget_notification_delivery_admin \
              --dbname postgres \
              --command "
                CREATE DATABASE winwidget_notification_delivery_restore_ci
                  WITH TEMPLATE template0;
              "
          docker exec "$POSTGRES_CONTAINER_ID" \
            pg_restore \
              --exit-on-error \
              --single-transaction \
              --no-owner \
              --no-privileges \
              --username winwidget_notification_delivery_admin \
              --dbname winwidget_notification_delivery_restore_ci \
              /tmp/notification-delivery-restore.dump

          build_manifest() {
            local database="$1"
            local output="$2"
            local tables
            local table

            tables="$(
              docker exec "$POSTGRES_CONTAINER_ID" \
                psql --tuples-only --no-align \
                  --username winwidget_notification_delivery_admin \
                  --dbname "$database" \
                  --command "
                    SELECT tablename
                    FROM pg_tables
                    WHERE schemaname = 'notification_delivery'
                    ORDER BY tablename;
                  "
            )"
            test -n "$tables"
            : > "$output"
            while IFS= read -r table; do
              [[ "$table" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]
              docker exec "$POSTGRES_CONTAINER_ID" \
                psql --tuples-only --no-align --field-separator '|' \
                  --username winwidget_notification_delivery_admin \
                  --dbname "$database" \
                  --command "
                    SELECT
                      '$table',
                      count(*),
                      md5(
                        COALESCE(
                          string_agg(
                            row_json,
                            E'\\n'
                            ORDER BY row_json COLLATE \"C\"
                          ),
                          ''
                        )
                      )
                    FROM (
                      SELECT to_jsonb(source_row)::text AS row_json
                      FROM notification_delivery.\"$table\" AS source_row
                    ) AS rows;
                  " >> "$output"
            done <<< "$tables"
            docker exec "$POSTGRES_CONTAINER_ID" \
              psql --tuples-only --no-align --field-separator '|' \
                --username winwidget_notification_delivery_admin \
                --dbname "$database" \
                --command "
                  SELECT
                    '@sequence',
                    sequencename,
                    COALESCE(last_value::text, 'NULL'),
                    start_value,
                    increment_by,
                    min_value,
                    max_value,
                    cache_size,
                    cycle
                  FROM pg_sequences
                  WHERE schemaname = 'notification_delivery'
                  ORDER BY sequencename;
                " >> "$output"
          }

          build_manifest winwidget_notification_delivery_ci "$source_manifest"
          build_manifest \
            winwidget_notification_delivery_restore_ci \
            "$restore_manifest"
          diff -u "$source_manifest" "$restore_manifest"
          grep -Eq '^_prisma_migrations\|[1-9][0-9]*\|' "$restore_manifest"
          grep -Eq '^heartbeats\|1\|' "$restore_manifest"
          grep -Eq '^@sequence\|ci_runtime_sequence\|4242\|' "$restore_manifest"

          docker exec "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 \
              --username winwidget_notification_delivery_admin \
              --dbname postgres \
              --command "
                DROP DATABASE winwidget_notification_delivery_restore_ci
                  WITH (FORCE);
              "

      - name: Verify Campaigns PostgreSQL persistence and restore
