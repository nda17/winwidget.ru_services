            const reportingPreFetchGuardIndex = job.lastIndexOf(
              'guard_reporting_checkout_before_pull "$expected_revision"',
            );
            const campaignsGuardIndex = job.lastIndexOf(
              'guard_campaigns_checkout_before_pull "$expected_revision"',
            );
            const fetchIndex = job.lastIndexOf("git fetch origin prod");
            const reportingPostFetchGuardIndex = job.lastIndexOf(
              '"$expected_revision" --guard-before-checkout-revision',
            );
            const checkoutIndex = job.lastIndexOf("git checkout prod");
            if (
              lockIndex < 0 ||
              reportingPreFetchGuardIndex < 0 ||
              campaignsGuardIndex < 0 ||
              fetchIndex < 0 ||
              reportingPostFetchGuardIndex < 0 ||
              checkoutIndex < 0 ||
              lockIndex >= reportingPreFetchGuardIndex ||
              lockIndex >= campaignsGuardIndex ||
              reportingPreFetchGuardIndex >= fetchIndex ||
              campaignsGuardIndex >= fetchIndex ||
              fetchIndex >= reportingPostFetchGuardIndex ||
              reportingPostFetchGuardIndex >= checkoutIndex
            ) {
