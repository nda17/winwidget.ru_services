name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Production deployment target
        required: true
        default: all
        type: choice
        options:
          - all
          - maintenance
          - notification-delivery
          - campaigns
          - reporting
          - widgets
          - billing
          - billing-cleanup
          - identity
          - identity-cleanup
      widgets_cutover_confirmation:
        description: Type CUTOVER WIDGETS OWNERSHIP for the first Widgets ownership cutover
        required: false
        default: ''
        type: string
      billing_action:
        description: Billing lifecycle action (manual billing target only)
        required: true
        default: status
        type: choice
        options:
          - status
          - export-env
          - prepare
          - cutover
          - abort
          - forward-recovery
      billing_confirmation:
        description: Type the exact Billing lifecycle or cleanup confirmation when required
        required: false
        default: ''
        type: string
      billing_cleanup_action:
        description: Billing Core source cleanup action (manual billing-cleanup target only)
        required: true
        default: status
        type: choice
        options:
          - status
          - retarget
          - stage
          - seal-offsite
          - run
          - complete-offsite
      identity_action:
        description: Identity lifecycle action (manual identity target only)
        required: true
        default: status
        type: choice
        options:
          - status
          - export-env
          - prepare
          - cutover
          - abort-prepare
          - forward-recovery
      identity_confirmation:
        description: Type the exact Identity lifecycle or cleanup confirmation when required
        required: false
        default: ''
        type: string
      identity_backend_env_expected_sha256:
        description: SHA-256 of the byte-identical local canonical backend production env
        required: false
        default: ''
        type: string
      identity_cleanup_action:
        description: Identity Core source cleanup action (manual identity-cleanup target only)
        required: true
        default: status
        type: choice
        options:
          - status
          - verify
          - run
          - forward-recovery
      identity_cleanup_migration_sha256:
        description: Reviewed SHA-256 of the exact post-stability Identity Core cleanup migration
        required: false
        default: ''
        type: string
  push:
    branches:
      - prod

permissions:
  contents: read

concurrency:
  group: deploy-production-server
  cancel-in-progress: false

jobs:
  lifecycle_checkout_preflight:
    name: Active lifecycle checkout preflight
    if: >-
      github.ref == 'refs/heads/prod' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      # CI-only fixture values. Production still comes exclusively from the
      # protected root-owned backend env on the VPS.
      PAYMENT_METHOD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      YOOKASSA_PRODUCTION_SHOP_ID: ci_billing_shop
      YOOKASSA_PRODUCTION_SECRET_KEY: ci_billing_secret_key_at_least_32_chars
      S3_ACCESS_KEY_ID: ci_widgets_s3_access_key
      S3_SECRET_ACCESS_KEY: ci_widgets_s3_secret_key_at_least_32_chars
      GOOGLE_CLIENT_ID: ci_identity_google_client_id
      GOOGLE_CLIENT_SECRET: ci_identity_google_client_secret
      GITHUB_CLIENT_ID: ci_identity_github_client_id
      GITHUB_CLIENT_SECRET: ci_identity_github_client_secret
      YANDEX_CLIENT_ID: ci_identity_yandex_client_id
      YANDEX_CLIENT_SECRET: ci_identity_yandex_client_secret
      TELEGRAM_INFO_BOT_TOKEN: ci_identity_info_bot_token
      TELEGRAM_INFO_BOT_USERNAME: ci_identity_info_bot
      TELEGRAM_INFO_BOT_WEBHOOK_SECRET: ci_identity_info_webhook_secret
      TELEGRAM_AUTH_BOT_TOKEN: ci_identity_auth_bot_token
      TELEGRAM_AUTH_BOT_USERNAME: ci_identity_auth_bot
      TELEGRAM_AUTH_BOT_WEBHOOK_SECRET: ci_identity_auth_webhook_secret
      SMSAERO_EMAIL: identity-ci@example.invalid
      SMSAERO_API_KEY: ci_identity_smsaero_api_key

    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@v6

      - name: Fast-check Widgets candidate and runner prerequisites
        run: |
          required_files=(
            apps/widgets/Dockerfile
            apps/billing/Dockerfile
            apps/billing/package.json
            apps/billing/pnpm-lock.yaml
            apps/billing/prisma/schema.prisma
            apps/billing/prisma/migrations/20260811000000_init_billing/migration.sql
            apps/identity/Dockerfile
            apps/identity/package.json
            apps/identity/pnpm-lock.yaml
            apps/identity/prisma/schema.prisma
            apps/identity/prisma/migrations/20260814000000_init_identity/migration.sql
            deploy/docker-compose.prod.yml
            deploy/nginx.conf
            scripts/widgets-database-lifecycle.sh
            scripts/deploy-widgets-production.sh
            scripts/widgets-cutover-production.sh
            scripts/test-widgets-cutover-rehearsal.sh
            scripts/cleanup-widgets-core-source-production.sh
            scripts/test-widgets-core-source-cleanup-rehearsal.sh
            scripts/export-widgets-cutover-snapshot.mjs
            scripts/billing-release-identity.sh
            scripts/billing-database-lifecycle.sh
            scripts/deploy-billing-production.sh
            scripts/billing-cutover-production.sh
            scripts/billing-backup-restore-rehearsal.sh
            scripts/cleanup-billing-core-source-production.sh
            scripts/test-billing-core-source-cleanup-rehearsal.sh
            scripts/test-billing-runtime-boundaries.mjs
            scripts/identity-release-identity.sh
            scripts/identity-production-env-control.sh
            scripts/identity-database-lifecycle.sh
            scripts/deploy-identity-production.sh
            scripts/identity-cutover-production.sh
            scripts/identity-backup-restore-rehearsal.sh
            scripts/cleanup-identity-core-source-production.sh
            src/billing-core-cutover-main.ts
            src/identity-core-cutover-main.ts
            apps/billing/src/cutover-main.ts
            prisma/migrations/20260811000000_prepare_billing_service_ownership/migration.sql
            prisma/migrations/20260810000000_remove_legacy_widgets_core_source/migration.sql
            prisma/migrations/20260813000000_remove_legacy_billing_core_source/migration.sql
            prisma/migrations/20260814020000_detach_identity_foreign_keys/migration.sql
          )
          for path in "${required_files[@]}"; do
            test -f "$path"
          done

          for script in \
            scripts/widgets-database-lifecycle.sh \
            scripts/deploy-widgets-production.sh \
            scripts/widgets-cutover-production.sh \
            scripts/test-widgets-cutover-rehearsal.sh \
            scripts/cleanup-widgets-core-source-production.sh \
            scripts/test-widgets-core-source-cleanup-rehearsal.sh \
            scripts/billing-release-identity.sh \
            scripts/billing-database-lifecycle.sh \
            scripts/deploy-billing-production.sh \
            scripts/billing-cutover-production.sh \
            scripts/billing-backup-restore-rehearsal.sh \
            scripts/cleanup-billing-core-source-production.sh \
            scripts/test-billing-core-source-cleanup-rehearsal.sh \
            scripts/identity-release-identity.sh \
            scripts/identity-production-env-control.sh \
            scripts/identity-database-lifecycle.sh \
            scripts/deploy-identity-production.sh \
            scripts/identity-cutover-production.sh \
            scripts/identity-backup-restore-rehearsal.sh \
            scripts/cleanup-identity-core-source-production.sh; do
            bash -n "$script"
          done
          node --check scripts/export-widgets-cutover-snapshot.mjs
          node --check scripts/test-billing-runtime-boundaries.mjs
          bash scripts/widgets-database-lifecycle.sh --self-test
          bash scripts/cleanup-widgets-core-source-production.sh --self-test
          bash scripts/test-widgets-cutover-rehearsal.sh --self-test
          bash scripts/test-widgets-core-source-cleanup-rehearsal.sh --self-test
          billing_ci_app_root="$(cd "$GITHUB_WORKSPACE/.." && pwd -P)"
          [[ "$billing_ci_app_root/winwidget.ru_server" == "$GITHUB_WORKSPACE" ]]
          APP_ROOT="$billing_ci_app_root" \
            bash scripts/billing-release-identity.sh --self-test
          APP_ROOT="$billing_ci_app_root" \
            bash scripts/billing-database-lifecycle.sh --self-test
          APP_ROOT="$billing_ci_app_root" \
            bash scripts/deploy-billing-production.sh --self-test
          APP_ROOT="$billing_ci_app_root" \
            bash scripts/billing-cutover-production.sh --self-test
          APP_ROOT="$billing_ci_app_root" \
            bash scripts/billing-backup-restore-rehearsal.sh --self-test
          APP_ROOT="$billing_ci_app_root" \
            bash scripts/cleanup-billing-core-source-production.sh --self-test
          APP_ROOT="$billing_ci_app_root" \
            bash scripts/test-billing-core-source-cleanup-rehearsal.sh --self-test
          node scripts/test-billing-runtime-boundaries.mjs --self-test
          APP_ROOT="$billing_ci_app_root" \
            bash scripts/identity-release-identity.sh --self-test
          APP_ROOT="$billing_ci_app_root" \
            bash scripts/identity-production-env-control.sh --self-test
          APP_ROOT="$billing_ci_app_root" \
            bash scripts/identity-database-lifecycle.sh --self-test
          APP_ROOT="$billing_ci_app_root" \
            bash scripts/deploy-identity-production.sh --self-test
          APP_ROOT="$billing_ci_app_root" \
            bash scripts/identity-cutover-production.sh --self-test
          APP_ROOT="$billing_ci_app_root" \
            bash scripts/identity-backup-restore-rehearsal.sh --self-test
          APP_ROOT="$billing_ci_app_root" \
            bash scripts/cleanup-identity-core-source-production.sh --self-test

          # ShellCheck runs separately below; its actionlint integration
          # deadlocks while piping this workflow's large inline scripts.
          docker run --rm \
            --network none \
            --read-only \
            --security-opt no-new-privileges \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -shellcheck=
          printf 'widgets_actionlint=passed\n'
          docker run --rm \
            --network none \
            --read-only \
            --security-opt no-new-privileges \
            --entrypoint shellcheck \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            koalaman/shellcheck-alpine@sha256:5921d946dac740cbeec2fb1c898747b6105e585130cc7f0602eec9a10f7ddb63 \
            --severity=warning \
            scripts/widgets-database-lifecycle.sh \
            scripts/deploy-widgets-production.sh \
            scripts/widgets-cutover-production.sh \
            scripts/test-widgets-cutover-rehearsal.sh \
            scripts/cleanup-widgets-core-source-production.sh \
            scripts/test-widgets-core-source-cleanup-rehearsal.sh \
            scripts/billing-release-identity.sh \
            scripts/billing-database-lifecycle.sh \
            scripts/deploy-billing-production.sh \
            scripts/billing-cutover-production.sh \
            scripts/billing-backup-restore-rehearsal.sh \
            scripts/cleanup-billing-core-source-production.sh \
            scripts/test-billing-core-source-cleanup-rehearsal.sh \
            scripts/identity-release-identity.sh \
            scripts/identity-production-env-control.sh \
            scripts/identity-database-lifecycle.sh \
            scripts/deploy-identity-production.sh \
            scripts/identity-cutover-production.sh \
            scripts/identity-backup-restore-rehearsal.sh \
            scripts/cleanup-identity-core-source-production.sh
          printf 'widgets_shellcheck=passed\n'

          require_compose_flag() {
            local command="$1" flag="$2"
            if ! docker compose "$command" --help | grep -F -- "$flag" > /dev/null; then
              printf 'Missing required Docker Compose flag: %s %s\n' \
                "$command" "$flag" >&2
              docker compose version >&2
              return 1
            fi
          }
          docker compose version
          if ! docker compose --help | grep -F -- '--profile' > /dev/null; then
            echo 'Missing required Docker Compose root flag: --profile' >&2
            docker compose version >&2
            exit 1
          fi
          require_compose_flag config --quiet
          require_compose_flag ps --status
          require_compose_flag run --no-deps
          require_compose_flag up --force-recreate
          require_compose_flag up --no-build
          printf 'widgets_compose_capabilities=passed\n'
          docker compose \
            --profile migration \
            --profile notification-delivery-migration \
            --profile notification-delivery-database \
            --profile campaigns-migration \
            --profile campaigns-database \
            --profile reporting-migration \
            --profile reporting-database \
            --profile widgets-migration \
            --profile widgets-database \
            --profile billing-migration \
            --profile billing-database \
            --profile identity-migration \
            --profile identity-database \
            --env-file .env.example \
            -f deploy/docker-compose.prod.yml config --quiet
          printf 'widgets_compose_config=passed\n'

          available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')"
          required_kib="$((10 * 1024 * 1024))"
          if ! [[ "$available_kib" =~ ^[0-9]+$ ]]; then
            echo 'Unable to determine preflight runner free disk space.' >&2
            exit 1
          fi
          if ((available_kib < required_kib)); then
            printf 'Insufficient preflight runner disk: available_kib=%s required_kib=%s\n' \
              "$available_kib" "$required_kib" >&2
            exit 1
          fi
          printf 'widgets_preflight_disk_kib=%s\n' "$available_kib"
          for port in 5432 5672 15672 4900 4901 4902 55432 55433 55435 55436 55437 55438; do
            if ss -H -ltn "sport = :$port" | grep -q .; then
              echo "Preflight runner port is already occupied: $port" >&2
              exit 1
            fi
          done
          if docker container ls --all --quiet \
            --filter label=com.winwidget.owner=widgets | grep -q .; then
            echo "A pre-existing Widgets-owned container collides with the isolated verify." >&2
            exit 1
          fi
          if docker container ls --all --quiet \
            --filter label=com.winwidget.owner=billing | grep -q .; then
            echo "A pre-existing Billing-owned container collides with the isolated verify." >&2
            exit 1
          fi
          if docker container ls --all --quiet \
            --filter label=com.winwidget.owner=identity | grep -q .; then
            echo "A pre-existing Identity-owned container collides with the isolated verify." >&2
            exit 1
          fi

          prisma_engine_url='https://binaries.prisma.sh/all_commits/605197351a3c8bdd595af2d2a9bc3025bca48ea2/debian-openssl-3.0.x/schema-engine.gz.sha256'
          docker run --rm --network bridge node:20-alpine node -e '
            const { lookup } = require("node:dns").promises;
            const endpoint = new URL(process.argv[1]);
            (async () => {
              const address = await lookup(endpoint.hostname);
              if (!address.address) throw new Error("Docker DNS returned no address");
              const response = await fetch(endpoint, { method: "HEAD" });
              if (!response.ok) throw new Error(`Prisma endpoint returned ${response.status}`);
            })().catch(error => {
              console.error(error);
              process.exitCode = 1;
            });
          ' "$prisma_engine_url"

          buildkit_probe_image="winwidget-buildkit-dns-preflight:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup_buildkit_probe() {
            docker image rm --force "$buildkit_probe_image" > /dev/null 2>&1 || true
          }
          trap cleanup_buildkit_probe EXIT
          DOCKER_BUILDKIT=1 docker build \
            --network default \
            --quiet \
            --build-arg "PRISMA_ENGINE_URL=$prisma_engine_url" \
            --tag "$buildkit_probe_image" - <<'DOCKERFILE'
          FROM node:20-alpine
          ARG PRISMA_ENGINE_URL
          RUN node -e 'const {lookup}=require("node:dns").promises;const endpoint=new URL(process.argv[1]);(async()=>{const address=await lookup(endpoint.hostname);if(!address.address)throw new Error("BuildKit DNS returned no address");const response=await fetch(endpoint,{method:"HEAD"});if(!response.ok)throw new Error(`Prisma endpoint returned ${response.status}`)})().catch(error=>{console.error(error);process.exitCode=1})' "$PRISMA_ENGINE_URL"
          DOCKERFILE
          cleanup_buildkit_probe
          trap - EXIT

      - name: Configure SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Add VPS host to known_hosts
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
        run: |
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Reject a checkout that would strand an active lifecycle
        env:
          APP_ROOT: /opt/winwidget
          AUTOMATIC_PROD_PUSH: ${{ github.event_name == 'push' && 'true' || 'false' }}
          DEPLOY_REVISION: ${{ github.sha }}
          DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || 'all' }}
          BILLING_CLEANUP_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.billing_cleanup_action || 'status' }}
          BILLING_CLEANUP_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'billing-cleanup' && inputs.billing_confirmation || '' }}
          IDENTITY_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.identity_action || 'status' }}
          IDENTITY_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target != 'identity-cleanup' && inputs.identity_confirmation || '' }}
          IDENTITY_ENV_EXPECTED_SHA256: ${{ github.event_name == 'workflow_dispatch' && inputs.identity_backend_env_expected_sha256 || '' }}
          IDENTITY_CLEANUP_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.identity_cleanup_action || 'status' }}
          IDENTITY_CLEANUP_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'identity-cleanup' && inputs.identity_confirmation || '' }}
          IDENTITY_CLEANUP_MIGRATION_SHA256: ${{ github.event_name == 'workflow_dispatch' && inputs.identity_cleanup_migration_sha256 || '' }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          if [[ "$DEPLOY_TARGET" == 'billing-cleanup' ]]; then
            case "$BILLING_CLEANUP_ACTION:$BILLING_CLEANUP_CONFIRMATION" in
              status:) ;;
              retarget:'RETARGET BILLING CLEANUP REVISION') ;;
              stage:'DROP LEGACY BILLING CORE SOURCE'|seal-offsite:'DROP LEGACY BILLING CORE SOURCE'|run:'DROP LEGACY BILLING CORE SOURCE'|complete-offsite:'DROP LEGACY BILLING CORE SOURCE') ;;
              *)
                echo 'Invalid Billing Core cleanup action or confirmation.' >&2
                exit 1
                ;;
            esac
          elif [[ "$BILLING_CLEANUP_ACTION" != 'status' ||
            -n "$BILLING_CLEANUP_CONFIRMATION" ]]; then
            echo 'Billing Core cleanup inputs require the billing-cleanup target.' >&2
            exit 1
          fi
          if [[ "$DEPLOY_TARGET" == 'identity' ]]; then
            case "$IDENTITY_ACTION:$IDENTITY_CONFIRMATION" in
              status:|export-env:|prepare:) ;;
              cutover:'CUTOVER IDENTITY OWNERSHIP'|forward-recovery:'CUTOVER IDENTITY OWNERSHIP') ;;
              abort-prepare:'ABORT IDENTITY PREPARE') ;;
              *)
                echo 'Invalid Identity action or confirmation.' >&2
                exit 1
                ;;
            esac
            case "$IDENTITY_ACTION" in
              prepare|cutover|forward-recovery)
                [[ "$IDENTITY_ENV_EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
                  echo 'Identity mutation requires the exact local canonical backend env SHA-256.' >&2
                  exit 1
                }
                ;;
              *)
                [[ -z "$IDENTITY_ENV_EXPECTED_SHA256" ]] || exit 1
                ;;
            esac
          elif [[ "$DEPLOY_TARGET" != 'identity-cleanup' &&
            ( "$IDENTITY_ACTION" != 'status' || -n "$IDENTITY_CONFIRMATION" ||
              -n "$IDENTITY_ENV_EXPECTED_SHA256" ) ]]; then
            echo 'Identity lifecycle inputs require the identity target.' >&2
            exit 1
          fi
          if [[ "$DEPLOY_TARGET" == 'identity-cleanup' ]]; then
            case "$IDENTITY_CLEANUP_ACTION:$IDENTITY_CLEANUP_CONFIRMATION" in
              status:)
                [[ -z "$IDENTITY_ENV_EXPECTED_SHA256" ]] || exit 1
                ;;
              verify:)
                [[ "$IDENTITY_CLEANUP_MIGRATION_SHA256" =~ ^[0-9a-f]{64}$ &&
                  "$IDENTITY_ENV_EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
                ;;
              run:'CLEANUP IDENTITY CORE SOURCE'|forward-recovery:'CLEANUP IDENTITY CORE SOURCE')
                [[ "$IDENTITY_CLEANUP_MIGRATION_SHA256" =~ ^[0-9a-f]{64}$ &&
                  "$IDENTITY_ENV_EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
                ;;
              *)
                echo 'Invalid Identity Core cleanup action or confirmation.' >&2
                exit 1
                ;;
            esac
          elif [[ "$IDENTITY_CLEANUP_ACTION" != 'status' ||
            -n "$IDENTITY_CLEANUP_CONFIRMATION" ||
            -n "$IDENTITY_CLEANUP_MIGRATION_SHA256" ]]; then
            echo 'Identity cleanup inputs require the identity-cleanup target.' >&2
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o TCPKeepAlive=yes \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "APP_ROOT='$APP_ROOT' EXPECTED_REVISION='$DEPLOY_REVISION' AUTOMATIC_PROD_PUSH='$AUTOMATIC_PROD_PUSH' DEPLOY_TARGET='$DEPLOY_TARGET' BILLING_CLEANUP_ACTION='$BILLING_CLEANUP_ACTION' BILLING_CLEANUP_CONFIRMATION='$BILLING_CLEANUP_CONFIRMATION' IDENTITY_ACTION='$IDENTITY_ACTION' IDENTITY_CONFIRMATION='$IDENTITY_CONFIRMATION' IDENTITY_CLEANUP_ACTION='$IDENTITY_CLEANUP_ACTION' IDENTITY_CLEANUP_CONFIRMATION='$IDENTITY_CLEANUP_CONFIRMATION' IDENTITY_CORE_CLEANUP_MIGRATION_SHA256='$IDENTITY_CLEANUP_MIGRATION_SHA256' bash -s" <<'EOF'
          set -euo pipefail
          cd "$APP_ROOT/winwidget.ru_server"
          [[ "$(id -u)" == "0" &&
            "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ &&
            "$(git branch --show-current)" == "prod" &&
            -z "$(git status --porcelain --untracked-files=all)" ]] || {
            echo "Lifecycle preflight requires a trusted clean prod checkout." >&2
            exit 1
          }
          if [[ "$DEPLOY_TARGET" == 'identity' &&
            "$IDENTITY_ACTION" == 'export-env' ]]; then
            echo 'Read-only Identity env export requires no candidate checkout assertion.'
            exit 0
          fi
          if ! docker compose build --help | grep -F -- '--provenance' > /dev/null; then
            echo 'Production Docker Compose lacks required build --provenance support.' >&2
            docker compose version >&2
            exit 1
          fi
          echo 'Production Docker Compose provenance capability passed.'

          production_env="$APP_ROOT/deploy/backend/.env.production"
          [[ -f "$production_env" && ! -L "$production_env" &&
            "$(stat -c '%u:%g:%a' "$production_env")" == '0:0:600' ]] || {
            echo "Backend production env must be a root-owned mode-600 regular file." >&2
            exit 1
          }
          require_production_env_key() {
            local key="$1"
            awk -F= -v key="$key" '
              /^[[:space:]]*(#|$)/ { next }
              {
                name = $1
                sub(/^[[:space:]]*/, "", name)
                sub(/[[:space:]]*$/, "", name)
                if (name != key) next
                value = $0
                sub(/^[^=]*=/, "", value)
                sub(/\r$/, "", value)
                sub(/^[[:space:]]*/, "", value)
                sub(/[[:space:]]*$/, "", value)
                matches += 1
                if (value != "" && value !~ /^(change_me|XYZXYZXYZ)/) valid += 1
              }
              END { exit(matches == 1 && valid == 1 ? 0 : 1) }
            ' "$production_env"
          }
          for key in \
            DATABASE_URL_PRODUCTION \
            DATABASE_MIGRATION_URL_PRODUCTION \
            DATABASE_BACKUP_URL \
            INTEGRATION_WORKER_KINDS \
            GATEWAY_ROUTES_JSON \
            CORS_ALLOWED_ORIGINS \
            WIDGETS_DATABASE_URL \
            WIDGETS_MIGRATION_DATABASE_URL \
            WIDGETS_BACKUP_URL \
