      - name: Rehearse guarded Widgets Core source cleanup in PostgreSQL 18
        env:
          CORE_CLEANUP_REHEARSAL_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/test-widgets-core-source-cleanup-rehearsal.sh --rehearsal

      - name: Test Reporting producer PostgreSQL boundaries
        env:
          REPORTING_PRODUCER_TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          REPORTING_PRODUCER_TEST_DATABASE_URL="$DATABASE_URL" \
            pnpm run test:reporting-producer-boundaries

      - name: Finalize Notification Delivery runtime grants
        env:
          MONOLITH_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          POSTGRES_CONTAINER_ID: ${{ env.NOTIFICATION_DELIVERY_CI_POSTGRES_CONTAINER }}
        run: |
          test "$POSTGRES_CONTAINER_ID" != "$MONOLITH_POSTGRES_CONTAINER_ID"
          test "$(
            docker inspect \
              --format '{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostIp}}:{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort}}' \
              "$POSTGRES_CONTAINER_ID"
          )" = "127.0.0.1:55432"
          test "$(
            docker inspect \
              --format '{{range .Mounts}}{{printf "%s|%s|%s|%t\n" .Destination .Type .Name .RW}}{{end}}' \
              "$POSTGRES_CONTAINER_ID" |
              awk -F'|' '$1 == "/var/lib/postgresql" || index($1, "/var/lib/postgresql/") == 1'
          )" = "/var/lib/postgresql|volume|$NOTIFICATION_DELIVERY_CI_POSTGRES_VOLUME|true"
          test "$(
            docker exec "$POSTGRES_CONTAINER_ID" \
              psql --tuples-only --no-align \
                --username winwidget_notification_delivery_admin \
                --dbname winwidget_notification_delivery_ci \
                --field-separator '|' \
                --command "
                  SELECT
                    current_setting('server_version_num')::integer / 10000,
                    pg_encoding_to_char(encoding),
                    datlocprovider,
                    datcollate,
                    datctype,
                    COALESCE(datcollversion, ''),
                    current_setting('data_checksums'),
                    current_setting('data_directory')
                  FROM pg_database
                  WHERE datname = current_database();
                "
          )" = "18|UTF8|c|C.UTF-8|C.UTF-8||on|/var/lib/postgresql/18/docker"

          docker exec -i "$MONOLITH_POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 --username winwidget --dbname winwidget_ci <<'SQL'
          DO $$
          BEGIN
            IF to_regnamespace('notification_delivery') IS NOT NULL THEN
              RAISE EXCEPTION
                'monolith database must not contain notification_delivery schema';
            END IF;
          END
          $$;
          SQL

          docker exec -i "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 \
              --username winwidget_notification_delivery_admin \
              --dbname winwidget_notification_delivery_ci <<'SQL'
          DO $$
          BEGIN
            IF to_regnamespace('notification_delivery') IS NULL THEN
              RAISE EXCEPTION
                'notification database must contain notification_delivery schema';
            END IF;
          END
          $$;
          SQL

          docker exec -i \
            --env PGPASSWORD=winwidget_notification_delivery_migration_ci \
            "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 \
              --host 127.0.0.1 \
              --username winwidget_notification_delivery_migration \
              --dbname winwidget_notification_delivery_ci <<'SQL'
          DO $$
          BEGIN
            IF has_database_privilege(
              current_user,
              current_database(),
              'CREATE'
            ) THEN
              RAISE EXCEPTION 'migration role must not have database CREATE';
            END IF;
            IF NOT has_schema_privilege(
              current_user,
              'notification_delivery',
              'CREATE'
            ) THEN
              RAISE EXCEPTION 'migration role must own service schema';
            END IF;
          END
          $$;
          REVOKE ALL
            ON TABLE notification_delivery._prisma_migrations
            FROM winwidget_notification_delivery_runtime;
          GRANT SELECT ON ALL TABLES IN SCHEMA notification_delivery
            TO winwidget_notification_delivery_backup;
          GRANT SELECT ON ALL SEQUENCES IN SCHEMA notification_delivery
            TO winwidget_notification_delivery_backup;
          CREATE SEQUENCE notification_delivery.ci_runtime_sequence;
          SQL

          docker exec -i \
            --env PGPASSWORD=winwidget_notification_delivery_runtime_ci \
            "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 \
              --host 127.0.0.1 \
              --username winwidget_notification_delivery_runtime \
              --dbname winwidget_notification_delivery_ci <<'SQL'
          DO $$
          BEGIN
            IF has_database_privilege(
              current_user,
              current_database(),
              'CREATE'
            ) THEN
              RAISE EXCEPTION 'runtime role must not have database CREATE';
            END IF;
            IF NOT has_schema_privilege(
              current_user,
