                "$POSTGRES_CONTAINER_ID"
            )"
            [[ "$status" == "healthy" ]] && break
            [[ "$status" != "unhealthy" && "$attempt" != "30" ]] || exit 1
            sleep 2
          done
          after_system_id="$(
            docker exec "$POSTGRES_CONTAINER_ID" \
              psql --tuples-only --no-align \
                --username winwidget_campaigns_admin \
                --dbname postgres \
                --command 'SELECT system_identifier FROM pg_control_system();'
          )"
          test "$before_system_id" = "$after_system_id"
          test "$(
            docker exec \
              -e PGPASSWORD=campaigns_runtime_ci \
              "$POSTGRES_CONTAINER_ID" \
              psql --tuples-only --no-align \
                --host 127.0.0.1 \
