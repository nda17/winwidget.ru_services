      - name: Verify Reporting PostgreSQL persistence and restore
        env:
          POSTGRES_CONTAINER_ID: ${{ env.REPORTING_CI_POSTGRES_CONTAINER }}
        run: |
          sentinel_id=00000000-0000-4000-8000-000000000004
          docker exec \
            -e PGPASSWORD=reporting_runtime_ci \
            "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 \
              --host 127.0.0.1 \
              --username winwidget_reporting_runtime \
              --dbname winwidget_reporting_ci \
              --command \
                "INSERT INTO reporting.heartbeats (id, role, instance_id, metadata, last_seen_at, created_at, updated_at) VALUES ('$sentinel_id', 'all', 'ci-persistence', '{\"persisted\":true}'::jsonb, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP) ON CONFLICT (id) DO UPDATE SET last_seen_at = EXCLUDED.last_seen_at, updated_at = EXCLUDED.updated_at;"

          docker restart "$POSTGRES_CONTAINER_ID" > /dev/null
          for attempt in $(seq 1 30); do
            status="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' \
                "$POSTGRES_CONTAINER_ID"
            )"
            [[ "$status" == "healthy" ]] && break
            if [[ "$status" == "unhealthy" || "$attempt" == "30" ]]; then
              docker logs "$POSTGRES_CONTAINER_ID" >&2
              exit 1
            fi
            sleep 2
          done

          test "$(
            docker exec \
              -e PGPASSWORD=reporting_runtime_ci \
              "$POSTGRES_CONTAINER_ID" \
              psql --tuples-only --no-align --set ON_ERROR_STOP=1 \
                --host 127.0.0.1 \
                --username winwidget_reporting_runtime \
                --dbname winwidget_reporting_ci \
