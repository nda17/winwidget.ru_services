      - name: Pre-provision shared Reporting RabbitMQ exchanges
        run: |
          docker run --rm \
            --network host \
            --env RABBITMQ_URL \
            --entrypoint node \
            "$REPORTING_IMAGE" \
            -e '
          const amqp = require("amqplib");
          const {
            REPORTING_DEAD_LETTER_EXCHANGE,
            REPORTING_EVENTS_EXCHANGE,
          } = require("./dist/src/messaging/reporting-messaging.constants.js");
          (async () => {
            const connection = await amqp.connect(process.env.RABBITMQ_URL);
            try {
              const channel = await connection.createConfirmChannel();
              try {
                await channel.assertExchange(REPORTING_EVENTS_EXCHANGE, "topic", {
                  durable: true,
                });
                await channel.assertExchange(
                  REPORTING_DEAD_LETTER_EXCHANGE,
                  "topic",
                  { durable: true },
                );
              } finally {
                await channel.close();
              }
            } finally {
              await connection.close();
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          '

