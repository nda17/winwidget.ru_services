      - name: Finalize and verify Identity database roles
        env:
          MONOLITH_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          POSTGRES_CONTAINER_ID: ${{ env.IDENTITY_CI_POSTGRES_CONTAINER }}
        run: |
          test "$POSTGRES_CONTAINER_ID" != "$MONOLITH_POSTGRES_CONTAINER_ID"
          docker exec -i "$MONOLITH_POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 --username winwidget --dbname winwidget_ci <<'SQL'
          DO $$
          BEGIN
            IF to_regnamespace('identity') IS NOT NULL THEN
              RAISE EXCEPTION 'Core database must not contain the Identity service schema';
            END IF;
          END $$;
          SQL

          docker exec -i "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 \
              --username winwidget_identity_admin \
              --dbname winwidget_identity_ci <<'SQL'
          REVOKE ALL ON ALL TABLES IN SCHEMA identity
            FROM PUBLIC, winwidget_identity_runtime, winwidget_identity_backup;
          REVOKE ALL ON ALL SEQUENCES IN SCHEMA identity
            FROM PUBLIC, winwidget_identity_runtime, winwidget_identity_backup;
          REVOKE ALL ON ALL FUNCTIONS IN SCHEMA identity
            FROM PUBLIC, winwidget_identity_runtime, winwidget_identity_backup;
          GRANT SELECT, INSERT, UPDATE, DELETE
            ON ALL TABLES IN SCHEMA identity TO winwidget_identity_runtime;
          GRANT USAGE, SELECT, UPDATE
            ON ALL SEQUENCES IN SCHEMA identity TO winwidget_identity_runtime;
          GRANT SELECT
            ON ALL TABLES IN SCHEMA identity TO winwidget_identity_backup;
          GRANT SELECT
            ON ALL SEQUENCES IN SCHEMA identity TO winwidget_identity_backup;
          REVOKE ALL ON TABLE identity._prisma_migrations
            FROM winwidget_identity_runtime;
          REVOKE CREATE, TEMPORARY ON DATABASE winwidget_identity_ci
            FROM winwidget_identity_migration, winwidget_identity_runtime, winwidget_identity_backup;

          ALTER DEFAULT PRIVILEGES
            FOR ROLE winwidget_identity_migration IN SCHEMA identity
            REVOKE ALL ON TABLES FROM PUBLIC, winwidget_identity_runtime, winwidget_identity_backup;
          ALTER DEFAULT PRIVILEGES
            FOR ROLE winwidget_identity_migration IN SCHEMA identity
            REVOKE ALL ON SEQUENCES FROM PUBLIC, winwidget_identity_runtime, winwidget_identity_backup;
          ALTER DEFAULT PRIVILEGES
            FOR ROLE winwidget_identity_migration IN SCHEMA identity
            REVOKE ALL ON FUNCTIONS FROM PUBLIC, winwidget_identity_runtime, winwidget_identity_backup;
          ALTER DEFAULT PRIVILEGES
            FOR ROLE winwidget_identity_migration
            REVOKE ALL ON FUNCTIONS FROM PUBLIC, winwidget_identity_runtime, winwidget_identity_backup;
          ALTER DEFAULT PRIVILEGES
            FOR ROLE winwidget_identity_migration IN SCHEMA identity
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES
            TO winwidget_identity_runtime;
          ALTER DEFAULT PRIVILEGES
            FOR ROLE winwidget_identity_migration IN SCHEMA identity
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES
            TO winwidget_identity_runtime;
          ALTER DEFAULT PRIVILEGES
            FOR ROLE winwidget_identity_migration IN SCHEMA identity
            GRANT SELECT ON TABLES TO winwidget_identity_backup;
          ALTER DEFAULT PRIVILEGES
            FOR ROLE winwidget_identity_migration IN SCHEMA identity
            GRANT SELECT ON SEQUENCES TO winwidget_identity_backup;

          DO $$
          DECLARE
            table_name text;
          BEGIN
            FOR table_name IN
              SELECT tablename FROM pg_tables
              WHERE schemaname = 'identity' AND tablename <> '_prisma_migrations'
            LOOP
              IF NOT has_table_privilege(
                'winwidget_identity_runtime', format('identity.%I', table_name),
                'SELECT,INSERT,UPDATE,DELETE'
              ) THEN
                RAISE EXCEPTION 'Identity runtime ACL missing for %', table_name;
              END IF;
              IF NOT has_table_privilege(
                'winwidget_identity_backup', format('identity.%I', table_name), 'SELECT'
              ) THEN
                RAISE EXCEPTION 'Identity backup ACL missing for %', table_name;
              END IF;
            END LOOP;
            IF has_table_privilege(
              'winwidget_identity_runtime', 'identity._prisma_migrations', 'SELECT'
            ) THEN
              RAISE EXCEPTION 'Identity migration history leaked to the runtime role';
            END IF;
            IF NOT has_table_privilege(
              'winwidget_identity_backup', 'identity._prisma_migrations', 'SELECT'
            ) THEN
              RAISE EXCEPTION 'Identity backup role cannot dump migration history';
            END IF;
          END $$;
          SQL

          docker exec \
            -e PGPASSWORD=identity_runtime_ci \
            "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 --host 127.0.0.1 \
              --username winwidget_identity_runtime --dbname winwidget_identity_ci \
              --command 'SELECT count(*) FROM identity.service_identity;' > /dev/null
          if docker exec \
            -e PGPASSWORD=identity_runtime_ci \
            "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 --host 127.0.0.1 \
              --username winwidget_identity_runtime --dbname winwidget_identity_ci \
              --command 'SELECT count(*) FROM identity._prisma_migrations;' \
              > /dev/null 2>&1; then
            echo 'Identity runtime can read _prisma_migrations.' >&2
            exit 1
          fi
          docker exec \
            -e PGPASSWORD=identity_backup_ci \
            "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 --host 127.0.0.1 \
              --username winwidget_identity_backup --dbname winwidget_identity_ci \
              --command 'SELECT count(*) FROM identity.outbox_events;' > /dev/null
          if docker exec \
            -e PGPASSWORD=identity_backup_ci \
            "$POSTGRES_CONTAINER_ID" \
            psql --set ON_ERROR_STOP=1 --host 127.0.0.1 \
              --username winwidget_identity_backup --dbname winwidget_identity_ci \
              --command "INSERT INTO identity.source_sequences (id, last_value, created_at, updated_at) VALUES ('ci-backup-write-must-fail', 1, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP);" \
              > /dev/null 2>&1; then
            echo 'Identity backup role can mutate service data.' >&2
            exit 1
          fi

      - name: Verify Identity PostgreSQL persistence and restore rehearsal
