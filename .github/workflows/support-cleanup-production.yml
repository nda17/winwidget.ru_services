name: Support Core Cleanup Production

on:
  workflow_dispatch:
    inputs:
      support_confirmation:
        description: Type DROP LEGACY SUPPORT CORE SOURCE
        required: true
        type: string
      support_cleanup_migration_sha256:
        description: Reviewed SHA-256 of the exact Support Core cleanup SQL
        required: true
        type: string
      support_cleanup_backup_sha256:
        description: SHA-256 of the protected Support database backup used for cleanup recovery
        required: true
        type: string
      support_cleanup_restore_evidence_sha256:
        description: SHA-256 of the clean Support restore rehearsal evidence
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production-server
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact cleanup controller
        uses: actions/checkout@v6

      - name: Verify immutable prod cleanup request
        env:
          SUPPORT_CONFIRMATION: ${{ inputs.support_confirmation }}
          SUPPORT_CLEANUP_MIGRATION_SHA256: ${{ inputs.support_cleanup_migration_sha256 }}
          SUPPORT_CLEANUP_BACKUP_SHA256: ${{ inputs.support_cleanup_backup_sha256 }}
          SUPPORT_CLEANUP_RESTORE_EVIDENCE_SHA256: ${{ inputs.support_cleanup_restore_evidence_sha256 }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/prod' &&
            "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ &&
            "$(git rev-parse HEAD)" == "$GITHUB_SHA" &&
            -z "$(git status --porcelain --untracked-files=all)" &&
            "$SUPPORT_CONFIRMATION" == 'DROP LEGACY SUPPORT CORE SOURCE' &&
            "$SUPPORT_CLEANUP_MIGRATION_SHA256" =~ ^[0-9a-f]{64}$ &&
            "$SUPPORT_CLEANUP_BACKUP_SHA256" =~ ^[0-9a-f]{64}$ &&
            "$SUPPORT_CLEANUP_RESTORE_EVIDENCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          bash -n \
            .github/scripts/stage-or-deploy-backend.sh \
            .github/scripts/stage-or-deploy-backend-remote.sh \
            scripts/cleanup-support-core-source-production.sh
          bash scripts/cleanup-support-core-source-production.sh --self-test
          node scripts/test-support-runtime-boundaries.mjs

  cleanup:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    steps:
      - name: Checkout exact cleanup controller
        uses: actions/checkout@v6

      - name: Reverify immutable prod checkout
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/prod' &&
            "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ &&
            "$(git rev-parse HEAD)" == "$GITHUB_SHA" &&
            -z "$(git status --porcelain --untracked-files=all)" ]]

      - name: Configure SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Add VPS host to known_hosts
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
        run: |
          set -Eeuo pipefail
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Run exact Support Core cleanup controller
        env:
          APP_ROOT: /opt/winwidget
          AUTOMATIC_PROD_PUSH: 'false'
          DEPLOY_REVISION: ${{ github.sha }}
          DEPLOY_TARGET: support
          WIDGETS_CUTOVER_CONFIRMATION: ''
          BILLING_ACTION: status
          BILLING_CONFIRMATION: ''
          BILLING_CLEANUP_ACTION: status
          BILLING_CLEANUP_CONFIRMATION: ''
          IDENTITY_ACTION: status
          IDENTITY_CONFIRMATION: ''
          IDENTITY_ENV_EXPECTED_SHA256: ''
          IDENTITY_ENV_EXPORT_ID: ''
          IDENTITY_CLEANUP_ACTION: status
          IDENTITY_CLEANUP_CONFIRMATION: ''
          IDENTITY_CLEANUP_MIGRATION_SHA256: ''
          PLATFORM_ACTION: status
          PLATFORM_CONFIRMATION: ''
          PLATFORM_ENV_EXPECTED_SHA256: ''
          PLATFORM_FRONTEND_REVISION: ''
          PLATFORM_FRONTEND_RUNTIME_CHALLENGE: ''
          PLATFORM_FRONTEND_ORIGIN: ''
          PLATFORM_FRONTEND_EXPECTED_ATTESTATION_SHA256: ''
          PLATFORM_FRONTEND_EXPECTED_SIGNATURE_SHA256: ''
          PLATFORM_FRONTEND_TRUSTED_PUBLIC_KEY_SHA256: ''
          PLATFORM_CLEANUP_MIGRATION_SHA256: ''
          PLATFORM_CLEANUP_COMPOSE_SHA256: ''
          PLATFORM_CLEANUP_FIRST_COMPLETE_PROOF_SHA256: ''
          PLATFORM_CLEANUP_SOAK_SECONDS: ''
          SUPPORT_ACTION: cleanup
          SUPPORT_CONFIRMATION: ${{ inputs.support_confirmation }}
          SUPPORT_CLEANUP_MIGRATION_SHA256: ${{ inputs.support_cleanup_migration_sha256 }}
          SUPPORT_CLEANUP_BACKUP_SHA256: ${{ inputs.support_cleanup_backup_sha256 }}
          SUPPORT_CLEANUP_RESTORE_EVIDENCE_SHA256: ${{ inputs.support_cleanup_restore_evidence_sha256 }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -Eeuo pipefail
          [[ "$SUPPORT_CONFIRMATION" == 'DROP LEGACY SUPPORT CORE SOURCE' &&
            "$SUPPORT_CLEANUP_MIGRATION_SHA256" =~ ^[0-9a-f]{64}$ &&
            "$SUPPORT_CLEANUP_BACKUP_SHA256" =~ ^[0-9a-f]{64}$ &&
            "$SUPPORT_CLEANUP_RESTORE_EVIDENCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          bash .github/scripts/stage-or-deploy-backend.sh
