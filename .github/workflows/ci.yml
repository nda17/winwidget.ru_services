            test "$DOMAIN_DATABASE" = "winwidget_${DOMAIN_SCHEMA}_test_ci"
          fi
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -U crm_domain_bootstrap_ci -d postgres -v ON_ERROR_STOP=1 <<SQL
          CREATE ROLE crm_domain_migration_ci LOGIN PASSWORD 'crm_domain_migration_ci_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE crm_domain_runtime_ci LOGIN PASSWORD 'crm_domain_runtime_ci_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE DATABASE "$DOMAIN_DATABASE" OWNER crm_domain_bootstrap_ci;
          REVOKE ALL ON DATABASE "$DOMAIN_DATABASE" FROM PUBLIC;
          GRANT CONNECT ON DATABASE "$DOMAIN_DATABASE" TO crm_domain_migration_ci, crm_domain_runtime_ci;
          SQL
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -U crm_domain_bootstrap_ci -d "$DOMAIN_DATABASE" -v ON_ERROR_STOP=1 <<SQL
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          CREATE SCHEMA "$DOMAIN_SCHEMA" AUTHORIZATION crm_domain_migration_ci;
          CREATE SCHEMA foreign_service_guard AUTHORIZATION crm_domain_bootstrap_ci;
          CREATE TABLE foreign_service_guard.sentinel (id INTEGER PRIMARY KEY);
          REVOKE ALL ON SCHEMA foreign_service_guard FROM PUBLIC;
          REVOKE ALL ON ALL TABLES IN SCHEMA foreign_service_guard FROM PUBLIC;
          SQL
      - name: Generate client and apply migrations as migration role
        run: |
          domain_prefix="$(printf '%s' "$DOMAIN_SCHEMA" | tr '[:lower:]' '[:upper:]')"
          env "${domain_prefix}_DATABASE_URL=$DOMAIN_MIGRATION_URL" pnpm --dir "apps/$DOMAIN_APP" run prisma:generate
          env "${domain_prefix}_DATABASE_URL=$DOMAIN_MIGRATION_URL" pnpm --dir "apps/$DOMAIN_APP" run prisma:migrate:deploy
      - name: Build domain service
        run: pnpm --dir "apps/$DOMAIN_APP" run build
      - name: Grant explicit runtime privileges
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          case "$DOMAIN_APP" in
            identity)
              docker exec "$POSTGRES_CONTAINER_ID" psql -U crm_domain_bootstrap_ci -d "$DOMAIN_DATABASE" -v ON_ERROR_STOP=1 -c 'GRANT USAGE ON SCHEMA identity TO crm_domain_runtime_ci; GRANT SELECT ON identity.service_identity TO crm_domain_runtime_ci; GRANT SELECT, INSERT, UPDATE ON identity.users, identity.workspaces, identity.workspace_members TO crm_domain_runtime_ci; REVOKE ALL ON identity._prisma_migrations FROM crm_domain_runtime_ci'
              exit 0
              ;;
            crm-access)
              mutable_tables='crm_access.crm_workspace_access, crm_access.crm_workspace_members, crm_access.crm_teams, crm_access.crm_invitation_intents, crm_access.crm_admissions, crm_access.crm_team_outbox, crm_access.crm_team_deliveries'
              receipt_tables='crm_access.crm_team_command_receipts, crm_access.crm_team_audit'
              docker exec "$POSTGRES_CONTAINER_ID" psql -U crm_domain_bootstrap_ci -d "$DOMAIN_DATABASE" -v ON_ERROR_STOP=1 -c 'GRANT SELECT, INSERT, UPDATE, DELETE ON crm_access.crm_member_teams TO crm_domain_runtime_ci; GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA crm_access TO crm_domain_runtime_ci'
              ;;
            crm-customers)
              mutable_tables='crm_customers.contacts, crm_customers.companies'
              receipt_tables='crm_customers.customer_commands, crm_customers.customer_activities, crm_customers.intake_operation_slots, crm_customers.intake_operation_commands, crm_customers.export_audit'
              ;;
            crm-intake)
              mutable_tables='crm_intake.inbox_entries, crm_intake.intake_sources, crm_intake.acceptances, crm_intake.acceptance_outbox, crm_intake.acceptance_receipts, crm_intake.managed_widget_sources, crm_intake.widget_control_jobs, crm_intake.widget_control_receipts, crm_intake.widget_control_outbox'
              receipt_tables='crm_intake.intake_commands, crm_intake.intake_activities, crm_intake.inbound_receipts, crm_intake.csv_imports, crm_intake.csv_import_rows, crm_intake.export_audit'
              docker exec "$POSTGRES_CONTAINER_ID" psql -U crm_domain_bootstrap_ci -d "$DOMAIN_DATABASE" -v ON_ERROR_STOP=1 -c 'GRANT SELECT, INSERT, UPDATE, DELETE ON crm_intake.ingestion_rate_buckets TO crm_domain_runtime_ci'
              ;;
            crm-sales)
              mutable_tables='crm_sales.deals, crm_sales.tasks'
              receipt_tables='crm_sales.deal_timeline, crm_sales.command_receipts, crm_sales.pipeline_template_installations, crm_sales.pipeline_template_installation_commands, crm_sales.intake_operation_slots, crm_sales.intake_operation_commands, crm_sales.export_audit'
              docker exec "$POSTGRES_CONTAINER_ID" psql -U crm_domain_bootstrap_ci -d "$DOMAIN_DATABASE" -v ON_ERROR_STOP=1 -c 'GRANT SELECT, INSERT, UPDATE, DELETE ON crm_sales.pipelines, crm_sales.pipeline_stages TO crm_domain_runtime_ci'
              ;;
            notification-delivery)
              docker exec "$POSTGRES_CONTAINER_ID" psql -U crm_domain_bootstrap_ci -d "$DOMAIN_DATABASE" -v ON_ERROR_STOP=1 -c 'GRANT USAGE ON SCHEMA notification_delivery TO crm_domain_runtime_ci; GRANT SELECT, INSERT, UPDATE, DELETE ON notification_delivery.delivery_receipts, notification_delivery.delivery_failures, notification_delivery.outbox_events, notification_delivery.control_actions, notification_delivery.heartbeats TO crm_domain_runtime_ci'
              exit 0
              ;;
            *) exit 1 ;;
          esac
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -U crm_domain_bootstrap_ci -d "$DOMAIN_DATABASE" -v ON_ERROR_STOP=1 <<SQL
          GRANT USAGE ON SCHEMA "$DOMAIN_SCHEMA" TO crm_domain_runtime_ci;
          GRANT SELECT ON "$DOMAIN_SCHEMA".service_identity TO crm_domain_runtime_ci;
          GRANT SELECT, INSERT, UPDATE ON $mutable_tables TO crm_domain_runtime_ci;
          GRANT SELECT, INSERT ON $receipt_tables TO crm_domain_runtime_ci;
          REVOKE ALL ON "$DOMAIN_SCHEMA"._prisma_migrations FROM crm_domain_runtime_ci;
          SQL
      - name: Prove domain invariants on PostgreSQL 18
        env:
          DOMAIN_TEST_SCRIPT: ${{ matrix.script }}
        run: |
          if [ "$DOMAIN_APP" = notification-delivery ]; then
            env NOTIFICATION_INVITATION_TEST_ALLOW_MUTATION=true \
              "NOTIFICATION_INVITATION_TEST_DATABASE_URL=$DOMAIN_RUNTIME_URL" \
              NOTIFICATION_INVITATION_TEST_RUNTIME_ROLE=crm_domain_runtime_ci \
              pnpm --dir "apps/$DOMAIN_APP" run "$DOMAIN_TEST_SCRIPT"
            exit 0
          fi
          domain_prefix="$(printf '%s' "$DOMAIN_SCHEMA" | tr '[:lower:]' '[:upper:]')"
          env "${domain_prefix}_DATABASE_URL=$DOMAIN_MIGRATION_URL" \
            "${domain_prefix}_TEST_DATABASE_URL=$DOMAIN_RUNTIME_URL" \
            "${domain_prefix}_TEST_MIGRATION_DATABASE_URL=$DOMAIN_MIGRATION_URL" \
            "${domain_prefix}_TEST_RUNTIME_ROLE=crm_domain_runtime_ci" \
            "${domain_prefix}_TEST_SKIP_MIGRATIONS=true" \
            "${domain_prefix}_INTEGRATION_ALLOW_MUTATION=true" \
            pnpm --dir "apps/$DOMAIN_APP" run "$DOMAIN_TEST_SCRIPT"
      - name: Prove bounded read-only export on PostgreSQL 18
        if: matrix.app == 'crm-customers' || matrix.app == 'crm-sales' || matrix.app == 'crm-intake'
        run: |
          domain_prefix="$(printf '%s' "$DOMAIN_SCHEMA" | tr '[:lower:]' '[:upper:]')"
          env "${domain_prefix}_TEST_DATABASE_URL=$DOMAIN_RUNTIME_URL" \
            "${domain_prefix}_TEST_MIGRATION_DATABASE_URL=$DOMAIN_MIGRATION_URL" \
            "${domain_prefix}_TEST_RUNTIME_ROLE=crm_domain_runtime_ci" \
            "${domain_prefix}_INTEGRATION_ALLOW_MUTATION=true" \
            pnpm --dir "apps/$DOMAIN_APP" run test:integration:export
      - name: Prove Customers operation fencing on PostgreSQL 18
        if: matrix.app == 'crm-customers'
        env:
          CRM_CUSTOMERS_INTEGRATION_ALLOW_MUTATION: 'true'
          CRM_CUSTOMERS_TEST_DATABASE_URL: ${{ env.DOMAIN_RUNTIME_URL }}
          CRM_CUSTOMERS_TEST_MIGRATION_DATABASE_URL: ${{ env.DOMAIN_MIGRATION_URL }}
          CRM_CUSTOMERS_TEST_RUNTIME_ROLE: crm_domain_runtime_ci
        run: pnpm --dir apps/crm-customers run test:integration:intake
      - name: Prove atomic CSV import on PostgreSQL 18
        if: matrix.app == 'crm-intake'
        env:
          CRM_INTAKE_INTEGRATION_ALLOW_MUTATION: 'true'
          CRM_INTAKE_TEST_DATABASE_URL: ${{ env.DOMAIN_RUNTIME_URL }}
          CRM_INTAKE_TEST_MIGRATION_DATABASE_URL: ${{ env.DOMAIN_MIGRATION_URL }}
          CRM_INTAKE_TEST_RUNTIME_ROLE: crm_domain_runtime_ci
        run: pnpm --dir apps/crm-intake run test:integration:csv
      - name: Prove Intake acceptance on PostgreSQL 18 and RabbitMQ
        if: matrix.app == 'crm-intake'
        env:
          CRM_INTAKE_INTEGRATION_ALLOW_MUTATION: 'true'
          CRM_INTAKE_TEST_DATABASE_URL: ${{ env.DOMAIN_RUNTIME_URL }}
          CRM_INTAKE_TEST_MIGRATION_DATABASE_URL: ${{ env.DOMAIN_MIGRATION_URL }}
          CRM_INTAKE_TEST_RUNTIME_ROLE: crm_domain_runtime_ci
          CRM_INTAKE_ACCEPTANCE_TEST_RABBITMQ_URL: amqp://crm_workflow_ci:crm_workflow_ci@127.0.0.1:5672/winwidget_crm_acceptance_ci
        run: pnpm --dir apps/crm-intake run test:integration:acceptance
      - name: Prepare isolated least-privilege widget control broker
        if: matrix.app == 'crm-intake'
        env:
          RABBITMQ_CONTAINER_ID: ${{ job.services.rabbitmq.id }}
        run: |
          docker exec "$RABBITMQ_CONTAINER_ID" rabbitmqctl add_vhost winwidget_crm_widget_control_ci
          docker exec "$RABBITMQ_CONTAINER_ID" rabbitmqctl add_user crm_widget_control_ci crm_widget_control_ci_password
          control_resources='^winwidget\.crm-intake\.widget-control\.(events|retry|dead-letter|v1(\.dead-letter|\.retry\.[1-3])?)$'
          docker exec "$RABBITMQ_CONTAINER_ID" rabbitmqctl set_permissions -p winwidget_crm_widget_control_ci crm_widget_control_ci "$control_resources" "$control_resources" "$control_resources"
      - name: Prove native widget control on PostgreSQL 18 and scoped RabbitMQ
        if: matrix.app == 'crm-intake'
        env:
          CRM_INTAKE_INTEGRATION_ALLOW_MUTATION: 'true'
          CRM_INTAKE_TEST_DATABASE_URL: ${{ env.DOMAIN_RUNTIME_URL }}
          CRM_INTAKE_TEST_MIGRATION_DATABASE_URL: ${{ env.DOMAIN_MIGRATION_URL }}
          CRM_INTAKE_TEST_RUNTIME_ROLE: crm_domain_runtime_ci
          CRM_INTAKE_WIDGET_CONTROL_TEST_RABBITMQ_URL: amqp://crm_widget_control_ci:crm_widget_control_ci_password@127.0.0.1:5672/winwidget_crm_widget_control_ci
        run: pnpm --dir apps/crm-intake run test:integration:widget-control

  production-image:
    name: Production image / ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app:
          - billing
          - campaigns
          - crm-access
          - crm-intake
          - crm-customers
          - crm-sales
          - identity
          - notification-delivery
          - operations
          - platform
          - reporting
          - support
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify immutable revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Build production image
        run: >-
          docker build
          --build-arg "APP_REVISION=${{ github.sha }}"
          --tag "winwidget-${{ matrix.app }}:ci-${{ github.sha }}"
          "apps/${{ matrix.app }}"

  deploy-production:
    name: Deploy production
    needs:
      - billing-crm-policy-integration
      - billing-crm-provenance-migration
      - crm-migration-smoke
      - crm-domain-integration
      - crm-sales-integration
      - lifecycle-contract
      - operations-control-ledger
      - operations-restore-rehearsal
      - production-image
      - service
      - service-integration
      - widgets-integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    uses: nda17/winwidget.ru_infra/.github/workflows/deploy-production.yml@b602ae559223c5fc20de0c319d9d8250ab5aa5d3
    with:
      services_revision: ${{ github.sha }}
    secrets:
      BACKEND_PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      BACKEND_PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
      BACKEND_PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      BACKEND_PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      BACKEND_PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.BACKEND_PRODUCTION_SSH_KNOWN_HOSTS }}
      BACKEND_PRODUCTION_ENV_SHA256: ${{ secrets.BACKEND_PRODUCTION_ENV_SHA256 }}
