name: Services CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: services-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-contract:
    name: Apps-only lifecycle contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify immutable revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: bash .github/scripts/static-check-services-lifecycle.sh

  service:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app:
          - api-gateway
          - notification-delivery
          - campaigns
          - reporting
          - widgets
          - billing
          - identity
          - platform
          - support
          - operations
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify immutable revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/${{ matrix.app }}/pnpm-lock.yaml
      - name: Install ${{ matrix.app }}
        run: pnpm --dir "apps/${{ matrix.app }}" install --frozen-lockfile
      - name: Generate Prisma client
        if: matrix.app != 'api-gateway'
        run: pnpm --dir "apps/${{ matrix.app }}" run prisma:generate
      - name: Lint
        if: matrix.app != 'api-gateway'
        run: pnpm --dir "apps/${{ matrix.app }}" run lint
      - name: Typecheck
        run: pnpm --dir "apps/${{ matrix.app }}" run typecheck
      - name: Unit tests
        run: pnpm --dir "apps/${{ matrix.app }}" run test
      - name: Build
        run: pnpm --dir "apps/${{ matrix.app }}" run build
