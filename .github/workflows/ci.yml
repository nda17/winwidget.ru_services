name: Services CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: services-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

jobs:
  lifecycle-contract:
    name: Apps-only lifecycle contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify immutable revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: bash .github/scripts/static-check-services-lifecycle.sh

  service:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app:
          - api-gateway
          - notification-delivery
          - campaigns
          - crm-access
          - crm-intake
          - crm-customers
          - crm-sales
          - reporting
          - widgets
          - billing
          - identity
          - platform
          - support
          - operations
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify immutable revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/${{ matrix.app }}/pnpm-lock.yaml
      - name: Install ${{ matrix.app }}
        run: pnpm --dir "apps/${{ matrix.app }}" install --frozen-lockfile
      - name: Audit production dependencies
        if: matrix.app == 'billing'
        run: >-
          pnpm --dir "apps/${{ matrix.app }}" audit
          --prod --audit-level high
      - name: Verify production dependency allowlist
        if: matrix.app != 'billing'
        run: >-
          node .github/scripts/verify-production-audit.cjs
          "${{ matrix.app }}"
      - name: Generate Prisma client
        if: matrix.app != 'api-gateway'
        run: pnpm --dir "apps/${{ matrix.app }}" run prisma:generate
      - name: Lint
        if: matrix.app != 'api-gateway'
        run: pnpm --dir "apps/${{ matrix.app }}" run lint
      - name: Typecheck
        run: pnpm --dir "apps/${{ matrix.app }}" run typecheck
      - name: Unit tests
        run: pnpm --dir "apps/${{ matrix.app }}" run test
      - name: Build
        run: pnpm --dir "apps/${{ matrix.app }}" run build

  widgets-integration:
    name: Widgets security integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: widgets_ci
          POSTGRES_PASSWORD: widgets_ci
          POSTGRES_DB: widgets_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U widgets_ci -d widgets_ci"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      WIDGETS_DATABASE_URL: postgresql://widgets_ci:widgets_ci@127.0.0.1:5432/widgets_ci
      WIDGETS_TEST_DATABASE_URL: postgresql://widgets_ci:widgets_ci@127.0.0.1:5432/widgets_ci
      WIDGETS_INTEGRATION_ALLOW_MUTATION: 'true'
      WIDGETS_BROWSER_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify immutable revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/widgets/pnpm-lock.yaml
      - name: Install Widgets
        run: pnpm --dir apps/widgets install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --dir apps/widgets run prisma:generate
      - name: Prepare Widgets schema
        run: >-
          docker exec "${{ job.services.postgres.id }}"
          psql -U widgets_ci -d widgets_ci -v ON_ERROR_STOP=1
          -c "CREATE SCHEMA widgets AUTHORIZATION widgets_ci"
      - name: Apply Widgets migrations
        run: pnpm --dir apps/widgets run prisma:migrate:deploy
      - name: Build Widgets
        run: pnpm --dir apps/widgets run build
      - name: Verify browser executable
        run: test -x "$WIDGETS_BROWSER_EXECUTABLE"
      - name: Run Widgets behavior integration
        run: pnpm --dir apps/widgets run test:integration:behavior
      - name: Prepare isolated native WinCRM connector database
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -U widgets_ci -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE widgets_wincrm_migration_ci LOGIN PASSWORD 'widgets_wincrm_migration_ci_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE widgets_wincrm_runtime_ci LOGIN PASSWORD 'widgets_wincrm_runtime_ci_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE DATABASE winwidget_widgets_ci OWNER widgets_ci;
          REVOKE ALL ON DATABASE winwidget_widgets_ci FROM PUBLIC;
          GRANT CONNECT ON DATABASE winwidget_widgets_ci TO widgets_wincrm_migration_ci, widgets_wincrm_runtime_ci;
          SQL
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -U widgets_ci -d winwidget_widgets_ci -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          CREATE SCHEMA widgets AUTHORIZATION widgets_wincrm_migration_ci;
          CREATE SCHEMA foreign_service_guard AUTHORIZATION widgets_ci;
          CREATE TABLE foreign_service_guard.sentinel (id INTEGER PRIMARY KEY);
          REVOKE ALL ON SCHEMA foreign_service_guard FROM PUBLIC;
          REVOKE ALL ON ALL TABLES IN SCHEMA foreign_service_guard FROM PUBLIC;
          SQL
      - name: Migrate native connector database as owning migration role
        env:
          WIDGETS_DATABASE_URL: postgresql://widgets_wincrm_migration_ci:widgets_wincrm_migration_ci_password@127.0.0.1:5432/winwidget_widgets_ci?schema=widgets
        run: pnpm --dir apps/widgets run prisma:migrate:deploy
      - name: Grant least-privilege native connector runtime
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -U widgets_ci -d winwidget_widgets_ci -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA widgets TO widgets_wincrm_runtime_ci;
          GRANT SELECT ON widgets.service_identity, widgets.callbacks, widgets.callback_leads, widgets.quizzes, widgets.quiz_leads, widgets.countdown_timers, widgets.countdown_timer_leads, widgets.stop_offers, widgets.stop_offer_leads, widgets.calculators, widgets.calculator_leads TO widgets_wincrm_runtime_ci;
          GRANT SELECT, INSERT, UPDATE ON widgets.usage_counters, widgets.wincrm_connectors TO widgets_wincrm_runtime_ci;
          GRANT SELECT, INSERT ON widgets.widgets, widgets.leads, widgets.owner_projections, widgets.entitlement_projections, widgets.usage_ledger, widgets.outbox_events, widgets.wincrm_connector_commands, widgets.wincrm_transfer_intents TO widgets_wincrm_runtime_ci;
          GRANT UPDATE (id) ON widgets.widgets, widgets.callbacks, widgets.quizzes, widgets.countdown_timers, widgets.stop_offers, widgets.calculators TO widgets_wincrm_runtime_ci;
          REVOKE ALL ON widgets._prisma_migrations FROM widgets_wincrm_runtime_ci;
          SQL
      - name: Prove native connector replay and atomic lead Outbox on PostgreSQL 18
        env:
          WIDGETS_TEST_DATABASE_URL: postgresql://widgets_wincrm_runtime_ci:widgets_wincrm_runtime_ci_password@127.0.0.1:5432/winwidget_widgets_ci?schema=widgets
          WIDGETS_INTEGRATION_ALLOW_MUTATION: 'true'
        run: pnpm --dir apps/widgets run test:integration:wincrm

  operations-restore-rehearsal:
    name: Operations restore PostgreSQL 18 rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_USER: operations_restore_rehearsal_superuser
          POSTGRES_PASSWORD: operations_restore_rehearsal_password_A9
          POSTGRES_DB: operations_restore_rehearsal_control
        options: >-
          --label winwidget.operations-restore-rehearsal=true
          --health-cmd "pg_isready -U operations_restore_rehearsal_superuser -d operations_restore_rehearsal_control"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      OPERATIONS_RESTORE_REHEARSAL_ALLOW_MUTATION: 'true'
      OPERATIONS_RESTORE_REHEARSAL_POSTGRES_USER: operations_restore_rehearsal_superuser
      OPERATIONS_RESTORE_REHEARSAL_POSTGRES_PASSWORD: operations_restore_rehearsal_password_A9
      OPERATIONS_RESTORE_REHEARSAL_POSTGRES_DB: operations_restore_rehearsal_control
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify immutable revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/operations/pnpm-lock.yaml
      - name: Install Operations
        run: pnpm --dir apps/operations install --frozen-lockfile
      - name: Generate Operations Prisma client
        run: pnpm --dir apps/operations run prisma:generate
      - name: Build Operations
        run: pnpm --dir apps/operations run build
      - name: Run isolated restore rehearsal
        env:
          OPERATIONS_RESTORE_REHEARSAL_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: pnpm --dir apps/operations run test:integration:restore-rehearsal

  operations-control-ledger:
    name: Operations control ledger PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_USER: operations_control_ledger_superuser
          POSTGRES_PASSWORD: operations_control_ledger_password_A9
          POSTGRES_DB: operations_control_ledger
        ports:
          - 5432:5432
        options: >-
          --label winwidget.operations-control-ledger=true
          --health-cmd "pg_isready -U operations_control_ledger_superuser -d operations_control_ledger"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      OPERATIONS_CONTROL_LEDGER_ALLOW_MUTATION: 'true'
      OPERATIONS_CONTROL_LEDGER_POSTGRES_USER: operations_control_ledger_superuser
      OPERATIONS_CONTROL_LEDGER_POSTGRES_PASSWORD: operations_control_ledger_password_A9
      OPERATIONS_CONTROL_LEDGER_POSTGRES_DB: operations_control_ledger
      OPERATIONS_CONTROL_LEDGER_POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify immutable revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/operations/pnpm-lock.yaml
      - name: Install Operations
        run: pnpm --dir apps/operations install --frozen-lockfile
      - name: Run control-ledger negative SQL matrix
        env:
          OPERATIONS_CONTROL_LEDGER_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: pnpm --dir apps/operations run test:integration:restore-control-ledger

  service-integration:
    name: Service integration / ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: campaigns
            schema: campaigns
          - app: notification-delivery
            schema: notification_delivery
          - app: reporting
            schema: reporting
          - app: identity
            schema: identity
    services:
      postgres:
        image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_USER: services_ci
          POSTGRES_PASSWORD: services_ci
          POSTGRES_DB: services_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U services_ci -d services_ci"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      rabbitmq:
        image: rabbitmq:4.2.9-management-alpine@sha256:0ab90fc05c41e9d2d8f11af5036e466c364adf5085ed83c477ab41aec0bdde86
        env:
          RABBITMQ_DEFAULT_USER: admin_ci
          RABBITMQ_DEFAULT_PASS: admin_ci
          RABBITMQ_DEFAULT_VHOST: winwidget
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      CAMPAIGNS_DATABASE_URL: postgresql://services_ci:services_ci@127.0.0.1:5432/services_ci?schema=campaigns
      CAMPAIGNS_TEST_DATABASE_URL: postgresql://services_ci:services_ci@127.0.0.1:5432/services_ci?schema=campaigns
      CAMPAIGNS_TEST_MIGRATION_DATABASE_URL: postgresql://services_ci:services_ci@127.0.0.1:5432/services_ci?schema=campaigns
      CAMPAIGNS_INTEGRATION_ALLOW_MUTATION: 'true'
      CAMPAIGNS_TEST_RABBITMQ_URL: amqp://restricted_ci:restricted_ci@127.0.0.1:5672/winwidget
      NOTIFICATION_DELIVERY_DATABASE_URL: postgresql://services_ci:services_ci@127.0.0.1:5432/services_ci?schema=notification_delivery
      NOTIFICATION_DELIVERY_INTEGRATION_ALLOW_PURGE: 'true'
      NOTIFICATION_DELIVERY_TEST_RABBITMQ_URL: amqp://restricted_ci:restricted_ci@127.0.0.1:5672/winwidget
      RABBITMQ_URL: amqp://admin_ci:admin_ci@127.0.0.1:5672/winwidget
      REPORTING_DATABASE_URL: postgresql://services_ci:services_ci@127.0.0.1:5432/services_ci?schema=reporting
      REPORTING_TEST_DATABASE_URL: postgresql://services_ci:services_ci@127.0.0.1:5432/services_ci?schema=reporting
      REPORTING_TEST_MIGRATION_DATABASE_URL: postgresql://services_ci:services_ci@127.0.0.1:5432/services_ci?schema=reporting
      REPORTING_INTEGRATION_ALLOW_MUTATION: 'true'
      REPORTING_TEST_RABBITMQ_ADMIN_URL: amqp://admin_ci:admin_ci@127.0.0.1:5672/winwidget
      REPORTING_TEST_RABBITMQ_URL: amqp://restricted_ci:restricted_ci@127.0.0.1:5672/winwidget
      IDENTITY_DATABASE_URL: postgresql://services_ci:services_ci@127.0.0.1:5432/services_ci?schema=identity
      IDENTITY_TEST_DATABASE_URL: postgresql://services_ci:services_ci@127.0.0.1:5432/services_ci?schema=identity
      IDENTITY_INTEGRATION_ALLOW_MUTATION: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify immutable revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/${{ matrix.app }}/pnpm-lock.yaml
      - name: Install ${{ matrix.app }}
        run: pnpm --dir "apps/${{ matrix.app }}" install --frozen-lockfile
      - name: Prepare shared RabbitMQ exchanges
        if: matrix.app != 'identity'
        run: >-
          pnpm --dir "apps/${{ matrix.app }}" exec node -e
          'const amqp=require("amqplib");
          (async()=>{const connection=await amqp.connect(process.env.RABBITMQ_URL);
          const channel=await connection.createChannel();
          await channel.assertExchange("winwidget.events","topic",{durable:true});
          await channel.assertExchange("winwidget.dead-letter","topic",{durable:true});
          await channel.close();await connection.close()})()
          .catch(error=>{console.error(error.message);process.exit(1)})'
      - name: Generate Prisma client
        run: pnpm --dir "apps/${{ matrix.app }}" run prisma:generate
      - name: Prepare service schema
        run: >-
          docker exec "${{ job.services.postgres.id }}"
          psql -U services_ci -d services_ci -v ON_ERROR_STOP=1
          -c "CREATE SCHEMA ${{ matrix.schema }} AUTHORIZATION services_ci"
      - name: Prepare restricted RabbitMQ user
        if: matrix.app != 'identity'
        env:
          INTEGRATION_APP: ${{ matrix.app }}
          RABBITMQ_CONTAINER_ID: ${{ job.services.rabbitmq.id }}
        run: |
          case "$INTEGRATION_APP" in
            campaigns)
              configure='^(winwidget\.events|winwidget\.dead-letter|winwidget\.campaigns\..*)$'
              write="$configure"
              read="$configure"
              ;;
            reporting)
              configure='^(winwidget\.events|winwidget\.dead-letter|winwidget\.reporting\..*)$'
              write="$configure"
              read="$configure"
              ;;
            notification-delivery)
              configure='^winwidget\..*$'
              write="$configure"
              read="$configure"
              ;;
            *)
              exit 1
              ;;
          esac
          docker exec "$RABBITMQ_CONTAINER_ID" rabbitmqctl add_user restricted_ci restricted_ci
          docker exec "$RABBITMQ_CONTAINER_ID" rabbitmqctl set_permissions \
            -p winwidget restricted_ci "$configure" "$write" "$read"
      - name: Prepare existing Identity user before workspace migration
        if: matrix.app == 'identity'
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          mkdir "$fixture/migrations"
          cp apps/identity/prisma/schema.prisma "$fixture/schema.prisma"
          cp apps/identity/prisma/migrations/migration_lock.toml "$fixture/migrations/migration_lock.toml"
          for migration in apps/identity/prisma/migrations/*; do
            if [ -d "$migration" ] && [[ "${migration##*/}" < '20260902080000_add_workspaces_and_refresh_rotation' ]]; then
              cp -R "$migration" "$fixture/migrations/"
            fi
          done
          pnpm --dir apps/identity exec prisma migrate deploy --schema "$fixture/schema.prisma"
          docker exec "$POSTGRES_CONTAINER_ID" psql \
            -U services_ci -d services_ci -v ON_ERROR_STOP=1 \
            -c "INSERT INTO identity.users (id, password, rights, created_at, updated_at) VALUES ('identity-pg18-existing-user', 'integration-only-hash', ARRAY['USER']::identity.\"Role\"[], CURRENT_TIMESTAMP, CURRENT_TIMESTAMP)"
      - name: Apply service migrations
        run: pnpm --dir "apps/${{ matrix.app }}" run prisma:migrate:deploy
      - name: Verify existing Identity user workspace backfill
        if: matrix.app == 'identity'
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          result="$(docker exec "$POSTGRES_CONTAINER_ID" psql \
            -U services_ci -d services_ci -At -v ON_ERROR_STOP=1 \
            -c "SELECT CASE WHEN (SELECT count(*) FROM identity.workspaces WHERE personal_owner_user_id = 'identity-pg18-existing-user' AND type = 'PERSONAL' AND status = 'ACTIVE') = 1 AND (SELECT count(*) FROM identity.workspace_members AS members JOIN identity.workspaces AS workspaces ON workspaces.id = members.workspace_id WHERE workspaces.personal_owner_user_id = 'identity-pg18-existing-user' AND members.user_id = 'identity-pg18-existing-user' AND members.role = 'OWNER' AND members.status = 'ACTIVE' AND members.id <> members.workspace_id) = 1 THEN 'ok' ELSE 'failed' END")"
          test "$result" = 'ok'
      - name: Build ${{ matrix.app }}
        run: pnpm --dir "apps/${{ matrix.app }}" run build
      - name: Run service integration
        run: pnpm --dir "apps/${{ matrix.app }}" run test:integration

  crm-migration-smoke:
    name: CRM PostgreSQL 18 migration / ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: billing
            schema: billing
            database: winwidget_billing_ci
            migration_role: winwidget_billing_migration_ci
            service_name: billing-service
          - app: crm-access
            schema: crm_access
            database: winwidget_crm_access_ci
            migration_role: winwidget_crm_access_migration_ci
            service_name: crm-access-service
          - app: crm-intake
            schema: crm_intake
            database: winwidget_crm_intake_ci
            migration_role: winwidget_crm_intake_migration_ci
            service_name: crm-intake-service
          - app: crm-customers
            schema: crm_customers
            database: winwidget_crm_customers_ci
            migration_role: winwidget_crm_customers_migration_ci
            service_name: crm-customers-service
          - app: crm-sales
            schema: crm_sales
            database: winwidget_crm_sales_ci
            migration_role: winwidget_crm_sales_migration_ci
            service_name: crm-sales-service
    services:
      postgres:
        image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_USER: crm_bootstrap_ci
          POSTGRES_PASSWORD: crm_bootstrap_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_bootstrap_ci -d postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      CRM_MIGRATION_ROLE_PASSWORD: crm_migration_role_ci_password
      BILLING_DATABASE_URL: 'postgresql://winwidget_billing_migration_ci:crm_migration_role_ci_password@127.0.0.1:5432/winwidget_billing_ci?schema=billing&sslmode=disable'
      CRM_ACCESS_DATABASE_URL: 'postgresql://winwidget_crm_access_migration_ci:crm_migration_role_ci_password@127.0.0.1:5432/winwidget_crm_access_ci?schema=crm_access&sslmode=disable'
      CRM_INTAKE_DATABASE_URL: 'postgresql://winwidget_crm_intake_migration_ci:crm_migration_role_ci_password@127.0.0.1:5432/winwidget_crm_intake_ci?schema=crm_intake&sslmode=disable'
      CRM_CUSTOMERS_DATABASE_URL: 'postgresql://winwidget_crm_customers_migration_ci:crm_migration_role_ci_password@127.0.0.1:5432/winwidget_crm_customers_ci?schema=crm_customers&sslmode=disable'
      CRM_SALES_DATABASE_URL: 'postgresql://winwidget_crm_sales_migration_ci:crm_migration_role_ci_password@127.0.0.1:5432/winwidget_crm_sales_ci?schema=crm_sales&sslmode=disable'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify immutable revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/${{ matrix.app }}/pnpm-lock.yaml
      - name: Install ${{ matrix.app }}
        run: pnpm --dir "apps/${{ matrix.app }}" install --frozen-lockfile
      - name: Prepare isolated database and migration role
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          DATABASE_NAME: ${{ matrix.database }}
          MIGRATION_ROLE: ${{ matrix.migration_role }}
          OWNED_SCHEMA: ${{ matrix.schema }}
        run: |
          [[ "$DATABASE_NAME" =~ ^[a-z0-9_]+$ ]]
          [[ "$MIGRATION_ROLE" =~ ^[a-z0-9_]+$ ]]
          [[ "$OWNED_SCHEMA" =~ ^[a-z0-9_]+$ ]]
          docker exec "$POSTGRES_CONTAINER_ID" psql \
            -U crm_bootstrap_ci -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE \"$MIGRATION_ROLE\" LOGIN PASSWORD '$CRM_MIGRATION_ROLE_PASSWORD' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS"
          docker exec "$POSTGRES_CONTAINER_ID" psql \
            -U crm_bootstrap_ci -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE \"$DATABASE_NAME\" OWNER crm_bootstrap_ci"
          docker exec "$POSTGRES_CONTAINER_ID" psql \
            -U crm_bootstrap_ci -d "$DATABASE_NAME" -v ON_ERROR_STOP=1 \
            -c "REVOKE ALL ON DATABASE \"$DATABASE_NAME\" FROM PUBLIC; GRANT CONNECT ON DATABASE \"$DATABASE_NAME\" TO \"$MIGRATION_ROLE\"; REVOKE ALL ON SCHEMA public FROM PUBLIC; CREATE SCHEMA \"$OWNED_SCHEMA\" AUTHORIZATION \"$MIGRATION_ROLE\"; CREATE SCHEMA foreign_service_guard AUTHORIZATION crm_bootstrap_ci; CREATE TABLE foreign_service_guard.sentinel (id INTEGER PRIMARY KEY); REVOKE ALL ON SCHEMA foreign_service_guard FROM PUBLIC; REVOKE ALL ON ALL TABLES IN SCHEMA foreign_service_guard FROM PUBLIC"
      - name: Generate Prisma client
        run: pnpm --dir "apps/${{ matrix.app }}" run prisma:generate
      - name: Apply migrations on PostgreSQL 18
        run: pnpm --dir "apps/${{ matrix.app }}" run prisma:migrate:deploy
      - name: Verify migration role and owned schema boundary
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          DATABASE_NAME: ${{ matrix.database }}
          MIGRATION_ROLE: ${{ matrix.migration_role }}
          OWNED_SCHEMA: ${{ matrix.schema }}
          SERVICE_NAME: ${{ matrix.service_name }}
        run: |
          [[ "$DATABASE_NAME" =~ ^[a-z0-9_]+$ ]]
          [[ "$MIGRATION_ROLE" =~ ^[a-z0-9_]+$ ]]
          [[ "$OWNED_SCHEMA" =~ ^[a-z0-9_]+$ ]]
          [[ "$SERVICE_NAME" =~ ^[a-z0-9-]+$ ]]
          result="$(docker exec -e PGPASSWORD="$CRM_MIGRATION_ROLE_PASSWORD" \
            "$POSTGRES_CONTAINER_ID" psql -h 127.0.0.1 \
            -U "$MIGRATION_ROLE" -d "$DATABASE_NAME" -At -v ON_ERROR_STOP=1 \
            -c "SELECT CASE WHEN current_database() = '$DATABASE_NAME' AND current_user = '$MIGRATION_ROLE' AND (SELECT pg_get_userbyid(datdba) = 'crm_bootstrap_ci' FROM pg_database WHERE datname = current_database()) AND (SELECT pg_get_userbyid(nspowner) = current_user FROM pg_namespace WHERE nspname = '$OWNED_SCHEMA') AND has_database_privilege(current_user, current_database(), 'CONNECT') AND NOT has_database_privilege(current_user, current_database(), 'CREATE') AND has_schema_privilege(current_user, '$OWNED_SCHEMA', 'USAGE') AND has_schema_privilege(current_user, '$OWNED_SCHEMA', 'CREATE') AND NOT has_schema_privilege(current_user, 'foreign_service_guard', 'USAGE') AND NOT has_schema_privilege(current_user, 'foreign_service_guard', 'CREATE') AND NOT (SELECT has_table_privilege(current_user, tables.oid, 'SELECT') FROM pg_class AS tables JOIN pg_namespace AS schemas ON schemas.oid = tables.relnamespace WHERE schemas.nspname = 'foreign_service_guard' AND tables.relname = 'sentinel') AND (SELECT count(*) FROM \"$OWNED_SCHEMA\".service_identity WHERE id = 'singleton' AND service_name = '$SERVICE_NAME' AND database_id IS NOT NULL) = 1 AND (SELECT count(*) FROM \"$OWNED_SCHEMA\"._prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL) > 0 AND NOT EXISTS (SELECT 1 FROM \"$OWNED_SCHEMA\"._prisma_migrations WHERE finished_at IS NULL OR rolled_back_at IS NOT NULL) AND (SELECT NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND NOT rolinherit AND rolcanlogin AND NOT rolreplication AND NOT rolbypassrls FROM pg_roles WHERE rolname = current_user) THEN 'ok' ELSE 'failed' END")"
          test "$result" = 'ok'
          if docker exec -e PGPASSWORD="$CRM_MIGRATION_ROLE_PASSWORD" \
            "$POSTGRES_CONTAINER_ID" psql -h 127.0.0.1 \
            -U "$MIGRATION_ROLE" -d "$DATABASE_NAME" -v ON_ERROR_STOP=1 \
            -c 'SELECT id FROM foreign_service_guard.sentinel' \
            >/dev/null 2>&1; then
            echo 'Migration role unexpectedly accessed a foreign schema.' >&2
            exit 1
          fi

