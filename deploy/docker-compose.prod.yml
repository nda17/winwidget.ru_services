      IDENTITY_POSTGRES_PORT: ${IDENTITY_POSTGRES_PORT:-55438}
      DATABASE_RESTORE_IDENTITY_ADMIN_PASSWORD_FILE: /run/secrets/database-restore-identity-admin-password
      PLATFORM_POSTGRES_ADMIN_USER: ${PLATFORM_POSTGRES_ADMIN_USER:?PLATFORM_POSTGRES_ADMIN_USER is required}
      PLATFORM_POSTGRES_PORT: ${PLATFORM_POSTGRES_PORT:-55439}
      DATABASE_RESTORE_PLATFORM_ADMIN_PASSWORD_FILE: /run/secrets/database-restore-platform-admin-password
      SUPPORT_POSTGRES_ADMIN_USER: ${SUPPORT_POSTGRES_ADMIN_USER:?SUPPORT_POSTGRES_ADMIN_USER is required}
      SUPPORT_POSTGRES_PORT: ${SUPPORT_POSTGRES_PORT:-55440}
      DATABASE_RESTORE_SUPPORT_ADMIN_PASSWORD_FILE: /run/secrets/database-restore-support-admin-password
    network_mode: host
    volumes:
      - type: bind
        source: ${DATABASE_RESTORE_STORAGE_DIR:?DATABASE_RESTORE_STORAGE_DIR is required}
        target: /var/lib/winwidget-operations/restores
    secrets:
