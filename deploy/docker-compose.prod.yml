services:
  notification-delivery-postgres:
    image: ${NOTIFICATION_DELIVERY_POSTGRES_IMAGE:?NOTIFICATION_DELIVERY_POSTGRES_IMAGE is required}
    profiles:
      - notification-delivery-database
    labels:
      com.winwidget.owner: notification-delivery
      com.winwidget.purpose: postgres
    environment:
      POSTGRES_DB: winwidget_notification_delivery
      POSTGRES_USER: ${NOTIFICATION_DELIVERY_POSTGRES_ADMIN_USER:?NOTIFICATION_DELIVERY_POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/notification-delivery-postgres-admin-password
      POSTGRES_INITDB_ARGS: --locale=C.UTF-8 --encoding=UTF8 --auth-host=scram-sha-256 --data-checksums
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - '127.0.0.1:${NOTIFICATION_DELIVERY_POSTGRES_PORT:?NOTIFICATION_DELIVERY_POSTGRES_PORT is required}:5432'
    volumes:
      - winwidget-notification-delivery-postgres-data:/var/lib/postgresql
    networks:
      - notification-delivery-postgres
    secrets:
      - notification-delivery-postgres-admin-password
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"'
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 60s
    shm_size: ${NOTIFICATION_DELIVERY_POSTGRES_SHM_SIZE:-256m}
    mem_limit: ${NOTIFICATION_DELIVERY_POSTGRES_MEMORY_LIMIT:-768m}
    mem_reservation: ${NOTIFICATION_DELIVERY_POSTGRES_MEMORY_RESERVATION:-256m}
    cpus: ${NOTIFICATION_DELIVERY_POSTGRES_CPUS:-1.0}
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    restart: unless-stopped

  campaigns-postgres:
    image: ${CAMPAIGNS_POSTGRES_IMAGE:?CAMPAIGNS_POSTGRES_IMAGE is required}
    profiles:
      - campaigns-database
    labels:
      com.winwidget.owner: campaigns
      com.winwidget.purpose: postgres
    environment:
      POSTGRES_DB: winwidget_campaigns
      POSTGRES_USER: ${CAMPAIGNS_POSTGRES_ADMIN_USER:?CAMPAIGNS_POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/campaigns-postgres-admin-password
      POSTGRES_INITDB_ARGS: --locale=C.UTF-8 --encoding=UTF8 --auth-host=scram-sha-256 --data-checksums
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - '127.0.0.1:${CAMPAIGNS_POSTGRES_PORT:?CAMPAIGNS_POSTGRES_PORT is required}:5432'
    volumes:
      - winwidget-campaigns-postgres-data:/var/lib/postgresql
    networks:
      - campaigns-postgres
    secrets:
      - campaigns-postgres-admin-password
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"'
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 60s
    shm_size: ${CAMPAIGNS_POSTGRES_SHM_SIZE:-256m}
    mem_limit: ${CAMPAIGNS_POSTGRES_MEMORY_LIMIT:-768m}
    mem_reservation: ${CAMPAIGNS_POSTGRES_MEMORY_RESERVATION:-256m}
    cpus: ${CAMPAIGNS_POSTGRES_CPUS:-1.0}
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    restart: unless-stopped

  reporting-postgres:
    image: ${REPORTING_POSTGRES_IMAGE:?REPORTING_POSTGRES_IMAGE is required}
    profiles:
      - reporting-database
    labels:
      com.winwidget.owner: reporting
      com.winwidget.purpose: postgres
    environment:
      POSTGRES_DB: winwidget_reporting
      POSTGRES_USER: ${REPORTING_POSTGRES_ADMIN_USER:?REPORTING_POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/reporting-postgres-admin-password
      POSTGRES_INITDB_ARGS: --locale=C.UTF-8 --encoding=UTF8 --auth-host=scram-sha-256 --data-checksums
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - '127.0.0.1:${REPORTING_POSTGRES_PORT:?REPORTING_POSTGRES_PORT is required}:5432'
    volumes:
      - winwidget-reporting-postgres-data:/var/lib/postgresql
    networks:
      - reporting-postgres
    secrets:
      - reporting-postgres-admin-password
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"'
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 60s
    shm_size: ${REPORTING_POSTGRES_SHM_SIZE:-256m}
    mem_limit: ${REPORTING_POSTGRES_MEMORY_LIMIT:-768m}
    mem_reservation: ${REPORTING_POSTGRES_MEMORY_RESERVATION:-256m}
    cpus: ${REPORTING_POSTGRES_CPUS:-1.0}
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    hostname: winwidget-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-winwidget}
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - winwidget-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    image: winwidget-api:${APP_VERSION:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${APP_REVISION:-unknown}
    environment: *api-env
    network_mode: host
    volumes:
      - type: bind
        source: ${DATABASE_RESTORE_STORAGE_DIR:?DATABASE_RESTORE_STORAGE_DIR is required}
        target: /var/lib/winwidget/database-restores
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||4200)+'/api/v1/health/ready').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s
    restart: unless-stopped

  api-gateway:
    image: winwidget-api-gateway:${APP_VERSION:-latest}
    build:
      context: ../apps/api-gateway
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${APP_REVISION:-unknown}
    environment: *api-gateway-env
    network_mode: host
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||4100)+'/health/ready').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 15s
    restart: unless-stopped

  outbox-publisher:
    image: winwidget-api:${APP_VERSION:-latest}
    environment: *outbox-publisher-env
    network_mode: host
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: ['node', 'dist/src/outbox-publisher-main.js']
    stop_grace_period: 30s
    restart: unless-stopped

  integration-worker:
    image: winwidget-api:${APP_VERSION:-latest}
    environment: *integration-worker-env
    network_mode: host
    depends_on:
      rabbitmq:
        condition: service_healthy
      outbox-publisher:
        condition: service_started
    command: ['node', 'dist/src/integration-worker-main.js']
    stop_grace_period: 30s
    restart: unless-stopped

  notification-delivery-worker:
    image: ${NOTIFICATION_DELIVERY_IMAGE:?NOTIFICATION_DELIVERY_IMAGE is required}
    build:
      context: ../apps/notification-delivery
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${NOTIFICATION_DELIVERY_REVISION:?NOTIFICATION_DELIVERY_REVISION is required}
    environment: *notification-delivery-env
    network_mode: host
    depends_on:
      rabbitmq:
        condition: service_healthy
      outbox-publisher:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.NOTIFICATION_DELIVERY_HEALTH_PORT||4401)+'/health/ready').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s
    restart: unless-stopped

  campaigns-service:
    image: ${CAMPAIGNS_IMAGE:?CAMPAIGNS_IMAGE is required}
    build:
      context: ../apps/campaigns
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${CAMPAIGNS_REVISION:?CAMPAIGNS_REVISION is required}
    environment: *campaigns-env
    network_mode: host
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.CAMPAIGNS_HEALTH_PORT||4500)+'/health/ready').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s
    restart: unless-stopped

  reporting-service:
    image: ${REPORTING_IMAGE:?REPORTING_IMAGE is required}
    build:
      context: ../apps/reporting
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${REPORTING_REVISION:?REPORTING_REVISION is required}
    environment: *reporting-env
    network_mode: host
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.REPORTING_PORT||4600)+'/health/ready').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    # The all-role process drains scheduler, consumers, Outbox, RabbitMQ and
    # Prisma hooks. Keep a margin above their bounded aggregate shutdown time.
    stop_grace_period: 90s
    restart: unless-stopped
    mem_limit: ${REPORTING_MEMORY_LIMIT:-512m}
    mem_reservation: ${REPORTING_MEMORY_RESERVATION:-128m}
    cpus: ${REPORTING_CPUS:-0.75}
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  maintenance-worker:
    image: ${MAINTENANCE_IMAGE:-winwidget-maintenance:latest}
    build:
      context: ..
      dockerfile: Dockerfile
      target: maintenance-runner
      args:
        APP_REVISION: ${MAINTENANCE_REVISION:-${APP_REVISION:-unknown}}
    environment: *maintenance-worker-env
    network_mode: host
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      rabbitmq:
        condition: service_healthy
      outbox-publisher:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.MAINTENANCE_HEALTH_PORT||4300)+'/health/ready').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s
    restart: unless-stopped

  database-restore-worker:
    image: ${DATABASE_RESTORE_IMAGE:?DATABASE_RESTORE_IMAGE is required}
    build:
      context: ..
      dockerfile: Dockerfile
      target: database-restore-runner
      args:
        APP_REVISION: ${DATABASE_RESTORE_REVISION:?DATABASE_RESTORE_REVISION is required}
    labels:
      com.winwidget.owner: maintenance
      com.winwidget.purpose: database-restore-worker
    environment: *database-restore-worker-env
    network_mode: host
    volumes:
      - type: bind
        source: ${DATABASE_RESTORE_STORAGE_DIR:?DATABASE_RESTORE_STORAGE_DIR is required}
        target: /var/lib/winwidget/database-restores
    secrets:
      - source: core-postgres-admin-password
        target: database-restore-core-admin-password
      - source: notification-delivery-postgres-admin-password
        target: database-restore-notification-delivery-admin-password
      - source: campaigns-postgres-admin-password
        target: database-restore-campaigns-admin-password
      - source: reporting-postgres-admin-password
        target: database-restore-reporting-admin-password
    tmpfs:
      - /run/database-restore-secrets:rw,noexec,nosuid,nodev,size=64k,mode=0700
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - KILL
      - SETGID
      - SETUID
    healthcheck:
      test:
        [
          'CMD',
          'su-exec',
          'nestjs:nodejs',
          'node',
          '-e',
          'const fs=require(''node:fs'');const root=''/var/lib/winwidget/database-restores'';const v=JSON.parse(fs.readFileSync(root+''/worker-ready.json'',''utf8''));const fences=fs.readdirSync(root+''/fences'').filter(name=>name.endsWith(''.json''));if(v.version!==1||v.revision!==process.env.APP_REVISION||JSON.stringify(v.targets)!==''["campaigns","core","notification-delivery","reporting"]''||fences.length!==0)process.exit(1)'
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 45s
    restart: unless-stopped
    mem_limit: ${DATABASE_RESTORE_MEMORY_LIMIT:-256m}
    mem_reservation: ${DATABASE_RESTORE_MEMORY_RESERVATION:-64m}
    cpus: ${DATABASE_RESTORE_CPUS:-0.5}
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  migrate:
    image: winwidget-api:${APP_VERSION:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${APP_REVISION:-unknown}
    profiles:
      - migration
    environment: *migration-env
    network_mode: host
    entrypoint: ['./node_modules/.bin/prisma']
    command: ['migrate', 'deploy']

  notification-delivery-migrate:
    image: ${NOTIFICATION_DELIVERY_IMAGE:?NOTIFICATION_DELIVERY_IMAGE is required}
    build:
      context: ../apps/notification-delivery
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${NOTIFICATION_DELIVERY_REVISION:?NOTIFICATION_DELIVERY_REVISION is required}
    profiles:
      - notification-delivery-migration
    environment: *notification-delivery-migration-env
    network_mode: host
    entrypoint: ['./node_modules/.bin/prisma']
    command: ['migrate', 'deploy', '--schema', 'prisma/schema.prisma']

  campaigns-migrate:
    image: ${CAMPAIGNS_IMAGE:?CAMPAIGNS_IMAGE is required}
    build:
      context: ../apps/campaigns
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${CAMPAIGNS_REVISION:?CAMPAIGNS_REVISION is required}
    profiles:
      - campaigns-migration
    environment: *campaigns-migration-env
    network_mode: host
    entrypoint: ['./node_modules/.bin/prisma']
    command: ['migrate', 'deploy', '--schema', 'prisma/schema.prisma']

  reporting-migrate:
    image: ${REPORTING_IMAGE:?REPORTING_IMAGE is required}
    build:
      context: ../apps/reporting
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${REPORTING_REVISION:?REPORTING_REVISION is required}
    profiles:
      - reporting-migration
    environment: *reporting-migration-env
    network_mode: host
    entrypoint: ['./node_modules/.bin/prisma']
    command: ['migrate', 'deploy', '--schema', 'prisma/schema.prisma']

volumes:
  winwidget-reporting-postgres-data:
    external: true
    name: ${REPORTING_POSTGRES_DATA_VOLUME:?REPORTING_POSTGRES_DATA_VOLUME must name the verified Reporting PostgreSQL volume}
  winwidget-campaigns-postgres-data:
    external: true
    name: ${CAMPAIGNS_POSTGRES_DATA_VOLUME:?CAMPAIGNS_POSTGRES_DATA_VOLUME must name the verified Campaigns PostgreSQL volume}
  winwidget-notification-delivery-postgres-data:
    external: true
    name: ${NOTIFICATION_DELIVERY_POSTGRES_DATA_VOLUME:?NOTIFICATION_DELIVERY_POSTGRES_DATA_VOLUME must name the verified Notification Delivery PostgreSQL volume}
  winwidget-rabbitmq-data:
    external: true
    name: ${RABBITMQ_DATA_VOLUME:?RABBITMQ_DATA_VOLUME must name the verified existing RabbitMQ volume}

networks:
  reporting-postgres:
    name: winwidget-reporting-postgres
    driver: bridge
    internal: false
    labels:
      com.winwidget.owner: reporting
      com.winwidget.purpose: postgres-network
  campaigns-postgres:
    name: winwidget-campaigns-postgres
    driver: bridge
    internal: false
    labels:
      com.winwidget.owner: campaigns
      com.winwidget.purpose: postgres-network
  notification-delivery-postgres:
    name: winwidget-notification-delivery-postgres
    driver: bridge
    internal: false
    labels:
      com.winwidget.owner: notification-delivery
      com.winwidget.purpose: postgres-network

secrets:
  core-postgres-admin-password:
    file: ${CORE_POSTGRES_ADMIN_PASSWORD_FILE:?CORE_POSTGRES_ADMIN_PASSWORD_FILE is required}
  reporting-postgres-admin-password:
    file: ${REPORTING_POSTGRES_ADMIN_PASSWORD_FILE:?REPORTING_POSTGRES_ADMIN_PASSWORD_FILE is required}
  campaigns-postgres-admin-password:
    file: ${CAMPAIGNS_POSTGRES_ADMIN_PASSWORD_FILE:?CAMPAIGNS_POSTGRES_ADMIN_PASSWORD_FILE is required}
  notification-delivery-postgres-admin-password:
    file: ${NOTIFICATION_DELIVERY_POSTGRES_ADMIN_PASSWORD_FILE:?NOTIFICATION_DELIVERY_POSTGRES_ADMIN_PASSWORD_FILE is required}
