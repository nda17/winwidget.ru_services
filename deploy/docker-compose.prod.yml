services:
  notification-delivery-postgres:
    image: ${NOTIFICATION_DELIVERY_POSTGRES_IMAGE:?NOTIFICATION_DELIVERY_POSTGRES_IMAGE is required}
    profiles:
      - notification-delivery-database
    labels:
      com.winwidget.owner: notification-delivery
      com.winwidget.purpose: postgres
    environment:
      POSTGRES_DB: winwidget_notification_delivery
      POSTGRES_USER: ${NOTIFICATION_DELIVERY_POSTGRES_ADMIN_USER:?NOTIFICATION_DELIVERY_POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/notification-delivery-postgres-admin-password
      POSTGRES_INITDB_ARGS: --locale=C.UTF-8 --encoding=UTF8 --auth-host=scram-sha-256 --data-checksums
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - '127.0.0.1:${NOTIFICATION_DELIVERY_POSTGRES_PORT:?NOTIFICATION_DELIVERY_POSTGRES_PORT is required}:5432'
    volumes:
      - winwidget-notification-delivery-postgres-data:/var/lib/postgresql
    networks:
      - notification-delivery-postgres
    secrets:
      - notification-delivery-postgres-admin-password
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"'
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 60s
    shm_size: ${NOTIFICATION_DELIVERY_POSTGRES_SHM_SIZE:-256m}
