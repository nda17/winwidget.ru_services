      retries: 12
      start_period: 10s
    stop_grace_period: 60s
    shm_size: ${IDENTITY_POSTGRES_SHM_SIZE:-256m}
    mem_limit: ${IDENTITY_POSTGRES_MEMORY_LIMIT:-768m}
    mem_reservation: ${IDENTITY_POSTGRES_MEMORY_RESERVATION:-256m}
    cpus: ${IDENTITY_POSTGRES_CPUS:-1.0}
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    hostname: winwidget-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-winwidget}
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - winwidget-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    image: winwidget-api:${APP_VERSION:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${APP_REVISION:-unknown}
    environment: *api-env
    network_mode: host
    volumes:
      - type: bind
        source: ${DATABASE_RESTORE_STORAGE_DIR:?DATABASE_RESTORE_STORAGE_DIR is required}
        target: /var/lib/winwidget/database-restores
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||4200)+'/api/v1/health/ready').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s
    restart: unless-stopped

  api-gateway:
    image: winwidget-api-gateway:${APP_VERSION:-latest}
    build:
      context: ../apps/api-gateway
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${APP_REVISION:-unknown}
    environment: *api-gateway-env
    network_mode: host
    depends_on:
      api:
        condition: service_healthy
      widgets-service:
        condition: service_healthy
      identity-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||4100)+'/health/ready').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 15s
    restart: unless-stopped

  outbox-publisher:
    image: winwidget-api:${APP_VERSION:-latest}
    environment: *outbox-publisher-env
    network_mode: host
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: ['node', 'dist/src/outbox-publisher-main.js']
    stop_grace_period: 30s
    restart: unless-stopped

  integration-worker:
    image: winwidget-api:${APP_VERSION:-latest}
    environment: *integration-worker-env
    network_mode: host
    depends_on:
      rabbitmq:
        condition: service_healthy
      outbox-publisher:
        condition: service_started
    command: ['node', 'dist/src/integration-worker-main.js']
    stop_grace_period: 30s
    restart: unless-stopped

  notification-delivery-worker:
    image: ${NOTIFICATION_DELIVERY_IMAGE:?NOTIFICATION_DELIVERY_IMAGE is required}
    build:
      context: ../apps/notification-delivery
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${NOTIFICATION_DELIVERY_REVISION:?NOTIFICATION_DELIVERY_REVISION is required}
    environment: *notification-delivery-env
    network_mode: host
    depends_on:
      rabbitmq:
        condition: service_healthy
      outbox-publisher:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.NOTIFICATION_DELIVERY_HEALTH_PORT||4401)+'/health/ready').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s
    restart: unless-stopped

  campaigns-service:
    image: ${CAMPAIGNS_IMAGE:?CAMPAIGNS_IMAGE is required}
    build:
      context: ../apps/campaigns
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${CAMPAIGNS_REVISION:?CAMPAIGNS_REVISION is required}
    environment: *campaigns-env
    network_mode: host
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.CAMPAIGNS_HEALTH_PORT||4500)+'/health/ready').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s
    restart: unless-stopped

  reporting-service:
    image: ${REPORTING_IMAGE:?REPORTING_IMAGE is required}
    build:
      context: ../apps/reporting
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${REPORTING_REVISION:?REPORTING_REVISION is required}
    environment: *reporting-env
    network_mode: host
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.REPORTING_PORT||4600)+'/health/ready').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    # The all-role process drains scheduler, consumers, Outbox, RabbitMQ and
    # Prisma hooks. Keep a margin above their bounded aggregate shutdown time.
    stop_grace_period: 90s
    restart: unless-stopped
    mem_limit: ${REPORTING_MEMORY_LIMIT:-512m}
    mem_reservation: ${REPORTING_MEMORY_RESERVATION:-128m}
    cpus: ${REPORTING_CPUS:-0.75}
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  widgets-service:
    image: ${WIDGETS_IMAGE:?WIDGETS_IMAGE is required}
    build:
      context: ..
      dockerfile: apps/widgets/Dockerfile
      args:
        APP_REVISION: ${WIDGETS_REVISION:?WIDGETS_REVISION is required}
    environment: *widgets-env
    network_mode: host
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.WIDGETS_PORT||4700)+'/health/ready').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 90s
    restart: unless-stopped
    mem_limit: ${WIDGETS_MEMORY_LIMIT:-512m}
    mem_reservation: ${WIDGETS_MEMORY_RESERVATION:-128m}
    cpus: ${WIDGETS_CPUS:-0.75}
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  billing-api:
    image: ${BILLING_IMAGE:?BILLING_IMAGE is required}
    build:
      context: ../apps/billing
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${BILLING_REVISION:?BILLING_REVISION is required}
    environment:
      <<: *billing-env
      BILLING_PROCESS_ROLE: api
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      TRUST_PROXY: ${TRUST_PROXY:-loopback}
      BILLING_CORE_INTERNAL_BASE_URL: ${BILLING_CORE_INTERNAL_BASE_URL:-http://127.0.0.1:4200}
      BILLING_INTERNAL_TOKEN: ${BILLING_INTERNAL_TOKEN:?BILLING_INTERNAL_TOKEN is required}
      BILLING_CAMPAIGNS_TOKEN: ${BILLING_CAMPAIGNS_TOKEN:?BILLING_CAMPAIGNS_TOKEN is required}
      BILLING_IDENTITY_TOKEN: ${BILLING_IDENTITY_TOKEN:?BILLING_IDENTITY_TOKEN is required}
      BILLING_INTERNAL_TIMEOUT_MS: ${BILLING_INTERNAL_TIMEOUT_MS:-10000}
      WIDGETS_INTERNAL_BASE_URL: ${WIDGETS_INTERNAL_BASE_URL:-http://127.0.0.1:4700}
      WIDGETS_INTERNAL_TOKEN: ${WIDGETS_INTERNAL_TOKEN:?WIDGETS_INTERNAL_TOKEN is required}
      WIDGETS_INTERNAL_TIMEOUT_MS: ${WIDGETS_INTERNAL_TIMEOUT_MS:-5000}
      IDENTITY_INTERNAL_BASE_URL: ${IDENTITY_INTERNAL_BASE_URL:-http://127.0.0.1:4900}
      IDENTITY_BILLING_TOKEN: ${IDENTITY_BILLING_TOKEN:?IDENTITY_BILLING_TOKEN is required}
      IDENTITY_INTERNAL_TIMEOUT_MS: ${IDENTITY_INTERNAL_TIMEOUT_MS:-5000}
    network_mode: host
    command: ['node', 'dist/src/main.js']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.BILLING_API_PORT||4800)+'/health/ready').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped
    mem_limit: ${BILLING_API_MEMORY_LIMIT:-512m}
    mem_reservation: ${BILLING_API_MEMORY_RESERVATION:-128m}
    cpus: ${BILLING_API_CPUS:-0.75}
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  billing-scheduler:
    image: ${BILLING_IMAGE:?BILLING_IMAGE is required}
    environment:
      <<: *billing-env
      BILLING_PROCESS_ROLE: scheduler
    network_mode: host
    command: ['node', 'dist/src/main.js']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
