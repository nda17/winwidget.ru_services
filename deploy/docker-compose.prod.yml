  identity-postgres:
    image: ${IDENTITY_POSTGRES_IMAGE:?IDENTITY_POSTGRES_IMAGE is required}
    profiles:
      - identity-database
    labels:
      com.winwidget.owner: identity
      com.winwidget.purpose: postgres
    environment:
      POSTGRES_DB: winwidget_identity
      POSTGRES_USER: ${IDENTITY_POSTGRES_ADMIN_USER:?IDENTITY_POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/identity-postgres-admin-password
      POSTGRES_INITDB_ARGS: --locale=C.UTF-8 --encoding=UTF8 --auth-host=scram-sha-256 --data-checksums
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - '127.0.0.1:${IDENTITY_POSTGRES_PORT:-55438}:5432'
    volumes:
      - winwidget-identity-postgres-data:/var/lib/postgresql
    networks:
      - identity-postgres
    secrets:
      - identity-postgres-admin-password
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"'
        ]
      interval: 10s
