  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
  GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
  YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID}
  YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET}
  YANDEX_CALLBACK_URL: ${YANDEX_CALLBACK_URL}
  VK_CLIENT_ID: ${VK_CLIENT_ID:-}
  VK_CLIENT_SECRET: ${VK_CLIENT_SECRET:-}
  VK_SERVICE_TOKEN: ${VK_SERVICE_TOKEN:-}
  VK_CALLBACK_URL: ${VK_CALLBACK_URL:-}
  YOOKASSA_PRODUCTION_SHOP_ID: ${YOOKASSA_PRODUCTION_SHOP_ID}
  YOOKASSA_PRODUCTION_SECRET_KEY: ${YOOKASSA_PRODUCTION_SECRET_KEY}
