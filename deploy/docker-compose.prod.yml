  S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.twcstorage.ru}
  S3_REGION: ${S3_REGION:-ru-1}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
  S3_KEY_PREFIX: ${S3_KEY_PREFIX:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  RABBITMQ_MANAGEMENT_URL: ${RABBITMQ_MANAGEMENT_URL:-http://127.0.0.1:15672}
  RABBITMQ_MONITOR_USER: ${RABBITMQ_MONITOR_USER}
  RABBITMQ_MONITOR_PASSWORD: ${RABBITMQ_MONITOR_PASSWORD}
