  NOTIFICATION_DELIVERY_INTERNAL_TIMEOUT_MS: ${NOTIFICATION_DELIVERY_INTERNAL_TIMEOUT_MS:-5000}

x-api-gateway-env: &api-gateway-env
  APP_REVISION: ${APP_REVISION:-unknown}
  NODE_ENV: production
  GATEWAY_LISTEN_HOST: ${GATEWAY_LISTEN_HOST:-127.0.0.1}
  PORT: ${GATEWAY_PORT:-4100}
  GATEWAY_ROUTES_JSON: ${GATEWAY_ROUTES_JSON:?GATEWAY_ROUTES_JSON is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://winwidget.ru,https://www.winwidget.ru}
  JWT_JWKS_URL: ${JWT_JWKS_URL:-http://127.0.0.1:4200/api/v1/auth/.well-known/jwks.json}
  JWT_ISSUER: ${JWT_ISSUER}
  JWT_AUDIENCE: ${JWT_AUDIENCE}
  JWT_CLOCK_TOLERANCE_SECONDS: ${JWT_CLOCK_TOLERANCE_SECONDS:-5}
  JWT_MAX_TOKEN_LIFETIME_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
  JWT_MAX_TOKEN_BYTES: ${JWT_MAX_TOKEN_BYTES:-16384}
  JWKS_FETCH_TIMEOUT_MS: ${JWKS_FETCH_TIMEOUT_MS:-3000}
  JWKS_REFRESH_MIN_INTERVAL_MS: ${JWKS_REFRESH_MIN_INTERVAL_MS:-5000}
  JWKS_CACHE_TTL_MS: ${JWKS_CACHE_TTL_MS:-300000}
  JWKS_MAX_STALE_MS: ${JWKS_MAX_STALE_MS:-3600000}
  JWKS_MAX_BYTES: ${JWKS_MAX_BYTES:-262144}
  SHUTDOWN_GRACE_MS: ${GATEWAY_SHUTDOWN_GRACE_MS:-10000}

x-integration-worker-env: &integration-worker-env
  <<: [*runtime-env, *smtp-env]
  TELEGRAM_INFO_BOT_TOKEN: ${TELEGRAM_INFO_BOT_TOKEN}
  RABBITMQ_URL: ${RABBITMQ_INTEGRATION_WORKER_URL}
  RABBITMQ_CONNECTION_NAME: winwidget-integration-worker
  RABBITMQ_ASSERT_TOPOLOGY: 'false'
  RABBITMQ_MAX_MESSAGE_BYTES: ${RABBITMQ_MAX_MESSAGE_BYTES:-262144}
  RABBITMQ_WORKER_PREFETCH: ${RABBITMQ_WORKER_PREFETCH:-10}
  MESSAGING_SERVICE_NAME: integration-worker
  INTEGRATION_WORKER_KINDS: ${INTEGRATION_WORKER_KINDS:-webhook,bitrix24,amo-crm,payment-telegram,mailing-email,mailing-telegram,limit-telegram,daily-summary-telegram}
  INTEGRATION_RECEIPT_RETENTION_DAYS: ${INTEGRATION_RECEIPT_RETENTION_DAYS:-90}
  INTEGRATION_FAILURE_DETAIL_RETENTION_DAYS: ${INTEGRATION_FAILURE_DETAIL_RETENTION_DAYS:-30}
  SCHEDULED_JOB_LEASE_MS: ${SCHEDULED_JOB_LEASE_MS:-120000}
  SCHEDULED_JOB_LEASE_RENEW_INTERVAL_MS: ${SCHEDULED_JOB_LEASE_RENEW_INTERVAL_MS:-30000}
  MAILING_EMAIL_RATE_PER_SECOND: ${MAILING_EMAIL_RATE_PER_SECOND:-5}
  MAILING_TELEGRAM_RATE_PER_SECOND: ${MAILING_TELEGRAM_RATE_PER_SECOND:-10}

x-notification-delivery-env: &notification-delivery-env
  <<: *smtp-env
  APP_REVISION: ${NOTIFICATION_DELIVERY_REVISION:?NOTIFICATION_DELIVERY_REVISION is required}
  MODE: ${MODE:-production}
  NODE_ENV: production
  NOTIFICATION_DELIVERY_DATABASE_URL: ${NOTIFICATION_DELIVERY_DATABASE_URL:?NOTIFICATION_DELIVERY_DATABASE_URL is required}
  NOTIFICATION_DELIVERY_INTERNAL_TOKEN: ${NOTIFICATION_DELIVERY_INTERNAL_TOKEN:?NOTIFICATION_DELIVERY_INTERNAL_TOKEN is required}
  NOTIFICATION_DELIVERY_LISTEN_HOST: ${NOTIFICATION_DELIVERY_LISTEN_HOST:-127.0.0.1}
  TELEGRAM_INFO_BOT_TOKEN: ${TELEGRAM_INFO_BOT_TOKEN}
  RABBITMQ_URL: ${RABBITMQ_NOTIFICATION_DELIVERY_URL:?RABBITMQ_NOTIFICATION_DELIVERY_URL is required}
  RABBITMQ_CONNECTION_NAME: winwidget-notification-delivery-worker
  RABBITMQ_ASSERT_TOPOLOGY: 'false'
  RABBITMQ_MAX_MESSAGE_BYTES: ${RABBITMQ_MAX_MESSAGE_BYTES:-262144}
  MESSAGING_SERVICE_NAME: notification-delivery-worker
  NOTIFICATION_DELIVERY_HEALTH_PORT: ${NOTIFICATION_DELIVERY_HEALTH_PORT:-4401}
  NOTIFICATION_DELIVERY_PREFETCH: ${NOTIFICATION_DELIVERY_PREFETCH:-5}
  NOTIFICATION_DELIVERY_KINDS: ${NOTIFICATION_DELIVERY_KINDS:-email,telegram,payment-email,limit-email}
  NOTIFICATION_DELIVERY_RECEIPT_RETENTION_DAYS: ${NOTIFICATION_DELIVERY_RECEIPT_RETENTION_DAYS:-90}
  NOTIFICATION_DELIVERY_FAILURE_DETAIL_RETENTION_DAYS: ${NOTIFICATION_DELIVERY_FAILURE_DETAIL_RETENTION_DAYS:-30}

x-maintenance-worker-env: &maintenance-worker-env
  <<: *runtime-env
  APP_REVISION: ${MAINTENANCE_REVISION:-${APP_REVISION:-unknown}}
  DATABASE_URL_PRODUCTION: ${MAINTENANCE_DATABASE_URL_PRODUCTION:?MAINTENANCE_DATABASE_URL_PRODUCTION is required}
  DATABASE_BACKUP_URL: ${DATABASE_BACKUP_URL:?DATABASE_BACKUP_URL is required}
  TELEGRAM_INFO_BOT_TOKEN: ${TELEGRAM_INFO_BOT_TOKEN}
  RABBITMQ_URL: ${RABBITMQ_MAINTENANCE_WORKER_URL}
  RABBITMQ_CONNECTION_NAME: winwidget-maintenance-worker
  RABBITMQ_ASSERT_TOPOLOGY: 'false'
  RABBITMQ_MAX_MESSAGE_BYTES: ${RABBITMQ_MAX_MESSAGE_BYTES:-262144}
  MAINTENANCE_WORKER_PREFETCH: ${MAINTENANCE_WORKER_PREFETCH:-1}
  MAINTENANCE_HEALTH_PORT: ${MAINTENANCE_HEALTH_PORT:-4300}
  MESSAGING_SERVICE_NAME: maintenance-worker
  MAINTENANCE_WORKER_KINDS: ${MAINTENANCE_WORKER_KINDS:-database-backup}
  SCHEDULED_JOB_POLL_INTERVAL_MS: ${SCHEDULED_JOB_POLL_INTERVAL_MS:-30000}
  SCHEDULED_JOB_LEASE_MS: ${SCHEDULED_JOB_LEASE_MS:-120000}
  SCHEDULED_JOB_LEASE_RENEW_INTERVAL_MS: ${SCHEDULED_JOB_LEASE_RENEW_INTERVAL_MS:-30000}

x-outbox-publisher-env: &outbox-publisher-env
  <<: *runtime-env
  RABBITMQ_URL: ${RABBITMQ_PUBLISHER_URL}
  RABBITMQ_CONNECTION_NAME: winwidget-outbox-publisher
  RABBITMQ_ASSERT_TOPOLOGY: 'true'
  RABBITMQ_MAX_MESSAGE_BYTES: ${RABBITMQ_MAX_MESSAGE_BYTES:-262144}
  MESSAGING_SERVICE_NAME: outbox-publisher
  OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
  OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
  OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-7}

x-migration-env: &migration-env
  APP_REVISION: ${APP_REVISION:-unknown}
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_MIGRATION_URL_PRODUCTION:?DATABASE_MIGRATION_URL_PRODUCTION is required}

x-notification-delivery-migration-env: &notification-delivery-migration-env
  APP_REVISION: ${NOTIFICATION_DELIVERY_REVISION:?NOTIFICATION_DELIVERY_REVISION is required}
  NODE_ENV: production
  NOTIFICATION_DELIVERY_DATABASE_URL: ${NOTIFICATION_DELIVERY_MIGRATION_URL_PRODUCTION:?NOTIFICATION_DELIVERY_MIGRATION_URL_PRODUCTION is required}

services:
  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    hostname: winwidget-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-winwidget}
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - winwidget-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    image: winwidget-api:${APP_VERSION:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${APP_REVISION:-unknown}
    environment: *api-env
    network_mode: host
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||4200)+'/api/v1/health/ready').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s
    restart: unless-stopped

  api-gateway:
    image: winwidget-api-gateway:${APP_VERSION:-latest}
    build:
      context: ../apps/api-gateway
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${APP_REVISION:-unknown}
    environment: *api-gateway-env
    network_mode: host
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||4100)+'/health/ready').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 15s
    restart: unless-stopped

  outbox-publisher:
    image: winwidget-api:${APP_VERSION:-latest}
    environment: *outbox-publisher-env
    network_mode: host
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: ['node', 'dist/src/outbox-publisher-main.js']
    stop_grace_period: 30s
    restart: unless-stopped

  integration-worker:
    image: winwidget-api:${APP_VERSION:-latest}
    environment: *integration-worker-env
    network_mode: host
    depends_on:
      rabbitmq:
        condition: service_healthy
      outbox-publisher:
        condition: service_started
    command: ['node', 'dist/src/integration-worker-main.js']
    stop_grace_period: 30s
    restart: unless-stopped

  notification-delivery-worker:
    image: ${NOTIFICATION_DELIVERY_IMAGE:?NOTIFICATION_DELIVERY_IMAGE is required}
    build:
      context: ../apps/notification-delivery
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${NOTIFICATION_DELIVERY_REVISION:?NOTIFICATION_DELIVERY_REVISION is required}
    environment: *notification-delivery-env
    network_mode: host
    depends_on:
      rabbitmq:
        condition: service_healthy
      outbox-publisher:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.NOTIFICATION_DELIVERY_HEALTH_PORT||4401)+'/health/ready').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s
    restart: unless-stopped

  maintenance-worker:
    image: ${MAINTENANCE_IMAGE:-winwidget-maintenance:latest}
    build:
      context: ..
      dockerfile: Dockerfile
      target: maintenance-runner
      args:
        APP_REVISION: ${MAINTENANCE_REVISION:-${APP_REVISION:-unknown}}
    environment: *maintenance-worker-env
    network_mode: host
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      rabbitmq:
        condition: service_healthy
      outbox-publisher:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.MAINTENANCE_HEALTH_PORT||4300)+'/health/ready').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s
    restart: unless-stopped

  migrate:
    image: winwidget-api:${APP_VERSION:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${APP_REVISION:-unknown}
    profiles:
      - migration
    environment: *migration-env
    entrypoint: ['./node_modules/.bin/prisma']
    command: ['migrate', 'deploy']

  notification-delivery-migrate:
    image: ${NOTIFICATION_DELIVERY_IMAGE:?NOTIFICATION_DELIVERY_IMAGE is required}
    build:
      context: ../apps/notification-delivery
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${NOTIFICATION_DELIVERY_REVISION:?NOTIFICATION_DELIVERY_REVISION is required}
    profiles:
      - notification-delivery-migration
    environment: *notification-delivery-migration-env
    entrypoint: ['./node_modules/.bin/prisma']
    command:
      [
        'migrate',
        'deploy',
        '--schema',
        'prisma/schema.prisma'
      ]

volumes:
  winwidget-rabbitmq-data:
    external: true
    name: ${RABBITMQ_DATA_VOLUME:?RABBITMQ_DATA_VOLUME must name the verified existing RabbitMQ volume}
