  database-restore-worker:
    image: ${DATABASE_RESTORE_IMAGE:?DATABASE_RESTORE_IMAGE is required}
    build:
      context: ..
      dockerfile: Dockerfile
      target: database-restore-runner
      args:
        APP_REVISION: ${DATABASE_RESTORE_REVISION:?DATABASE_RESTORE_REVISION is required}
    labels:
      com.winwidget.owner: maintenance
      com.winwidget.purpose: database-restore-worker
    environment: *database-restore-worker-env
    network_mode: host
    volumes:
      - type: bind
        source: ${DATABASE_RESTORE_STORAGE_DIR:?DATABASE_RESTORE_STORAGE_DIR is required}
        target: /var/lib/winwidget/database-restores
    secrets:
      - source: core-postgres-admin-password
        target: database-restore-core-admin-password
      - source: notification-delivery-postgres-admin-password
        target: database-restore-notification-delivery-admin-password
      - source: campaigns-postgres-admin-password
        target: database-restore-campaigns-admin-password
      - source: reporting-postgres-admin-password
        target: database-restore-reporting-admin-password
      - source: widgets-postgres-admin-password
        target: database-restore-widgets-admin-password
      - source: billing-postgres-admin-password
        target: database-restore-billing-admin-password
      - source: identity-postgres-admin-password
        target: database-restore-identity-admin-password
    tmpfs:
      - /run/database-restore-secrets:rw,noexec,nosuid,nodev,size=64k,mode=0700
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - KILL
      - SETGID
      - SETUID
    healthcheck:
      test:
        [
          'CMD',
          'su-exec',
          'nestjs:nodejs',
          'node',
          '-e',
          'const fs=require(''node:fs'');const root=''/var/lib/winwidget/database-restores'';const v=JSON.parse(fs.readFileSync(root+''/worker-ready.json'',''utf8''));const fences=fs.readdirSync(root+''/fences'').filter(name=>name.endsWith(''.json''));if(v.version!==1||v.revision!==process.env.APP_REVISION||JSON.stringify(v.targets)!==''["billing","campaigns","core","identity","notification-delivery","reporting","widgets"]''||fences.length!==0)process.exit(1)'
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 45s
    restart: unless-stopped
    mem_limit: ${DATABASE_RESTORE_MEMORY_LIMIT:-256m}
    mem_reservation: ${DATABASE_RESTORE_MEMORY_RESERVATION:-64m}
    cpus: ${DATABASE_RESTORE_CPUS:-0.5}
