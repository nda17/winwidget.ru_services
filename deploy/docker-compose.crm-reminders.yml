# Explicit reminder activation overlay for docker-compose.crm.yml only.
# Initial activation requires its separate scope. After activation, code-only
# upgrades retain this overlay only with the approved task-reminders-v1 marker.
services:
  crm-sales-api:
    environment:
      CRM_TASK_REMINDERS_ENABLED: '${CRM_TASK_REMINDERS_ENABLED:?CRM_TASK_REMINDERS_ENABLED is required}'
      CRM_SALES_NOTIFICATION_DELIVERY_TOKEN: ${CRM_SALES_NOTIFICATION_DELIVERY_TOKEN:?CRM_SALES_NOTIFICATION_DELIVERY_TOKEN is required}
      NOTIFICATION_DELIVERY_CRM_SALES_TOKEN: ${NOTIFICATION_DELIVERY_CRM_SALES_TOKEN:?NOTIFICATION_DELIVERY_CRM_SALES_TOKEN is required}
      NOTIFICATION_DELIVERY_INTERNAL_BASE_URL: http://127.0.0.1:4401

  crm-sales-reminders:
    profiles: [crm-reminders]
    image: ${CRM_SALES_IMAGE:?CRM_SALES_IMAGE is required}
    command: ['node', 'dist/src/main-reminders.js']
    network_mode: host
    user: '1001:1001'
    read_only: true
    tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=64m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    labels:
      com.winwidget.owner: crm-sales
      com.winwidget.purpose: reminders
      com.winwidget.singleton: 'true'
    environment:
      NODE_ENV: production
      MODE: production
      APP_REVISION: ${CRM_SALES_REVISION:?CRM_SALES_REVISION is required}
      CRM_SALES_PROCESS_ROLE: reminders
      CRM_SALES_REMINDERS_PORT: '5331'
      CRM_TASK_REMINDERS_ENABLED: '${CRM_TASK_REMINDERS_ENABLED:?CRM_TASK_REMINDERS_ENABLED is required}'
      CRM_SALES_DATABASE_URL: ${CRM_SALES_REMINDERS_DATABASE_URL:?CRM_SALES_REMINDERS_DATABASE_URL is required}
      CRM_ACCESS_INTERNAL_BASE_URL: ${CRM_ACCESS_INTERNAL_BASE_URL:-http://127.0.0.1:5300}
      CRM_ACCESS_CRM_SALES_TOKEN: ${CRM_ACCESS_CRM_SALES_TOKEN:?CRM_ACCESS_CRM_SALES_TOKEN is required}
      CRM_SALES_NOTIFICATION_DELIVERY_TOKEN: ${CRM_SALES_NOTIFICATION_DELIVERY_TOKEN:?CRM_SALES_NOTIFICATION_DELIVERY_TOKEN is required}
      NOTIFICATION_DELIVERY_CRM_SALES_TOKEN: ${NOTIFICATION_DELIVERY_CRM_SALES_TOKEN:?NOTIFICATION_DELIVERY_CRM_SALES_TOKEN is required}
      NOTIFICATION_DELIVERY_INTERNAL_BASE_URL: http://127.0.0.1:4401
      RABBITMQ_URL: ${CRM_SALES_REMINDERS_RABBITMQ_URL:?CRM_SALES_REMINDERS_RABBITMQ_URL is required}
      RABBITMQ_CONNECTION_NAME: winwidget-crm-sales-reminders
    mem_limit: ${CRM_WORKER_MEMORY_LIMIT:?CRM_WORKER_MEMORY_LIMIT is required}
    memswap_limit: ${CRM_WORKER_MEMORY_LIMIT:?CRM_WORKER_MEMORY_LIMIT is required}
    cpus: ${CRM_WORKER_CPUS:?CRM_WORKER_CPUS is required}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5331/health/ready',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 45s
