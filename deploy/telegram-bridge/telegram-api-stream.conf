stream {
	limit_conn_zone $binary_remote_addr zone=telegram_api_per_ip:10m;
	log_format telegram_api_stream
		'$remote_addr [$time_local] $protocol $status '
		'$bytes_sent $bytes_received $session_time';
	access_log /var/log/nginx/telegram-api-stream.access.log telegram_api_stream;
	error_log /var/log/nginx/telegram-api-stream.error.log warn;

	upstream winwidget_telegram_api_tls {
		server api.telegram.org:443 max_fails=3 fail_timeout=10s;
	}

	server {
		listen 8443;
		listen [::]:8443;

		proxy_pass winwidget_telegram_api_tls;
		proxy_connect_timeout 10s;
		proxy_timeout 11m;
		proxy_socket_keepalive on;
		limit_conn telegram_api_per_ip 32;
	}
}
