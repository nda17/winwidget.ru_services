upstream winwidget_api_origin {
	server api.winwidget.ru:443;
	keepalive 16;
}

server {
	listen 80;
	listen [::]:80;
	server_name tg.winwidget.ru;

	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name tg.winwidget.ru;

	ssl_certificate /etc/letsencrypt/live/tg.winwidget.ru/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/tg.winwidget.ru/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	client_max_body_size 1m;

	access_log /var/log/nginx/tg.winwidget.ru.access.log;
	error_log /var/log/nginx/tg.winwidget.ru.error.log warn;

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	location = /api/v1/telegram-auth/webhook {
		limit_except POST {
			deny all;
		}

		proxy_pass https://winwidget_api_origin;
		proxy_ssl_server_name on;
		proxy_ssl_name api.winwidget.ru;
		proxy_http_version 1.1;
		proxy_set_header Host api.winwidget.ru;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
		proxy_request_buffering off;
		proxy_buffering off;
		proxy_connect_timeout 5s;
		proxy_read_timeout 15s;
		proxy_send_timeout 15s;
	}

	location = /api/v1/telegram-bot/webhook {
		limit_except POST {
			deny all;
		}

		proxy_pass https://winwidget_api_origin;
		proxy_ssl_server_name on;
		proxy_ssl_name api.winwidget.ru;
		proxy_http_version 1.1;
		proxy_set_header Host api.winwidget.ru;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
		proxy_request_buffering off;
		proxy_buffering off;
		proxy_connect_timeout 5s;
		proxy_read_timeout 15s;
		proxy_send_timeout 15s;
	}

	location = /api/v1/telegram-bot/support-webhook {
		limit_except POST {
			deny all;
		}

		proxy_pass https://winwidget_api_origin;
		proxy_ssl_server_name on;
		proxy_ssl_name api.winwidget.ru;
		proxy_http_version 1.1;
		proxy_set_header Host api.winwidget.ru;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
		proxy_request_buffering off;
		proxy_buffering off;
		proxy_connect_timeout 5s;
		proxy_read_timeout 15s;
		proxy_send_timeout 15s;
	}

	location = /api/v1/telegram-bot/webhook-health {
		limit_except GET {
			deny all;
		}

		proxy_pass https://winwidget_api_origin;
		proxy_ssl_server_name on;
		proxy_ssl_name api.winwidget.ru;
		proxy_http_version 1.1;
		proxy_set_header Host api.winwidget.ru;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_connect_timeout 5s;
		proxy_read_timeout 15s;
		proxy_send_timeout 15s;
	}

	location / {
		return 404;
	}
}
