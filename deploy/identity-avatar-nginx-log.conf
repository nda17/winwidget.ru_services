# Privacy-bounded observation log used only during the Identity avatar soak.
# `$uri` is Nginx's normalized path and never contains the query string.
map "$remote_addr|$host|$uri" $winwidget_identity_avatar_path_class {
	default "";
	~^[^|]+\|api\.winwidget\.ru\|/api/v1/files(?:/|$) api-v1-files;
	~^[^|]+\|api\.winwidget\.ru\|/uploads(?:/|$) uploads;
	~^127\.0\.0\.1\|api\.winwidget\.ru\|/\.well-known/winwidget/identity-avatar-media/soak-probe/__IDENTITY_AVATAR_SERVER_REVISION__/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ soak-probe;
}

map $winwidget_identity_avatar_path_class $winwidget_identity_avatar_loggable {
	default 1;
	"" 0;
}

log_format winwidget_identity_avatar_media escape=json
	'{"timestamp":"$time_iso8601","host":"$host","pathClass":"$winwidget_identity_avatar_path_class","method":"$request_method","status":$status}';

access_log /var/log/nginx/winwidget.identity-avatar-backend.access.log
	winwidget_identity_avatar_media if=$winwidget_identity_avatar_loggable;
