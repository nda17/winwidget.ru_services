location = /.well-known/winwidget/identity-avatar-media/client-ready-v1.json {
	alias /var/lib/winwidget/identity-avatar-public/client-ready-v1.json;
	default_type application/json;
	add_header Cache-Control "no-store, max-age=0" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Winwidget-Revision "__IDENTITY_AVATAR_SERVER_REVISION__" always;
	limit_except GET { deny all; }
}

