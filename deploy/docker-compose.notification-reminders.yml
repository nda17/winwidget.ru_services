# Explicit compatible reader overlay for docker-compose.prod.yml only.
# Deploy the reader/migration/ACL before the Sales producer overlay.
services:
  notification-delivery-worker:
    environment:
      CRM_SALES_INTERNAL_BASE_URL: http://127.0.0.1:5330
      CRM_SALES_NOTIFICATION_DELIVERY_TOKEN: ${CRM_SALES_NOTIFICATION_DELIVERY_TOKEN:?CRM_SALES_NOTIFICATION_DELIVERY_TOKEN is required}
      NOTIFICATION_DELIVERY_CRM_SALES_TOKEN: ${NOTIFICATION_DELIVERY_CRM_SALES_TOKEN:?NOTIFICATION_DELIVERY_CRM_SALES_TOKEN is required}
      NOTIFICATION_DELIVERY_KINDS: email,telegram,payment-email,payment-telegram,limit-email,limit-telegram,campaign-email,campaign-telegram,daily-summary-delivery-telegram,subscription-expiry-email,subscription-expiry-telegram,wincrm-invitation-email,wincrm-task-reminder-email,wincrm-task-reminder-telegram
